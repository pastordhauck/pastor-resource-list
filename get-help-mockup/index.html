<!doctype html><html lang="en"><head><meta charset="utf-8">
<title>Get help (mockup)</title>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;1,9..144,500&family=Inter:wght@400;500;600;700&display=swap">
<style>
/* MOCKUP (Daniel, 11 Nov 2026): the new Get help tab, built from his verdicts on 50 layout ideas. PC first. Draft only.
   Colors come only from the app's style variables (--bg --glass --glass2 --edge --ink --muted --dim --gold --gold2), so all 16 styles work. */
:root{--bg:#141414;--glass:rgba(36,34,31,.62);--glass2:rgba(42,40,36,.94);--edge:rgba(240,230,210,.14);--ink:#f2efe9;--muted:#a8a39a;--dim:#77726a;--gold:#d4af5a;--gold2:#e6c886;
  --serif:"Fraunces",Georgia,"Times New Roman",serif;--sans:"Inter",system-ui,"Segoe UI",Roboto,sans-serif;--ease:cubic-bezier(.22,.7,.18,1);--slow:.9s;color-scheme:dark}
html{--now:#d9705a;--today:var(--gold);--week:color-mix(in srgb,var(--gold) 45%,var(--dim));--later:#5fa98a}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);font:15px/1.5 var(--sans);-webkit-text-size-adjust:100%}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
a{color:inherit}
[hidden]{display:none!important}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
/* ---- top bar and tab bar: the same as the rest of the app ---- */
.top{position:fixed;inset:0 0 auto;z-index:80;background:var(--bg)}
.top .in{display:flex;align-items:center;gap:12px;height:58px;padding:0 16px}
.brand{display:flex;align-items:center;gap:8px;font:700 14px var(--sans);white-space:nowrap;text-decoration:none}
.brand i{width:10px;height:10px;border-radius:50%;background:var(--gold);box-shadow:0 0 14px var(--gold)}
.seg{display:flex;background:var(--glass);border:1px solid var(--edge);border-radius:999px;padding:3px;flex:none}
.seg :is(a,button){border:0;background:none;border-radius:999px;padding:5px 12px;font-size:13px;line-height:19.5px;color:var(--muted);white-space:nowrap;text-decoration:none;transition:background .4s var(--ease),color .3s}
.seg a:hover{color:var(--ink)}
.seg button[aria-pressed=true]{background:var(--gold);color:#1b1404;font-weight:600}
.trail{display:flex;align-items:center;gap:6px;min-width:0;flex:1;font-size:13px;white-space:nowrap;overflow:hidden}
.trail button{background:none;border:0;padding:4px 2px;color:var(--muted)}.trail button:last-of-type{color:var(--ink);font-weight:600}.trail span{color:var(--dim)}
.mock{font:600 10px var(--sans);letter-spacing:.14em;text-transform:uppercase;color:var(--gold2);border:1px solid var(--edge);border-radius:999px;padding:3px 9px;margin-left:8px}
.tools{display:inline-flex;gap:8px;flex:none;position:relative}
.tools>button{width:34px;height:34px;padding:0;border:1px solid var(--edge);background:var(--glass);border-radius:999px;font:700 15px system-ui;display:grid;place-items:center;transition:transform .3s var(--ease),border-color .3s}
.tools>button:hover{transform:translateY(-1px);border-color:var(--gold)}
#setp{position:absolute;right:0;top:44px;width:300px;background:var(--glass2);backdrop-filter:blur(14px);border:1px solid var(--edge);border-radius:16px;padding:14px;box-shadow:0 18px 50px rgba(0,0,0,.35);z-index:90;animation:rise .35s var(--ease) both}
#setp .grid{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:8px}
#setp .grid button{border:1px solid var(--edge);background:none;border-radius:10px;padding:7px 8px;font-size:12.5px;text-align:left}
#setp .grid button[aria-pressed=true]{border-color:var(--gold);color:var(--gold2);font-weight:600}
#ghTabs{position:fixed;left:0;right:0;top:58px;z-index:79;display:flex;justify-content:center;gap:28px;height:48px;background:var(--bg);border-bottom:1px solid var(--edge);padding-inline:16px;overflow-x:auto;scrollbar-width:none}
#ghTabs::-webkit-scrollbar{display:none}
#ghTabs button{flex:none;background:none;border:0;border-bottom:2px solid transparent;color:var(--muted);font:500 15px var(--sans);padding:0 2px;white-space:nowrap;transition:color .3s,border-color .3s}
#ghTabs button:hover{color:var(--ink)}
#ghTabs button[aria-selected=true]{color:var(--ink);font-weight:600;border-bottom-color:var(--gold)}
/* ---- layers: the Map room zoom between tabs ---- */
#stage{position:fixed;inset:0}
.layer{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;opacity:0;visibility:hidden;transform:scale(.82);filter:blur(10px);
  transition:transform var(--slow) var(--ease),opacity var(--slow) var(--ease),filter var(--slow) var(--ease),visibility 0s linear var(--slow);padding:126px 16px 110px}
.layer.on{opacity:1;visibility:visible;transform:none;filter:none;transition-delay:0s}
.layer.past{opacity:0;transform:scale(1.45);filter:blur(12px)}
.layer.snap{transition:none!important}
.layer.on.fresh [data-rise]{animation:rise .9s var(--ease) both;animation-delay:calc(.25s + var(--k,0) * 90ms)}
@keyframes rise{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.layer,.layer.past{transform:none!important;filter:none!important;transition:opacity .3s,visibility 0s linear .3s}.layer.on{transition:opacity .3s}.layer.on.fresh [data-rise],#setp{animation:none}}
.wrap{max-width:1300px;margin:0 auto}
/* ---- shared parts ---- */
.eyebrow{font:600 11px var(--sans);letter-spacing:.18em;text-transform:uppercase;color:var(--gold2)}
h1{font:600 clamp(26px,3vw,36px)/1.1 var(--serif);margin:0;text-wrap:balance}
h2{font:600 22px/1.2 var(--serif);margin:0}
h3{font:600 17px/1.25 var(--serif);margin:0}
.lead{color:var(--muted);margin:6px 0 0}
.hero{text-align:center;margin:6px 0 18px}
.sbar{display:flex;gap:8px;align-items:center;width:min(640px,100%);margin:0 auto;background:var(--glass);border:1px solid var(--edge);border-radius:999px;padding:6px 6px 6px 18px;transition:border-color .3s,box-shadow .3s}
.sbar:focus-within{border-color:var(--gold);box-shadow:0 0 0 4px color-mix(in srgb,var(--gold) 15%,transparent)}
.sbar input{flex:1;min-width:0;background:none;border:0;outline:none;height:34px}
.sbar input::placeholder{color:var(--dim)}
.sbar .lens{color:var(--muted)}
.mic{flex:none;width:34px;height:34px;border-radius:50%;border:1px solid var(--edge);background:none;font-size:15px;padding:0}.mic.on{background:var(--now);border-color:var(--now)}
.go{flex:none;height:36px;border:0;border-radius:999px;background:var(--gold);color:#1b1404;font:600 13px var(--sans);padding:0 18px;transition:transform .3s var(--ease)}
.go:hover,.btn:hover{transform:translateY(-1px)}
.pills{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:12px 0 0}
.pill{text-decoration:none;border:1px solid var(--edge);background:var(--glass);border-radius:999px;padding:7px 15px;font-size:14px;line-height:21px;transition:transform .3s var(--ease),border-color .3s,background .3s}
.pill:hover{transform:translateY(-1px);border-color:var(--gold)}
.pill[aria-pressed=true]{border-color:var(--gold);background:color-mix(in srgb,var(--gold) 16%,transparent);font-weight:600}
.pill.sm{padding:4px 11px;font-size:12.5px;line-height:18px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--edge);background:var(--glass2);border-radius:999px;padding:7px 14px;font-size:13px;text-decoration:none;white-space:nowrap;transition:transform .3s var(--ease),background .3s,border-color .3s}
.btn:hover{border-color:var(--gold)}
.btn.gold{background:var(--gold);border-color:var(--gold);color:#1b1404;font-weight:600}
.btn.big{padding:10px 20px;font-size:14px}
.btn.on{border-color:var(--gold);color:var(--gold2)}
.tx{background:none;border:0;padding:0;color:var(--gold2);font-size:13px;text-decoration:underline;text-underline-offset:3px}
.panel{background:var(--glass);border:1px solid var(--edge);border-radius:16px;padding:16px}
.note{font-size:12.5px;color:var(--muted)}
.num{font-variant-numeric:tabular-nums;font-weight:600;color:var(--gold2);text-decoration:none;white-space:nowrap}
a.num:hover{text-decoration:underline}
.acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.row{padding:12px 0;border-bottom:1px solid var(--edge)}
.row .t{font-weight:600;line-height:1.3}.row .m{color:var(--muted);font-size:13px;margin-top:2px}
.toast{position:fixed;left:50%;bottom:84px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:999px;font-weight:600;font-size:13px;z-index:95;animation:rise .3s var(--ease) both;max-width:calc(100% - 32px)}
input.f,textarea.f,select.f{width:100%;background:var(--glass);border:1px solid var(--edge);border-radius:10px;padding:8px 10px;outline:none}
input.f:focus,textarea.f:focus,select.f:focus{border-color:var(--gold)}
textarea.f{resize:vertical;min-height:84px;line-height:1.45}
label.ck{display:flex;gap:9px;align-items:center;padding:7px 0;font-size:14px;cursor:pointer}label.ck input{width:16px;height:16px;accent-color:var(--gold);flex:none}label.ck .m{margin-left:auto;white-space:nowrap;padding-left:8px;color:var(--muted);font-size:12.5px}
/* the quiet 911 · 988 · 211 row */
.hot3{display:grid;grid-template-columns:repeat(3,1fr);border:1px solid var(--edge);border-radius:999px;margin:0 0 16px;font-size:13px;color:var(--muted)}
.hot3 a{display:flex;gap:9px;align-items:baseline;justify-content:center;padding:8px 14px;text-decoration:none;white-space:nowrap;overflow:hidden}
.hot3 a+a{border-left:1px solid var(--edge)}
.hot3 b{font:600 15px var(--sans);color:var(--ink);font-variant-numeric:tabular-nums}
/* ---- Someone's calling ---- */
.desk{display:grid;grid-template-columns:330px minmax(0,1fr);gap:28px;margin-top:22px;align-items:start}
.cc .hd{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px}
.cc .hd span:last-child{font-size:12px;color:var(--muted)}
.cc label{display:grid;grid-template-columns:54px 1fr;align-items:center;gap:8px;font-size:13px;color:var(--muted);margin-top:4px}
.cc input{background:none;border:0;border-bottom:1px solid transparent;outline:none;padding:4px 0;font-size:14.5px;color:var(--ink);width:100%}
.cc input:hover,.cc input:focus{border-bottom-color:var(--edge)}
.oval{border:1px solid var(--edge);border-radius:26px;padding:14px 20px;margin:14px 0 0;font:italic 500 18px/1.35 var(--serif);background:var(--glass)}
.lbl{font:600 11px var(--sans);letter-spacing:.16em;text-transform:uppercase;color:var(--muted);margin:22px 0 10px}
/* call notes: one thin line that goes from red to green, with a stop at each step */
.steps{position:relative;padding-left:22px}
.steps::before{content:"";position:absolute;left:4px;top:8px;bottom:8px;width:2px;border-radius:2px;background:linear-gradient(var(--now),var(--today) 50%,var(--later))}
.step{position:relative;padding:0 0 16px}
.step::before{content:"";position:absolute;left:-22px;top:5px;width:10px;height:10px;border-radius:50%;background:var(--bg);border:2px solid var(--c,var(--gold))}
.step .k{font:600 11px var(--sans);letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.step q{display:block;font:italic 500 16px/1.4 var(--serif);margin-top:4px;quotes:"“" "”"}
.fu{display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--edge)}
.fu>div{flex:1;min-width:0}.fu .t{font-weight:600}.fu .m{font-size:13px;color:var(--muted)}
.fu input{background:none;border:0;border-bottom:1px solid var(--edge);outline:none;font-size:13px;color:var(--muted);width:100%;padding:2px 0}
.ladder{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:20px}
.col{position:relative;padding-top:14px}
.col::before{content:"";position:absolute;left:0;right:0;top:0;height:2px;border-radius:2px;background:var(--c);box-shadow:0 0 12px var(--c)}
.col>h3 small{display:block;font:400 12px var(--sans);color:var(--muted);margin-top:2px}
.col.focus>h3{color:var(--gold2)}
.col .row:last-child{border-bottom:0}
.col .row .num{display:inline-block;margin-top:5px;font-size:14.5px}
/* ---- Find help ---- */
.find{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:36px;margin-top:26px;align-items:start}
.sech{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:0 0 6px}
.sech h2{margin-right:auto}
.sech .seg button{font-size:12.5px;padding:4px 12px}
.lrow{display:grid;grid-template-columns:44px minmax(0,1fr) auto auto;gap:16px;align-items:center;padding:13px 0;border-bottom:1px solid var(--edge)}
.lrow .n{font:500 20px var(--serif);color:var(--muted);text-align:center;line-height:1}.lrow .n small{display:block;font:500 10.5px var(--sans);letter-spacing:.06em;margin-top:4px}
.lrow .num{font-size:16px}
.grp{font:600 11px var(--sans);letter-spacing:.16em;text-transform:uppercase;color:var(--muted);padding:16px 0 6px;border-bottom:1px solid var(--edge);display:flex;gap:8px;align-items:center}
.grp i{width:8px;height:8px;border-radius:50%;background:var(--c)}
table.tb{width:100%;border-collapse:collapse;font-size:14px}
.tb th{font:600 11px var(--sans);letter-spacing:.14em;text-transform:uppercase;color:var(--muted);text-align:left;padding:10px 10px 10px 0;border-bottom:1px solid var(--edge)}
.tb td{padding:11px 10px 11px 0;border-bottom:1px solid var(--edge);vertical-align:top}
.tb td .m{color:var(--muted);font-size:12.5px}
.mapv{display:grid;grid-template-columns:minmax(0,460px) minmax(0,1fr);gap:28px;align-items:start}
.mapv svg{width:100%;height:auto;border:1px solid var(--edge);border-radius:16px;background:var(--glass)}
.mapv text{font:500 11px var(--sans);fill:var(--ink)}.mapv text.q{fill:var(--muted)}
.rail h3{margin:0 0 4px}.rail .blk{padding:14px 0;border-bottom:1px solid var(--edge)}.rail .blk:first-of-type{padding-top:8px}
.dock{position:fixed;left:0;right:0;bottom:0;z-index:70;background:var(--glass2);border-top:1px solid var(--edge);backdrop-filter:blur(12px);padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));transition:transform .5s var(--ease)}
.dock.off{transform:translateY(110%)}
.dock .in{max-width:1300px;margin:0 auto;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.dock .in span{margin-right:auto;font-size:13px;color:var(--muted)}
/* ---- Care and mental health ---- */
.care{display:grid;grid-template-columns:250px minmax(0,1fr);gap:40px;margin-top:26px;align-items:start}
.topics button{display:block;width:100%;text-align:left;background:none;border:0;border-left:2px solid transparent;border-bottom:1px solid var(--edge);padding:13px 14px;color:var(--muted);transition:color .3s,background .3s,border-color .3s}
.topics button:hover{color:var(--ink)}
.topics button[aria-pressed=true]{color:var(--ink);font-weight:600;border-left-color:var(--gold);background:var(--glass)}
.path{border:1px solid var(--edge);border-radius:16px;overflow:hidden;margin-top:12px}
.prow{display:grid;grid-template-columns:170px minmax(0,1fr) auto;gap:22px;padding:18px 20px;border-left:2px solid var(--c);align-items:start}
.prow+.prow{border-top:1px solid var(--edge)}
.prow .k{font:600 11px var(--sans);letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.prow .r{text-align:right;display:grid;gap:4px;justify-items:end;font-size:13px;color:var(--muted)}
/* ---- My follow-ups, ongoing care ---- */
.cols3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:24px;margin-top:22px;align-items:start}
.people{display:flex;gap:8px;flex-wrap:wrap;align-items:center;justify-content:center;margin-top:14px}
.foot{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:28px}
.foot .note{margin-left:auto}
.addf{display:grid;grid-template-columns:1fr 1.4fr 150px auto auto;gap:8px;margin-top:14px}
.pers{display:grid;grid-template-columns:290px minmax(0,1fr) 320px;gap:36px;margin-top:20px;align-items:start}
.pers .who{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.pers select{background:var(--glass);border:1px solid var(--edge);border-radius:999px;padding:8px 14px;font:600 17px var(--serif);outline:none;max-width:100%}
.bigq{font:italic 500 22px/1.4 var(--serif);margin:8px 0 12px;text-wrap:pretty}
.stop{position:relative;padding:0 0 16px}
/* ---- referral sheet ---- */
.sheet{display:grid;grid-template-columns:400px minmax(0,1fr);gap:36px;margin-top:20px;align-items:start}
#paper{background:#f1ebde;color:#2a2620;border-radius:6px;padding:38px 40px;font-size:14px;box-shadow:0 14px 44px rgba(0,0,0,.28)}
#paper .e{font:600 10.5px var(--sans);letter-spacing:.18em;text-transform:uppercase;color:#7a6f5c}
#paper h2{font:600 26px/1.15 var(--serif);margin:6px 0 2px;color:#2a2620}
#paper .pr{display:flex;justify-content:space-between;gap:16px;align-items:baseline;padding:12px 0;border-bottom:1px solid rgba(42,38,32,.16)}
#paper .pr b{font-weight:600}#paper .pr small{display:block;color:#6b6252;font-size:12.5px}
#paper .pn{font:600 19px var(--serif);white-space:nowrap;font-variant-numeric:tabular-nums}
#paper .box{background:rgba(42,38,32,.07);border-radius:6px;padding:12px 16px;margin-top:16px;display:flex;justify-content:space-between;align-items:center}
#paper ol{margin:6px 0 0;padding-left:20px;color:#4a443a}
#paper .msg{font:italic 500 16px/1.45 var(--serif);border-top:1px solid rgba(42,38,32,.25);margin-top:20px;padding-top:16px}
@media (max-width:1000px){
  .desk,.find,.care,.pers,.sheet,.mapv,.cols3{grid-template-columns:minmax(0,1fr)}
  .ladder{grid-template-columns:repeat(2,minmax(0,1fr))}
  .brand span,.trail,.tools>button:not(#gear){display:none}.top .in{justify-content:space-between}
  #ghTabs{justify-content:flex-start;gap:22px}
  .hot3 a{flex-direction:column;align-items:center;gap:0;font-size:11.5px;white-space:normal;text-align:center;padding:6px}.hot3{border-radius:16px}
  .lrow{grid-template-columns:36px minmax(0,1fr);gap:10px}.lrow>.num,.lrow>.acts{grid-column:2;margin:0}
  .prow{grid-template-columns:1fr}.prow .r{text-align:left;justify-items:start}
  .addf{grid-template-columns:1fr}
  .topics{display:flex;overflow-x:auto;gap:6px}.topics button{width:auto;flex:none;border:1px solid var(--edge);border-radius:999px;padding:6px 13px}
  #paper{padding:24px 20px}.seg :is(a,button){padding:5px 9px;font-size:12px}
}
@media (max-width:560px){.ladder{grid-template-columns:minmax(0,1fr)}.tb th:nth-child(2),.tb td:nth-child(2){display:none}}
@media print{html,body{overflow:visible;height:auto;background:#fff}.top,#ghTabs,.dock,.toast,.layer:not(#L-sheet),.sheet>div:first-child,.back,#L-sheet .hero{display:none!important}
  #stage,.layer{position:static;opacity:1;visibility:visible;transform:none;filter:none;padding:0;overflow:visible}.sheet{display:block;margin:0}#paper{box-shadow:none;background:#fff}#paperNote{display:none}}
</style>
<style>html[data-style="light"]{color-scheme:light;--bg:#f4f1ea;--glass:rgba(255,255,255,.72);--glass2:rgba(255,255,255,.94);--edge:rgba(30,40,70,.16);--ink:#161a24;--muted:#565d70;--dim:#80879a;--gold:#b8892c;--gold2:#8a6516;

  --card1:#111;--card2:#000;--topbg:#000;--homebg:#000;--roombg:#000;--side:#000}html[data-style="linen"]{color-scheme:light;--bg:#f4f1eb;--glass:rgba(255,255,255,.9);--glass2:#fbfaf7;--edge:rgba(40,38,48,.14);--ink:#2b2a31;--muted:#66626d;--dim:#95919b;

  --gold:#b897a9;--gold2:#d6c0cc;--card1:#2a2730;--card2:#1e1c22;--topbg:rgba(24,23,28,.92);--homebg:#2a2530;--roombg:#201e25;--side:rgba(40,38,46,.75)}html[data-style="gray"]{color-scheme:light;--bg:#f6f6f6;--glass:rgba(255,255,255,.94);--glass2:#fff;--edge:rgba(0,0,0,.14);--ink:#161616;--muted:#555;--dim:#888;
  --gold:#3d3d3d;--gold2:#222;--card1:#ececec;--card2:#e2e2e2;--topbg:rgba(246,246,246,.94);--homebg:#ececec;--roombg:#e6e6e6;--side:rgba(255,255,255,.7)}html[data-style="light"]{color-scheme:light;--bg:#e9e1d3;--surface:#f3ede2;--surface2:#e0d5c2;--glass:rgba(247,242,233,.78);--glass2:rgba(247,242,233,.95);--edge:rgba(60,45,25,.16);--line:rgba(60,45,25,.16);--ink:#1f1b16;--muted:#5c5446;--dim:#857a68;--gold:#a87a2a;--gold2:#7d5a18;--goldlight:#7d5a18;--fx-p1:#e3d9c8;--fx-p2:#f3ede2;--fx-p2a:rgba(243,237,226,.94);--fx-p3:#ddd1bd;--fx-topbg:rgba(233,225,211,.94)}html[data-style="dark"]{color-scheme:dark;${DARK}</style><script>// Color styles added 11 Nov 2026 (Daniel: "add in the study parchment, the private bank slate, the charcoal and gold ... use charcoal
// and gold to replace our current dark navy ... keep the other colors"). Shared by the main app, Serve and Speakers so all three match.
// The default Dark becomes Charcoal and gold; Study parchment and Private bank slate are new light styles that get every Light-only rule.
(() => {
  // Light was retired 11 Nov 2026: anyone who had it gets Study parchment (the nearest match); the parent's write reaches Serve and Speakers too
  // Soft linen retired too (11 Nov 2026) and goes to parchment; a dropped draft style goes back to Dark
  const GONE = {light: "parchment", linen: "parchment", bank: "parchment", d_sanctuary: "dark", d_riverstone: "dark", d_cedar: "dark", d_olive: "dark", d_aubergine: "dark", d_covenant: "dark", d_ivory: "dark", d_sage: "dark", d_oat: "parchment", d_midnight: "dark", d_walnut: "dark", d_desert: "dark"};
  try { const s = localStorage.getItem("prl-style"); if (GONE[s]) localStorage.setItem("prl-style", GONE[s]); } catch (e) {}
  { const s = document.documentElement.dataset.style; if (GONE[s]) { if (GONE[s] === "dark") delete document.documentElement.dataset.style; else document.documentElement.dataset.style = GONE[s]; } }
  const DARK ="--bg:#141414;--room:#181818;--wall:#1c1c1c;--surface:#1f1f1f;--surface2:#2a2826;--panel:#1f1f1f;--panel2:#2a2826;"
    + "--glass:rgba(36,34,31,.62);--glass2:rgba(42,40,36,.88);--edge:rgba(240,230,210,.14);--line:rgba(240,230,210,.14);"
    + "--ink:#f2efe9;--muted:#a8a39a;--fade:#a8a39a;--dim:#77726a;--gold:#d4af5a;--gold2:#e6c886;--goldlight:#e6c886;"
    + "--card1:#2a2824;--card2:#1d1c1a;--topbg:rgba(20,20,20,.92);--homebg:#2b2925;--roombg:#22211e;--side:rgba(36,34,31,.75);"
    + "--fx-p1:#181818;--fx-p2:#1f1f1f;--fx-p2a:rgba(31,31,31,.93);--fx-p3:#2a2826;--fx-topbg:rgba(20,20,20,.92)";
  const LIGHT = {
    parchment: "--bg:#e3d8c4;--room:#ddd0b8;--wall:#e8dfcd;--surface:#ede5d5;--surface2:#d6c8ad;--panel:#ede5d5;--panel2:#d6c8ad;"
      + "--glass:rgba(237,229,213,.82);--glass2:rgba(240,233,220,.96);--edge:rgba(60,45,25,.16);--line:rgba(60,45,25,.16);"
      + "--ink:#2a2318;--muted:#685d4a;--fade:#685d4a;--dim:#8a7d68;--gold:#8c5a2b;--gold2:#6d4420;--goldlight:#6d4420;"

  const DRAFTS = [
    ["d_merlot", "Frost and merlot", 1, "#F1F0EC", "#FFFFFF", "#242731", "#555963", "#6B3347", "#FFFFFF"],
    ["d_mist", "Morning mist", 1, "#D1D9E0", "#E8ECEF", "#1C2B36", "#4A5D6B", "#2E5A7A", "#FFFFFF"],
    ["d_harvest", "Autumn harvest", 1, "#fdfbf7", "#f4efe6", "#382e28", "#6b5f57", "#9e5b43", "#ffffff"],
    ["d_alabaster", "Alabaster and sage", 1, "#f9f8f6", "#ffffff", "#2f332e", "#626760", "#587054", "#ffffff"],
    ["d_evergreen", "Deep evergreen", 0, "#121d1b", "#20302d", "#f3f0e8", "#b6c1b9", "#cf9675", "#17221f"],
    ["d_vespers", "Vespers", 0, "#0f141e", "#1a2130", "#eaecef", "#8b99a8", "#c29b62", "#12161f"],
    ["d_crimson", "Midnight crimson", 0, "#16161a", "#232329", "#f0f0f2", "#94949c", "#8c4a4a", "#ffffff"],
    ["d_petrol", "Petrol and sand", 0, "#0F2930", "#20444B", "#F2F1EA", "#BBCFD0", "#E1B17C", "#1D2A30"]];
  const rgb = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16));
  const hx = a => "#" + a.map(v => Math.round(Math.max(0, Math.min(255, v))).toString(16).padStart(2, "0")).join("");
  const mix = (a, b, t) => hx(rgb(a).map((v, i) => v * (1 - t) + rgb(b)[i] * t));
  const rgba = (h, a) => `rgba(${rgb(h).join(",")},${a})`;
  const mk = (bg, pn, ink, mu, ac, light) => { const p2 = light ? mix(bg, ink, .07) : mix(pn, "#ffffff", .06), g2 = light ? mix(ac, "#000000", .22) : mix(ac, "#ffffff", .25);
    return `--bg:${bg};--room:${p2};--wall:${mix(bg, pn, .5)};--surface:${pn};--surface2:${p2};--panel:${pn};--panel2:${p2};--glass:${rgba(pn, light ? .82 : .7)};--glass2:${rgba(pn, light ? .96 : .9)};`
      + `--edge:${rgba(ink, .14)};--line:${rgba(ink, .14)};--ink:${ink};--muted:${mu};--fade:${mu};--dim:${mix(mu, bg, .35)};--gold:${ac};--gold2:${g2};--goldlight:${g2};`
      + `--card1:${p2};--card2:${pn};--topbg:${rgba(bg, .94)};--homebg:${p2};--roombg:${p2};--side:${rgba(pn, .8)};--fx-p1:${p2};--fx-p2:${pn};--fx-p2a:${rgba(pn, .94)};--fx-p3:${p2};--fx-topbg:${rgba(bg, .94)}`; };
  const BTNTXT = {parchment: "#fff", bank: "#fff"}, DARKS = {};
  const HERO0 = {}, HV0 = {};
  for (const [id, , light, bg, pn, ink, mu, ac, bt] of DRAFTS) {
    (light ? LIGHT : DARKS)[id] = mk(bg, pn, ink, mu, ac, light); BTNTXT[id] = bt;
    HV0[id] = [ink, mu, light ? mix(ac, "#000000", .22) : ac]; if (light) HERO0[id] = [mix(ac, "#000000", .22), mu]; }
  const css = [`html:not([data-style]):root,html[data-style="dark"]:root{color-scheme:dark;${DARK}}`];
  for (const k in LIGHT) css.push(`html[data-style="${k}"]:root{color-scheme:light;${LIGHT[k]}}`);
  for (const k in DARKS) css.push(`html[data-style="${k}"]:root{color-scheme:dark;${DARKS[k]}}`);
  // every rule written for Light (button text, borders, pictures ...) also applies to the two new light styles
  for (const sh of document.styleSheets) { let rs; try { rs = sh.cssRules; } catch (e) { continue; }
    for (const r of rs) { const s = r.selectorText; if (!s || !s.includes('[data-style="light"]') || /^html\[data-style="light"\](:root)?$/.test(s.trim())) continue;
      for (const k in LIGHT) css.push(r.cssText.split('[data-style="light"]').join(`[data-style="${k}"]`)); } }
  // the two new light styles have darker buttons (brown, navy): white button text reads better there
  const BTN = ".findbtn,.go,.btn.gold,.rgo,.rmdone,.rqinfo .btn.gold,.rhead .rqadd,#appKitN,.seg button[aria-pressed=true],.segn button[aria-pressed=true],.langs button[aria-pressed=true],.ptabs button.on,.ptabs button[aria-current=true],.kittabs+*,.hubbar .findbtn,#planForm .findbtn,form#searchForm .findbtn,.seg button.on,.rqtile.hot .k";
  for (const k in BTNTXT) css.push(`html[data-style="${k}"] :is(${BTN}){color:${BTNTXT[k]}!important}`);
  // Serve's opening picture: its small lines were a fixed pale gold that only reads on dark pages (also on Light, Soft linen, Black and white)
  // (the picture area sets its own pale gold, so each style gets its own darker colors here)
  const HERO = {light: ["#7d5a18", "#4a4236"], linen: ["#6c5667", "#55515c"], gray: ["#222222", "#444444"], parchment: ["#6d4420", "#544a3a"], bank: ["#1f3760", "#47526a"], ...HERO0};
  // the picture area sets its own text, muted and gold colors (made for the old navy); give it each style's own instead
  const HV = {dark: ["#f2efe9", "#cfc9bf", "#d4af5a"], warm: ["#f6ece0", "#c9b49c", "#e8a85a"], forest: ["#e9f3ec", "#a3bfae", "#d9c27a"], coral: ["#fbeee9", "#d6b5ab", "#ff7a59"],
    dusk: ["#e7e4ea", "#aaa5b0", "#b897a9"], contrast: ["#ffffff", "#f0f0f0", "#ffd60a"], light: ["#1f1b16", "#4a4236", "#7d5a18"], linen: ["#2b2a31", "#55515c", "#6c5667"],
    gray: ["#161616", "#444444", "#222222"], parchment: ["#2a2318", "#544a3a", "#6d4420"], bank: ["#18202c", "#47526a", "#1f3760"], ...HV0};
  for (const k in HV) css.push(`${k === "dark" ? 'html:not([data-style]) .hero,' : ""}html[data-style="${k}"] .hero{--ink:${HV[k][0]}!important;--muted:${HV[k][1]}!important;--gold:${HV[k][2]}!important}`);
  for (const k in HERO) css.push(`html[data-style="${k}"] body .hero-links #heroPlan{background:rgba(255,255,255,.72)!important;color:${HERO[k][0]}!important}`);
  for (const k in HERO) css.push(`html[data-style="${k}"] .hero p{color:${HERO[k][1]}!important}html[data-style="${k}"] .hero :is(.eyebrow,.kicker,.text-btn,.text-btn *){color:${HERO[k][0]}!important}`);
  // Daniel, 11 Nov 2026: "if this is a color that is chosen, everything should match this color" (e.g. Plan to serve's "Tell the
  // coordinator" box stayed navy). Boxes Serve drew in fixed navy now take the chosen style's own panel color, in every style.
  css.push(`html :is(.pcard,#tellBox,.kitpanel,.invite){background:var(--glass)!important;border-color:var(--edge)!important}`
    + `html body .hero-links #heroPlan,html body .hero-links #heroPlan *{background:var(--glass2)!important;border-color:var(--edge)!important;color:var(--ink)!important}html body .hero-links #heroPlan *{background:none!important}`
    + `html #installBar{background:var(--glass2)!important;color:var(--ink)!important;border-color:var(--edge)!important}`);
  // Light styles: text Serve wrote in fixed pale colors (made for dark pages) now uses the style's own text colors, and small gold
  // labels use the deeper gold so they read on a light page
  const LF = 'html:is(' + ["light", "linen", "gray", ...Object.keys(LIGHT)].map(k => `[data-style="${k}"]`).join(",") + ')';
  css.push(`${LF} :is(.kitsteps>div,.vcard p.mh,.ppanel li,.why li,.kitintro h2,.kitintro p,.pcard,.pcard :is(p,span,b,h4,label,li),#tellBox :is(h4,label),.irow span){color:var(--ink)!important}`
    + `${LF} :is(.meta,.tags>span,.tag,.pcard .hint,.pcard .note,.note,.hint,.wtitle,#rTitle,.subhint){color:var(--muted)!important}`
    + `${LF} :is(.eyebrow,.text-btn,.prbtn,#vRef,.pveye,.preview-label,#wEye,#tEye,.btn.outline,#churchLink,.save-btn,.kitactions .btn.outline,#mbLead .on){color:var(--gold2)!important}`
    + `${LF} #chCopy h1{color:var(--ink)!important}${LF} #chCopy .chtown{color:var(--muted)!important}`
    + `${LF} :is(#mbDays,#mbFmt,#mbLead) button{color:var(--ink)!important;border-color:var(--edge)!important}`);
  // readability pass, 11 Nov 2026 (Daniel: "keep the color but fix what needs to be fixed for each one")
  const DF = 'html:is(' + Object.keys(DARKS).map(k => `[data-style="${k}"]`).join(",") + ')';
  css.push(`html[data-style="gray"] :is(${BTN}){color:#fff!important}html[data-style="gray"] #chForm .btn.gold{background:#3d3d3d!important}`   // Black and white: buttons are dark gray, so white text
    + `${DF} :is(.kitintro h2,.kitintro p){color:var(--ink)!important}${DF} #out .ghead,${DF} .ghead{color:var(--gold2)!important}`   // the kit headline and Speakers group headings were dark on dark
    + `html .scale span em{color:var(--muted)!important;font-weight:600}`   // Map room "Fewer / More" key
    // Midnight crimson: its red reads as a button color but is too dark for small text on the dark page, so small red text uses a lighter red
    + `html[data-style="d_crimson"] :is(.eyebrow,.k,#wEye,#tEye,.pveye,#vRef,.preview-label,.why summary,.chip.need,.igroup h4,.pcard h4,.pcard header b,b>a,span>b,.text-btn,.prbtn,#churchLink,.btn.outline,.save-btn,.kitlink button,.invite p,#mbLead .on,header>b,.meta .gold){color:#c98282!important}`
    + `html[data-style="d_crimson"] #pvStep{color:#fff!important}`
    // ChatGPT's readability review (11 Nov 2026): slightly stronger helper text and outlines per style, same colors, just a shade
    // further from the background ([muted text, outline border]; null = leave as is)
    + Object.entries({dark: ["#ada79d", "#92877a"], parchment: ["#625548", "#82705c"], d_vespers: ["#b8c0ce", "#8e98aa"], d_merlot: [null, "#827b83"],
        d_petrol: ["#c5d4d0", "#80a7a8"], d_mist: ["#465663", "#667b8b"], d_evergreen: ["#c0d0c8", "#91ab9c"], d_alabaster: ["#586a58", "#758974"],
        d_harvest: ["#5c4d43", null], d_crimson: ["#b6adb2", "#bc7e86"], forest: ["#b6c3b1", "#91a689"], warm: ["#c6b6a5", "#987c64"], dusk: ["#b6b0c0", "#988a9c"], coral: [null, "#b0776b"], gray: ["#525252", "#888888"]})
      .map(([k, [mu, bd]]) => { const s = k === "dark" ? 'html:not([data-style]),html[data-style="dark"]' : `html[data-style="${k}"]`;
        return (mu ? s.split(",").map(x => `${x}:root`).join(",") + `{--muted:${mu}!important;--fade:${mu}!important}` : "")
          + (bd ? s.split(",").map(x => `${x} :is(.btn.outline,.kitactions .btn,.acts .btn:not(.gold),.save-btn,.chip:not(.need))`).join(",") + `{border-color:${bd}!important}` : ""); }).join("")
    // Connect your church with its photo: the light styles had turned the headline dark on the dark photo (Daniel's phone, 11 Nov 2026)
    + `html body #chBand:has(#chPhoto[src]:not([src=""])) #chCopy :is(h1,h2,p,.eyebrow,.chtown,span){color:#fff!important;text-shadow:0 1px 10px rgba(0,0,0,.55)}`
    // Serve's bottom kit bar on phones was fixed navy with faint text; it now takes the chosen style's own colors
    + `html body .phone-kit{background:var(--glass2,var(--surface))!important;color:var(--ink)!important;border-top:1px solid var(--edge)!important}html body .phone-kit button{color:var(--gold2,var(--gold))!important;font-weight:700}`
    // Connect your church: the Save button had no fill in the ChatGPT/Gemini styles, so its text vanished
    + `html:is([data-style^="d_"],[data-style="parchment"]) #chForm .btn.gold{background:var(--gold)!important;border-color:var(--gold)!important}`);
  css.push(`html:is([data-style="light"],[data-style="linen"]) .acts .btn.gold{color:#1b1404!important}html:is([data-style="parchment"],[data-style="bank"]) .acts .btn.gold{color:#fff!important}`
    + Object.keys(BTNTXT).filter(k => k.startsWith("d_")).map(k => `html[data-style="${k}"] .acts .btn.gold{color:${BTNTXT[k]}!important}`).join("")
    + `html body form.sbar:not(.follow),html body #planForm.sbar{background:var(--glass)!important;border-color:var(--edge)!important}`);
  // ChatGPT's review (11 Nov 2026): the faded side cards in each row looked disabled. Keep them nearly full strength.
  css.push(".tile:not(.hot),.rqtile:not(.hot){opacity:.92!important}.rqtile:not(.hot):hover{opacity:1!important}");
  const st = document.createElement("style"); st.id = "stylePlus"; st.textContent = css.join("\n"); document.head.append(st);
  // the color pickers: Dark shows charcoal and gold, and the two new styles sit right after Light
  if (typeof STYLES !== "undefined" && Array.isArray(STYLES) && !STYLES.some(s => s[0] === "parchment")) {
    STYLES[0][2] = "#141414"; STYLES[0][3] = "#d4af5a";
    const li = STYLES.findIndex(s => s[0] === "light");
    // Daniel, 11 Nov 2026: of Light, Study parchment and Oat & Walnut keep only Study parchment (name stays); Light leaves the list
    STYLES.splice(li, 1, ["parchment", "Study parchment", "#e3d8c4", "#8c5a2b"]);   // Private bank slate removed by Daniel, 11 Nov 2026
    { const ln = STYLES.findIndex(s => s[0] === "linen"); if (ln >= 0) STYLES.splice(ln, 1); }

    STYLES.push(...DRAFTS.map(([id, name, light, bg, , , , ac]) => [id, name, bg, ac]));
    // Daniel, 11 Nov 2026: the default first, then the most professional and best looking; High contrast (an accessibility choice) last
    const ORDER = ["dark", "parchment", "d_vespers", "d_merlot", "d_petrol", "d_mist", "d_evergreen", "d_alabaster", "d_harvest", "d_crimson", "forest", "warm", "dusk", "coral", "gray", "contrast"];
    const rank = v => { const i = ORDER.indexOf(v); return i < 0 ? 99 : i; };
    STYLES.sort((x, y) => rank(x[0]) - rank(y[0]));
    const cur = document.documentElement.dataset.style || "dark";
    ["setStyle", "pgStyle"].forEach(id => { const box = document.getElementById(id); if (!box) return;
      box.innerHTML = STYLES.map(([v, l, bg, ac]) => `<button type="button" data-s="${v}" aria-pressed="${v === cur}"><i style="background:radial-gradient(circle,${ac} 0 38%,${bg} 40%)"></i>${l}</button>`).join(""); });
  }
  })();
</script>

  };
  // ---- Ongoing care: one page per person; switch the person at the top left ----
  V.person = () => {
    const p = P(); if (!p) return `<p class="lead">No one is in ongoing care yet.</p>`;
    const say = SAY[p.need] || SAY.all, n = NEEDS.find(x => x.id === p.need) || NEEDS[0];
    const has = t => D.fu.find(f => f.pid === p.id && f.what === t && !f.done);
    return `<div class="pers">
      <div data-rise>
        <div class="who"><select data-switch aria-label="Person">${D.people.map(x => `<option value="${x.id}"${x.id === p.id ? " selected" : ""}>${esc(x.name)}</option>`).join("")}</select>${p.ex ? `<span class="mock" style="margin:0">Example</span>` : ""}</div>

        <div class="oval">“${esc(say.q)}”</div>
        <input class="f" style="margin-top:12px" data-pf="note" value="${esc(p.note)}" placeholder="A short note (no private details needed)" aria-label="Note">

        <div class="steps">${PATH.map(([w, d, t], i) => { const f = has(t); return `<div class="step" style="--c:var(--${["now", "today", "week", "later"][i]})"><div style="font-weight:600">${w}</div><div class="note" style="font-size:13px">${t}</div>${i ? `<div class="acts">${f ? `<span class="pill sm" aria-pressed="true">✓ Reminder ${nice(f.due)}</span>` : `<button class="pill sm" data-path="${i}">Set reminder</button>`}</div>` : ""}</div>`; }).join("")}</div>
      </div>
      <div data-rise style="--k:1">
        <div class="eyebrow">Something you could say</div>
        <p class="bigq">“I wanted to check in and see how things have been going. Were you able to reach anyone about ${esc(say.topic)}?”</p>
        <button class="btn" data-copysay>Copy these words</button>
        <div class="sech" style="margin-top:30px"><h2>Support you can offer</h2><button class="btn" data-tab="find">+ Add from Find help</button></div>
        ${p.res.map((r, i) => `<div class="lrow" style="grid-template-columns:minmax(0,1fr) auto auto"><div><div style="font-weight:600">${esc(r.n)}</div><div class="note">${esc(r.d || "")}</div></div>${call(r) || "<span></span>"}<button class="pill sm" data-unres="${i}" aria-label="Remove ${esc(r.n)}">✕</button></div>`).join("") || `<p class="lead" style="padding:12px 0">Nothing here yet. Use “+ Ongoing care” on any place or phone line.</p>`}
        <div class="acts" style="margin-top:16px"><button class="btn" data-go="sheet">Make a referral sheet</button><button class="btn" data-praypers>Add to my prayer list</button></div>
      </div>
      <div class="panel" data-rise style="--k:2">
        <div class="eyebrow">Pastor's notebook</div>
        <p class="note" style="margin:6px 0 8px">What is the next helpful step?</p>
        <textarea class="f" data-pf="next" placeholder="For example: ask whether they want help calling Crisis Assistance Ministry">${esc(p.next)}</textarea>
        <div style="margin-top:10px">${CHECKS.map((c, i) => `<label class="ck"><input type="checkbox" data-chk="${i}"${p.checks[i] ? " checked" : ""}> ${c}</label>`).join("")}</div>
        <p class="note" style="margin:12px 0 0">Saved as you type, on this device only. Keep notes short; leave out private details.</p>
        <div class="acts" style="margin-top:12px"><button class="tx" data-rename>Rename</button><button class="tx" data-delperson>Remove this person</button></div>
      </div>
    </div>`;
  };
  // ---- Referral sheet: pick what to share, see the page, copy or print. Never has the caller's name or notes. ----
  const sheetOrgs = () => { const inc = S.rows.filter(r => S.inc.has(key(r.p))); return (inc.length ? inc : S.rows.slice(0, 4)).concat(S.rows.filter(r => !S.inc.has(key(r.p))).slice(0, inc.length ? 2 : 0)); };
  const sheetData = () => { const s = S.sheet, n = N(), all = sheetOrgs(); if (!s.orgs) s.orgs = new Set(all.slice(0, Math.max(S.inc.size, 4)).map(r => key(r.p))); if (!s.need) s.need = "Help with " + (SAY[S.need].topic.replace(/^your /, "") || "local needs");
    return {s, n, all, on: all.filter(r => s.orgs.has(key(r.p)))}; };
  const paper = () => { const {s, on} = sheetData();
    return `<div class="e">Your community help sheet</div><h2>${esc(s.need)}</h2><div style="color:#6b6252">${esc(S.at.label)}</div>
      <p style="margin:16px 0 4px;color:#4a443a">These places may be able to help. Call first to ask about hours and what to bring.</p>
      ${on.map(r => `<div class="pr"><div><b>${esc(r.p.n)}</b><small>${esc(svc(r.p))} · ${esc(r.p.t)} · ${mil(r.d)}</small></div><div class="pn">${esc(r.p.ph || "")}</div></div>`).join("")}
      ${s.i211 ? `<div class="box"><div><b style="font:600 16px var(--serif)">More local help</b><small style="display:block;color:#6b6252">United Way · free, 24 hours · call or text</small></div><div class="pn">211</div></div>` : ""}
      ${s.mh ? `<div class="box"><div><b style="font:600 16px var(--serif)">Someone to talk to</b><small style="display:block;color:#6b6252">988 Lifeline, any time · NAMI HelpLine 1-800-950-6264</small></div><div class="pn">988</div></div>` : ""}
      ${s.steps ? `<p style="margin:18px 0 0;font-weight:600">Next steps</p><ol><li>Call one place and ask what help is open now.</li><li>Ask what papers or information to bring.</li><li>If one place cannot help, try the next one.</li></ol>` : ""}

  const sheetText = () => { const {s, on} = sheetData(), L = [s.need + " · " + S.at.label, ""];

  V.sheet = () => { const {s, all} = sheetData();
    return `<button class="tx back" data-back>← Back</button>

          <div class="note" style="margin-top:12px">Also add</div>
          <label class="ck"><input type="checkbox" data-sflag="i211"${s.i211 ? " checked" : ""}> 211 local help line</label>
          <label class="ck"><input type="checkbox" data-sflag="mh"${s.mh ? " checked" : ""}> Mental health support numbers</label>
          <label class="ck"><input type="checkbox" data-sflag="steps"${s.steps ? " checked" : ""}> Suggested next steps</label></div>
        <div class="lbl">A short note from you (optional)</div>
        <textarea class="f" data-sf="msg">${esc(s.msg)}</textarea>
        <div class="acts" style="margin-top:14px"><button class="btn gold big" data-sheetcopy>Copy referral sheet</button><button class="btn big" data-print>Print sheet</button></div>
      </div>
      <div data-rise style="--k:1"><div class="sech"><div class="eyebrow">Preview</div><span class="note" id="paperNote" style="margin-left:auto">No caller name or private notes are ever put on the sheet.</span></div><div id="paper">${paper()}</div></div>
    </div>`;
  };
  // ---- showing layers: the Map room zoom ----
  const TABS = ["call", "find", "care", "follow"]; let cur = null, from = "find";
  function render() { RES = []; $("L-" + S.tab).firstElementChild.innerHTML = V[S.tab]();
    const k = S.inc.size; $("dockN").textContent = k ? `${k} ${k === 1 ? "place" : "places"} in the message · ${N().label.toLowerCase()} near ${S.at.label}` : "Pick places with “+ Message”";
    $("dock").classList.toggle("off", !(S.tab === "call" || S.tab === "find"));
    const top = S.tab === "person" ? "follow" : S.tab === "sheet" ? from : S.tab;
    document.querySelectorAll("#ghTabs button").forEach(b => b.setAttribute("aria-selected", String(b.dataset.tab === top)));
    $("trail").innerHTML = `<button data-tab="call">Get help</button>` + (S.tab === "person" ? `<span>›</span><button>Ongoing care</button>` : S.tab === "sheet" ? `<span>›</span><button>Referral sheet</button>` : "") + `<span class="mock">Mockup</span>`; }
  function show(tab, back) {
    if (tab === S.tab && cur) return render();
    if (tab === "sheet" && S.tab !== "sheet") from = TABS.includes(S.tab) ? S.tab : "follow";
    const old = cur, nu = $("L-" + tab); S.tab = tab; render(); nu.scrollTop = 0;
    document.querySelectorAll(".layer").forEach(l => { if (l !== old && l !== nu) l.classList.remove("past", "on"); });
    nu.classList.add("snap"); nu.classList.toggle("past", !!back); nu.classList.remove("on"); void nu.offsetWidth; nu.classList.remove("snap");   // start small (forward) or large (back), then zoom
    if (old) { old.classList.remove("on", "fresh"); old.classList.toggle("past", !back); }
    nu.classList.remove("past"); nu.classList.add("on", "fresh"); cur = nu; clearTimeout(show.t); show.t = setTimeout(() => nu.classList.remove("fresh"), 1600);
  }
  // ---- copy for a text (short) or an email (fuller): places and public numbers only, never the caller card ----
  function copyText(full) {
    const n = N(), list = S.rows.filter(r => S.inc.has(key(r.p))), L = [`${n.id === "all" ? "Help" : n.label} near ${S.at.label}:`];
    n.hot.forEach(x => L.push(`${x.t}: ${x.text ? "call or text" : "call"} ${x.show}${full ? " (" + x.d + ")" : ""}`)); if (full) L.push("");
    list.forEach(({p, d}, i) => { L.push(`${i + 1}. ${p.n}${p.ph ? " " + p.ph : ""}, ${p.t} (${Math.max(1, Math.round(d))} mi)`); if (full) { if (svc(p)) L.push(`   ${svc(p)}`); if (addr(p)) L.push(`   ${addr(p)}, ${p.t}, ${p.s}`); if (p.u) L.push(`   ${p.u}`); } });
    if (full && n.budget) { L.push(""); n.budget.forEach(x => L.push(`${x.t}: ${x.show ? x.show + ", " : ""}${x.u}`)); }
    if (full) { L.push(""); [...n.web, ADV].forEach(([t, u]) => L.push(`${t}: ${u}`)); }
    L.push("Call ahead: hours change."); if (full) L.push("From My Pastor Resource List"); return L.join("\n");
  }
  const clip = (s, ok) => { const fb = () => { const t = document.createElement("textarea"); t.value = s; document.body.append(t); t.select(); try { document.execCommand("copy"); toast(ok); } catch (e) { toast("Copy is blocked in this browser."); } t.remove(); };
    navigator.clipboard && navigator.clipboard.writeText ? navigator.clipboard.writeText(s).then(() => toast(ok), fb) : fb(); };
  // ---- clicks ----
  const newPerson = blank => { const name = prompt("A short label for this person (no full name needed):", blank ? "" : `${S.at.label.split(",")[0]} caller`); if (!name || !name.trim()) return;
    const p = {id: uid(), name: name.trim().slice(0, 40), town: blank ? "" : S.at.label, need: blank ? "all" : S.need, note: blank ? "" : D.caller.notes, next: "", checks: [!blank, false, false, false],
      res: blank ? [] : S.rows.filter(r => S.inc.has(key(r.p))).map(asRes)}; D.people.push(p); D.cur = p.id; save(); show("person"); };
  document.addEventListener("click", e => {
    const t = e.target.closest("button,[data-soon]"), d = t ? t.dataset : {};
    if (!e.target.closest("#setp,#gear")) { $("setp").hidden = true; $("gear").setAttribute("aria-expanded", "false"); }
    if (!t) return;
    if (t.id === "gear") { $("setp").hidden = !$("setp").hidden; t.setAttribute("aria-expanded", String(!$("setp").hidden)); }
    else if (d.stylePick) setStyle(d.stylePick);
    else if ("soon" in d) toast("This button works on the real site. It is only drawn here.");
    else if (d.tab) show(d.tab, d.tab === "call" && e.target.closest("#trail"));
    else if (d.go) show(d.go);
    else if ("back" in d) show(from, true);
    else if (d.need) { S.need = d.need; S.urg = ""; S.sheet.need = ""; fresh(); }
    else if (d.inc) { S.inc.has(d.inc) ? S.inc.delete(d.inc) : S.inc.add(d.inc); S.sheet.orgs = null; render(); }
    else if (d.care) { const r = RES[+d.care], p = P(); if (!p) return newPerson();
      if (p.res.some(x => x.n === r.n)) toast(`Already on ${p.name}'s care page.`); else { p.res.push(r); save(); toast(`Added to ${p.name}'s care page.`); } }
    else if (d.urg) { S.urg = S.urg === d.urg ? "" : d.urg; render(); }
    else if (d.view) { S.view = d.view; render(); }
    else if (d.rad) { S.rad = +d.rad; render(); }
    else if (d.topic) { S.topic = d.topic; S.cq = ""; render(); }
    else if (d.copy) { if (!S.inc.size) return toast("Pick at least one place with “+ Message” first."); clip(copyText(d.copy === "1"), d.copy === "1" ? "Copied for email" : "Copied. Paste it into a text."); }
    else if ("remind" in d) { const who = `${S.at.label.split(",")[0]} caller`; D.fu = D.fu.filter(f => f.cid !== "caller" || f.done); D.fu.push({id: uid(), cid: "caller", who, what: $("remWhat").value.trim() || "Check in", due: day(+$("remWhen").value)}); save(); toast("Reminder saved on this device."); render(); }
    else if ("pray" in d) { if (D.pray.some(p => p.cid === "caller")) D.pray = D.pray.filter(p => p.cid !== "caller"); else { D.pray.push({id: uid(), cid: "caller", who: `${S.at.label.split(",")[0]} caller`, what: D.caller.needs || N().label, since: day(0)}); toast("Added to your prayer list."); } save(); render(); }
    else if ("newperson" in d) newPerson(false);
    else if ("newblank" in d) newPerson(true);
    else if (d.person) { D.cur = d.person; save(); show("person"); }
    else if (d.done) { D.fu.find(f => f.id === d.done).done = true; save(); render(); toast("Marked done."); }
    else if (d.unpray) { D.pray = D.pray.filter(p => p.id !== d.unpray); save(); render(); }
    else if ("add" in d) { S.adding = true; render(); $("addf").who.focus(); }
    else if ("addx" in d) { S.adding = false; render(); }
    else if ("backup" in d) { const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([JSON.stringify(D, null, 1)], {type: "application/json"})); a.download = "get-help-follow-ups.json"; a.click(); URL.revokeObjectURL(a.href); }
    else if ("erase" in d) { if (!t.dataset.sure) { t.dataset.sure = 1; t.textContent = "Tap again to erase all"; return; } D.fu = []; D.pray = []; D.people = []; D.cur = null; save(); render(); toast("Everything was erased from this device."); }
    else if (d.path) { const p = P(), [, n, what] = PATH[+d.path]; D.fu.push({id: uid(), pid: p.id, who: p.name, what, due: day(n)}); save(); render(); toast("Reminder saved on this device."); }
    else if ("copysay" in d) clip(t.previousElementSibling.textContent.replace(/[“”]/g, ""), "Copied.");
    else if (d.unres) { P().res.splice(+d.unres, 1); save(); render(); }
    else if ("praypers" in d) { const p = P(); D.pray.push({id: uid(), who: p.name, what: p.note || (NEEDS.find(x => x.id === p.need) || NEEDS[0]).label, since: day(0)}); save(); toast("Added to your prayer list."); }
    else if ("rename" in d) { const p = P(), n = prompt("New label:", p.name); if (n && n.trim()) { p.name = n.trim().slice(0, 40); delete p.ex; save(); render(); } }
    else if ("delperson" in d) { if (!t.dataset.sure) { t.dataset.sure = 1; t.textContent = "Tap again to remove"; return; } const id = P().id; D.people = D.people.filter(p => p.id !== id); D.fu = D.fu.filter(f => f.pid !== id); D.cur = D.people[0] ? D.people[0].id : null; save(); show("follow", true); }
    else if ("sheetcopy" in d) clip(sheetText(), "Referral sheet copied.");
    else if ("print" in d) print();
    else if ("mic" in d) listen(t);
  });
  document.addEventListener("submit", e => { e.preventDefault(); const f = e.target;
    if ("search" in f.dataset) search(f.q.value);
    else if ("caresearch" in f.dataset) { S.cq = f.q.value; render(); }
    else if (f.id === "addf") { D.fu.push({id: uid(), who: f.who.value.trim(), what: f.what.value.trim(), due: f.due.value || day(2)}); S.adding = false; save(); render(); } });
  document.addEventListener("input", e => { const t = e.target, d = t.dataset;   // typing saves quietly; only the sheet preview redraws
    if (d.caller) { D.caller[d.caller] = t.value; save(); }
    else if (d.pf) { P()[d.pf] = t.value; save(); }
    else if (d.sf) { S.sheet[d.sf] = t.value; $("paper").innerHTML = paper(); } });
  document.addEventListener("change", e => { const t = e.target, d = t.dataset;
    if ("switch" in d) { D.cur = t.value; save(); const l = $("L-person"); render(); l.classList.remove("fresh"); void l.offsetWidth; l.classList.add("fresh"); }
    else if (d.chk) { P().checks[+d.chk] = t.checked; save(); }
    else if (d.sorg) { t.checked ? S.sheet.orgs.add(d.sorg) : S.sheet.orgs.delete(d.sorg); $("paper").innerHTML = paper(); }
    else if (d.sflag) { S.sheet[d.sflag] = t.checked; $("paper").innerHTML = paper(); } });
  // ---- voice, from the draft: say "Charlotte, North Carolina, help with rent"; the need is picked from the words, the rest is the town ----
  const HEAR = [["money", /\b(rent|bills?|electric|utilit\w*|money|financ\w*|gas bill|heat\w*|pay)\b/i], ["food", /\b(food|hungry|groceries|meals?|pantry)\b/i], ["housing", /\b(housing|shelter|homeless|place to stay|evict\w*)\b/i], ["mental", /\b(mental|depress\w*|anxi\w*|suicid\w*|counsel\w*)\b/i],
    ["addiction", /\b(addict\w*|drugs?|alcohol\w*|drinking|recovery|sober)\b/i], ["family", /\b(abuse|violence|unsafe|safety|domestic)\b/i], ["health", /\b(doctor|clinic|medical|health|medicine|dentist)\b/i], ["legal", /\b(legal|lawyer|court|attorney)\b/i], ["clothing", /\b(cloth\w*|coat|furniture|household)\b/i]];
  let rec = null;
  function listen(mic) { if (rec) return rec.stop(); const inp = mic.parentElement.q;
    rec = new SR(); rec.lang = navigator.language || "en-US"; rec.interimResults = true; mic.classList.add("on"); inp.value = ""; inp.placeholder = "Listening… say the town and what they need";
    rec.onresult = e => { const said = [...e.results].map(r => r[0].transcript).join(" "); inp.value = said; if (!e.results[e.results.length - 1].isFinal) return;
      const hit = HEAR.find(([, rx]) => rx.test(said)); if (hit) S.need = hit[0];
      let town = said; HEAR.forEach(([, rx]) => { town = town.replace(new RegExp(rx.source, "gi"), " "); });
      town = town.replace(/\b(help( with)?|needs?|for|with|in|near|someone|a man|a woman|they|he|she|is|are|looking|i'?m|from|calling|the|and|an?|of)\b/gi, " ").replace(/[.?!]/g, " ").replace(/\s+/g, " ").trim(); search(town || said); };
    rec.onend = rec.onerror = () => { mic.classList.remove("on"); rec = null; }; rec.start(); }
  // ---- start ----
  S.rows = pick(); S.inc = new Set(S.rows.filter(r => r.d <= 25 && tel(r.p.ph)).slice(0, 3).map(r => key(r.p)));
  console.assert(!copyText(true).includes(D.caller.notes || "\u0000"), "the copied message must never carry the caller card");
  const want = new URLSearchParams(location.search).get("tab"); show(V[want] ? want : "call");
})();
