<style>
/* Layout: Sabbath School–app style. Quiet page, shelves of tall covers that slide sideways, a story page colored from its cover. Phone = bottom bar; PC = top bar, wider shelves, two-column story page. */
:root{
  --peek:#e8ebf7;
  --bg:#f6f6fa; --surface:#ffffff; --ink:#1d1f26; --muted:#62677a; --line:#e3e4ec; --link:#3b5aa8;
  --shadow:0 6px 16px rgba(30,32,60,.16),0 1px 3px rgba(30,32,60,.12);
  --f-body:"Lato",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-cover:"Oswald","Arial Narrow",Impact,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--peek:#2c3040;--bg:#15161c;--surface:#1e2028;--ink:#eceef5;--muted:#9da2b4;--line:#2c2f3a;--link:#8fa8ec;--shadow:0 6px 18px rgba(0,0,0,.5),0 1px 3px rgba(0,0,0,.4);color-scheme:dark}}
:root[data-theme="dark"]{--peek:#2c3040;--bg:#15161c;--surface:#1e2028;--ink:#eceef5;--muted:#9da2b4;--line:#2c2f3a;--link:#8fa8ec;--shadow:0 6px 18px rgba(0,0,0,.5),0 1px 3px rgba(0,0,0,.4);color-scheme:dark}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
a{color:inherit}
:focus-visible{outline:2px solid var(--link);outline-offset:2px;border-radius:4px}
.wrap{max-width:1240px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
.top .wrap{display:flex;align-items:center;gap:14px;min-height:64px}
.back{width:40px;height:40px;display:grid;place-items:center;border-radius:50%;margin-left:-8px}
.back svg{width:24px;height:24px}
.top h1{font-size:26px;font-weight:700;margin:0;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pcnav{display:none;gap:4px}
.pcnav button{padding:8px 14px;border-radius:999px;font-weight:700;color:var(--muted)}
.pcnav button[aria-current="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.find{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:0 14px;height:40px;width:min(320px,100%)}
.find svg{width:18px;height:18px;color:var(--muted);flex:none}
.find input{border:0;background:none;outline:none;font:inherit;color:var(--ink);width:100%;min-width:0}
.tophead{display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding-bottom:6px}
.tophead .find{width:100%}

/* shelves */
main{padding-bottom:110px}
.shelf{margin-top:26px}
.shelf-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.shelf-h h2{margin:0;font-size:15px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.seeall{color:var(--link);font-size:17px;display:flex;align-items:center;gap:4px;padding:6px 0}
.seeall svg{width:16px;height:16px}
.row{display:flex;gap:18px;overflow-x:auto;scroll-snap-type:x mandatory;padding:14px 16px 18px;margin:0 -16px;scrollbar-width:none}
.row::-webkit-scrollbar{display:none}
.item{flex:none;width:clamp(132px,36vw,168px);scroll-snap-align:start;text-align:left;display:flex;flex-direction:column;gap:12px}
.item .nm{font-size:17px;font-weight:700;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.item .meta{font-size:13px;color:var(--muted);margin-top:-6px}
.shelf-note{font-size:14px;color:var(--muted);margin:2px 0 0}

/* covers: our own design, one look per source */
.cover{position:relative;aspect-ratio:2/3;width:100%;max-width:100%;border-radius:8px;overflow:hidden;box-shadow:var(--shadow);color:#fff;
  background:linear-gradient(160deg,var(--c1),var(--c2));transition:transform .25s ease}
.cover::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(115deg,rgba(255,255,255,.05) 0 2px,transparent 2px 7px)}
.cover .src{position:absolute;top:10px;left:10px;right:10px;display:flex;align-items:center;gap:6px;font:700 9px/1.2 var(--f-body);letter-spacing:.08em;text-transform:uppercase;opacity:.92}
.cover .src i{width:16px;height:16px;border-radius:4px;background:rgba(255,255,255,.22);display:grid;place-items:center;font-style:normal;font-size:10px}
.cover .ttl{position:absolute;left:10px;right:10px;top:34%;font-family:var(--f-cover);font-weight:700;text-transform:uppercase;line-height:1.02;letter-spacing:.01em;font-size:clamp(17px,5.2cqw,22px);text-wrap:balance;color:var(--hi);text-shadow:0 2px 0 rgba(0,0,0,.18)}
.cover .ttl b{display:block;color:#fff;font-weight:700}
.cover .foot{position:absolute;left:10px;right:10px;bottom:10px;display:flex;justify-content:space-between;align-items:center;font:700 10px/1 var(--f-body);opacity:.9}
.cover .dot{width:8px;height:8px;border-radius:50%;background:var(--hi);display:inline-block;margin-right:5px}
.cover{container-type:inline-size}
.cover .mark{position:absolute;right:-18%;bottom:12%;width:70%;aspect-ratio:1;border-radius:50%;border:2px solid rgba(255,255,255,.14)}
.cover .mark::after{content:"";position:absolute;inset:16%;border-radius:50%;border:2px solid rgba(255,255,255,.10)}
@media (hover:hover){.item:hover .cover{transform:translateY(-3px)}}

.k-mission{--c1:#1f5f6e;--c2:#123c48;--hi:#f2c46b}
.k-guide{--c1:#c45a3c;--c2:#8e3424;--hi:#ffe1a6}
.k-iiw{--c1:#2b3f7a;--c2:#18244d;--hi:#e9c46a}
.k-moment{--c1:#6b2f6e;--c2:#401a45;--hi:#f5b8d0}
.k-mission.v1{--c1:#2a6b55;--c2:#163f33}.k-mission.v2{--c1:#2b5878;--c2:#16344c}
.k-guide.v1{--c1:#cf7a2e;--c2:#93501a}.k-guide.v2{--c1:#b8455a;--c2:#7d2637}
.k-iiw.v1{--c1:#3a4f8a;--c2:#1f2c58}.k-iiw.v2{--c1:#24526e;--c2:#122f43}
.k-moment.v1{--c1:#5a3a7d;--c2:#33204d}.k-moment.v2{--c1:#7a3157;--c2:#4a1b35}

/* see-all list (like the Keys Series screen) */
.list{display:flex;flex-direction:column;gap:22px;margin-top:10px}
.lrow{display:flex;align-items:flex-start;gap:18px;text-align:left;width:100%}
.lrow .tx{padding-top:2px}
.lrow .point{border-left:3px solid var(--line);padding-left:10px;margin-top:2px}
/* phone: summary bar above the bottom tabs for the book you're on */
.peek{position:fixed;left:0;right:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);box-shadow:0 -6px 16px rgba(20,22,40,.10);
  padding:12px max(16px,env(safe-area-inset-right,0px)) 12px max(16px,env(safe-area-inset-left,0px))}
.peek button{display:flex;flex-direction:column;gap:4px;text-align:left;width:100%}
.peek .pk-t{font-weight:900;font-size:16px;display:flex;justify-content:space-between;gap:10px}
.peek .pk-t small{font-weight:700;color:var(--muted);font-size:13px;white-space:nowrap}
.peek .pk-s,.peek .pk-p{font-size:14px;line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.peek .pk-p{color:var(--muted)}.peek .pk-p b{color:var(--ink)}
/* bar follows the site theme: a soft lighter tint in light mode, a lifted gray in dark mode */
.peek{background:var(--peek);border-top:1px solid var(--line)}
.peek .pk-p b{color:var(--link)}
/* phone: the middle book is the raised one, so shelves snap books to the center */
@media (max-width:899px){.item{scroll-snap-align:center}}
body.peeking main{padding-bottom:260px}
/* two bar choices to compare: "fades away" shows while you move, then hides after 2.5 s; "small" stays but is title + one line */
.peek{transition:opacity .45s ease,transform .45s ease}
body.bar-fade .peek:not(.on){opacity:0;transform:translateY(14px);pointer-events:none}
body.bar-small .peek{padding-block:9px}
body.bar-small .peek .pk-p{display:none}
body.bar-small .peek .pk-s{-webkit-line-clamp:1;color:var(--muted)}
body.peeking.bar-small main{padding-bottom:170px}
.vlab{align-self:center;padding:0 6px 0 10px;font-size:14px;color:var(--muted);font-weight:700}
.vsw.phoneonly{margin-left:6px}
@media (min-width:900px){.phoneonly{display:none!important}}
.item .cover{transition:transform .25s ease,box-shadow .25s ease}
.item.cur .cover{transform:translateY(-10px);box-shadow:0 16px 28px rgba(30,32,60,.28),0 2px 4px rgba(30,32,60,.14)}
.item.cur .nm{color:var(--link)}
@media (min-width:900px){.peek{display:none!important}body.peeking main{padding-bottom:60px}.item.cur .cover{transform:none}.item.cur .nm{color:inherit}}
.lrow .cover{width:112px;flex:none}
.lrow .tx{min-width:0;display:flex;flex-direction:column;gap:6px}
.lrow .nm{font-size:22px;font-weight:700;line-height:1.2}
.lrow .meta{font-size:14px;color:var(--muted)}
.lrow .sum{font-size:15px;color:var(--ink);line-height:1.45}
.lrow .point{font-size:14px;color:var(--muted);line-height:1.4}
.lrow .point b{color:var(--ink);font-weight:700}
.lrow .cover{width:76px;border-radius:6px}
/* list thumbnails: same cover, lettering scaled down so long words fit inside the small book */
.lrow .cover .ttl{font-size:11px;left:7px;right:7px;top:30%;line-height:1.05;letter-spacing:0}
.lrow .cover .src{top:7px;left:7px;font-size:0}
.lrow .cover .src i{width:13px;height:13px;font-size:8px}
.lrow .cover .foot{display:none}
.cover .ttl{overflow-wrap:break-word}
.lrow .nm{font-size:20px}
.catbar{position:sticky;top:calc(64px + env(safe-area-inset-top,0px));z-index:4;display:flex;align-items:center;gap:4px;margin:14px -16px 6px;padding:8px 8px;background:var(--bg);border-bottom:1px solid var(--line)}
.cats{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;flex:1;min-width:0;scroll-behavior:smooth}
.cats::-webkit-scrollbar{display:none}
.cats button{flex:none;padding:8px 14px;border-radius:999px;font-weight:700;font-size:15px;color:var(--muted);border:1px solid var(--line);background:var(--surface)}
.cats button[aria-selected="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.cstep{flex:none;width:36px;height:36px;border-radius:50%;font-size:26px;line-height:1;color:var(--ink);display:grid;place-items:center}
@media (min-width:900px){.catbar{margin-inline:0;top:64px}}
.vsw{display:inline-flex;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px;margin-top:8px}
.vsw button{padding:6px 18px;border-radius:999px;font-size:15px;font-weight:700;color:var(--muted)}
.vsw button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.listgrid{display:contents}

/* story page */
.hero{background:linear-gradient(180deg,var(--c1),var(--c2));color:#fff;position:relative}
.hero .wrap{display:flex;flex-direction:column;align-items:center;text-align:center;padding-block:14px 26px;gap:14px}
.hero .bar{width:100%;display:flex;justify-content:space-between}
.hero .circ{width:46px;height:46px;border-radius:50%;background:rgba(0,0,0,.18);display:grid;place-items:center;color:#fff}
.hero .circ svg{width:24px;height:24px}
.hero .circ[aria-pressed="true"]{background:#fff;color:var(--c2)}
.hero .cover{width:min(190px,48vw);box-shadow:0 14px 30px rgba(0,0,0,.35)}
.hero h1{font-size:clamp(28px,7vw,40px);line-height:1.1;margin:6px 0 0;font-weight:900;text-wrap:balance}
.hero .sub{opacity:.85;font-size:17px}
.readbtn{display:inline-flex;align-items:center;justify-content:center;min-width:200px;min-height:52px;padding:0 28px;border-radius:999px;background:rgba(0,0,0,.22);color:#fff;font-weight:900;font-size:18px;letter-spacing:.06em;text-decoration:none;text-transform:uppercase}
.readbtn:hover{background:rgba(0,0,0,.32)}
.hero .gist{max-width:62ch;text-align:left;font-size:17px;line-height:1.5;margin:0}
.hero .gist button{color:#fff;text-decoration:underline;font-style:italic;opacity:.9}
.facts{background:var(--bg)}
.fact{display:flex;gap:18px;padding:18px 0;border-bottom:1px solid var(--line);align-items:flex-start}
.fact .lab{width:96px;flex:none;color:var(--muted);font-size:14px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;padding-top:3px}
.fact .val{font-size:18px;line-height:1.45;min-width:0}
.tags{display:flex;flex-wrap:wrap;gap:8px}
.tags span{background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:4px 12px;font-size:15px}
.full{border-bottom:1px solid var(--line)}
.full summary{list-style:none;cursor:pointer;display:flex;justify-content:space-between;align-items:center;padding:20px 0;font-size:19px;font-weight:900;color:var(--link)}
.full summary::-webkit-details-marker{display:none}
.full summary::after{content:"";width:10px;height:10px;border-right:2.5px solid currentColor;border-bottom:2.5px solid currentColor;transform:rotate(45deg);transition:transform .2s;margin-right:6px}
.full[open] summary::after{transform:rotate(-135deg)}
.full p{font-size:18px;line-height:1.55;margin:0 0 20px}
.note{font-size:13px;color:var(--muted);padding:18px 0}

/* bottom bar (phone) */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--bg);border-top:1px solid var(--line);
  padding:8px max(16px,env(safe-area-inset-right,0px)) calc(8px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;justify-content:space-around}
.tabbar button{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;color:var(--muted);padding:4px 14px;border-radius:999px;min-width:64px}
.tabbar svg{width:26px;height:26px}
.tabbar button[aria-current="true"]{color:var(--ink)}
.tabbar button[aria-current="true"] .ic{background:color-mix(in srgb,var(--link) 18%,transparent)}
.tabbar .ic{padding:4px 18px;border-radius:999px;display:grid;place-items:center}
.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;font-size:15px;z-index:9;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.on{opacity:1}
.empty{color:var(--muted);padding:30px 0}

/* PC */
@media (min-width:900px){
  .pcnav{display:flex}
  .tabbar{display:none}
  main{padding-bottom:60px}
  .top h1{flex:0 0 auto}
  .top .wrap{gap:22px}
  .top .find{margin-left:auto}
  .tophead .find{display:none}
  .item{width:172px}
  .row{gap:26px;padding:14px 0 18px;margin:0;scroll-snap-type:none;overflow-x:auto}
  .list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:28px 40px}
  .hero .wrap{display:grid;grid-template-columns:auto minmax(0,1fr);grid-template-areas:"bar bar" "cov txt";text-align:left;align-items:center;column-gap:44px;padding-block:18px 40px}
  .hero .bar{grid-area:bar}
  .hero .cover{grid-area:cov;width:230px}
  .hero .txt{grid-area:txt;display:flex;flex-direction:column;gap:16px;align-items:flex-start}
  .facts .wrap{max-width:900px}
}
.hero .txt{display:contents}
@media (min-width:900px){.hero .txt{display:flex}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
.view{animation:vin .22s ease both}
/* ===== "See changes" version (ChatGPT + Gemini review, 14 Nov) ===== */
.v2btn{position:fixed;top:calc(6px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);z-index:9;background:#e9c46a;color:#1d1f26;font:900 12px/1 var(--f-body);padding:7px 12px;border-radius:999px;border:0;box-shadow:0 2px 8px rgba(0,0,0,.2);cursor:pointer}
@media (prefers-color-scheme:light){html.v2:not([data-theme="dark"]){--bg:#f7f8fa;--peek:#edf0f5}}
html.v2[data-theme="light"]{--bg:#f7f8fa;--peek:#edf0f5}
html.v2 .cstep{display:none}
html.v2 .cats{-webkit-mask-image:linear-gradient(90deg,#000 82%,transparent);mask-image:linear-gradient(90deg,#000 82%,transparent);padding-right:24px}
/* length band: green short, blue medium, red long */
.lenb{position:absolute;left:0;right:0;bottom:0;height:4%;min-height:3px;border-top:1px solid rgba(255,255,255,.55)}
.lenb.short{background:#2f9e55}.lenb.medium{background:#2f74d0}.lenb.long{background:#d23c32}
.lenkey{display:flex;flex-wrap:wrap;align-items:center;gap:4px 8px;font:600 12px/1.3 var(--f-body);color:var(--muted);margin:2px 0 10px}
.lenkey .lenb{position:static;display:inline-block;width:16px;height:6px;min-height:0;border:0;border-radius:3px;margin-right:-3px}
/* PC: arrows to flip through a shelf */
.rowwrap{position:relative}.rarr{display:none}
@media (min-width:900px){
  .rarr{display:grid;place-items:center;position:absolute;top:calc(14px + 7%);z-index:3;width:44px;height:44px;border-radius:50%;border:1px solid var(--line,#dde);background:var(--card,#fff);color:var(--ink,#1d1f26);font:400 30px/1 var(--f-body);padding-bottom:4px;cursor:pointer;box-shadow:0 3px 12px rgba(0,0,0,.18);transition:opacity .2s}
  .rarr.prev{left:-22px}.rarr.next{right:-22px}
  .rarr:hover{background:var(--ink,#1d1f26);color:#fff}
  .rarr[disabled]{opacity:0;pointer-events:none}
}
/* time goes under the name, not on the cover */
html.v2 .c2 .foot{display:none}
.item .mins{display:block;font-size:14px;font-weight:600;color:var(--muted);margin-top:3px}
/* review round 2 */
.lenf{display:flex;gap:6px;margin:4px 0 6px;overflow-x:auto;scrollbar-width:none}
.lenf button{flex:none;white-space:nowrap;font:700 13px/1 var(--f-body);padding:8px 11px;border-radius:999px;border:1px solid var(--line);background:var(--card,#fff);color:var(--ink)}
.lenf button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
html.v2 .hero .wrap{padding-block:10px 18px;gap:10px}
html.v2 .hero .cover{width:min(140px,36vw)}
@media (min-width:900px){html.v2 .hero .cover{width:170px}}
html.v2 .lrow .sum,html.v2 .lrow .point{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
html.v2 .c2.s-mission{box-shadow:inset 0 0 0 1px rgba(0,0,0,.07),0 2px 5px rgba(0,0,0,.12),0 10px 22px rgba(0,0,0,.12)}
/* PC: point at a book to see its summary */
.hov{position:fixed;z-index:20;width:300px;padding:14px 16px;border-radius:12px;background:var(--card,#fff);color:var(--ink);border:1px solid var(--line);box-shadow:0 12px 32px rgba(20,22,40,.22);font:400 14px/1.45 var(--f-body);opacity:0;transform:translateY(4px);transition:opacity .15s,transform .15s;pointer-events:none}
.hov.on{opacity:1;transform:none}

.hov .m{display:block;color:var(--muted);font-weight:600;font-size:13px;margin:3px 0 8px}
.hov .p{display:block;margin-top:8px;padding-left:10px;border-left:3px solid var(--line);color:var(--muted)}.hov .p b{color:var(--ink)}
/* PC shelves = the Resources page carousel: serif heading, "See all" pill, centered book lifts with a gold edge, faded edges, arrows step one book */
@media (min-width:900px){
  html.v2 .shelf{margin-top:34px}
  html.v2 .shelf-h{justify-content:flex-start;align-items:flex-end}
  html.v2 .shelf-h h2{font:600 clamp(24px,3.4vw,36px)/1.1 "Fraunces",Georgia,serif;letter-spacing:0;text-transform:none;color:var(--ink)}

}/* ===== Rebrand: fitting the mockup onto the live app (after rb_mock.css) =====
   The live app scrolls inside fixed layers (.stage > .layer), not the window, so the mockup's top bar, tab bar and left bar are fixed
   and the stage sits between them. */
/* the live app's own color names follow the rebrand palette, so every tab (Map room, Serve wrapper, Help, Settings) matches */
:root.rb.rb{--sans:var(--font);--serif:var(--font);--glass:color-mix(in srgb,var(--card) 90%,transparent);--glass2:var(--card);--edge:var(--line);--dim:#8a8070;
  --gold:var(--acc);--gold2:#6f4520;--goldlight:#6f4520;--room:var(--side);--wall:var(--card);--surface:var(--card);--surface2:var(--soft);--panel:var(--card);--panel2:var(--soft);
  --fade:var(--muted);--card1:var(--soft);--card2:var(--card);--homebg:var(--side);--roombg:var(--side);--fx-topbg:var(--bg);--slow:.45s;--toph:64px;--subh:48px;color-scheme:light}
:root.rb.rb.rbdark{--dim:#6b7a8c;--gold2:#d4ad72;--goldlight:#d4ad72;color-scheme:dark}
html.rb body{font-size:16px}

/* the live top bar is replaced by the mockup's; its buttons stay in the page (hidden) so every id and handler keeps working */
html.rb header.top{display:none!important}
html.rb .rb-top{position:fixed;top:0;left:0;right:0;z-index:70;padding-top:env(safe-area-inset-top,0px);height:calc(64px + env(safe-area-inset-top,0px))}

  background:var(--card)!important;box-shadow:none!important;position:static!important;transform:none!important;animation:none!important;backdrop-filter:none!important;max-width:none!important;opacity:1!important}

  background:var(--card)!important;color:var(--ink);border:1px solid var(--line)!important;border-radius:14px!important;box-shadow:0 18px 40px var(--shadow)!important}

<script>
const DATA={"mission": [{"t": "From Despair to Destiny", "u": "https://ssnet.org/blog/26d-05-inside-story-from-despair-to-destiny/", "gist": "In early 1906, a young Slovenian man named Albin Močnik was standing on a bridge in Germany, ready to take his own life due to deep despair. However, a stranger stopped him and led him to two Adventist shoemaking families. The quiet, consistent faith of these families touched Albin so deeply that he decided to turn toward God and was baptized just a few months later. This moment served as a major turning point, shifting his path from death to a life of dedicated service. Albin became a pioneer for the Adventist faith in the Balkans, facing immense obstacles including language barriers, imprisonment, and the horrors of World War I. Despite these hardships, he translated religious materials, composed hymns, and preached tirelessly. His persistence eventually led to him becoming the first president of the Yugoslav Union Conference. By the time he died, he had secured legal recognition for the church and established a lasting foundation for the faith in his homeland, proving how one life changed by grace can impact an entire nation.", "lesson": "God can transform a person's deepest despair into a powerful mission of hope and service.", "themes": "transformation, perseverance, missionary zeal, courage, God's grace", "bible": "John 10:10, 2 Timothy 1:7, Matthew 5:16", "good": "sermon, Bible study, youth, children's story", "kids": false}, {"t": "A School for Berta", "u": "https://ssnet.org/blog/26d-04-inside-story-a-school-for-berta/", "gist": "Berta, a qualified teacher in Krakow, Poland, was looking for a new job. She discovered an opening at a brand-new Seventh-day Adventist school located near Warsaw. Although she was initially hesitant because the location was so far from her home, she began to notice several friends mentioning the school to her. Sensing a possible divine nudge, Berta prayed for guidance and decided to apply for two positions simultaneously, promising to accept whichever school responded first. To her surprise, the Adventist school was the first to contact her. However, she felt conflicted about moving her sixteen-year-old son, Jacob, away from his friends. After praying and offering him the choice to stay behind, Jacob chose to move with her, expressing a desire to be near his mother. Berta accepted the position and eventually became the school's principal. The move proved to be a blessing, as Jacob found a new community of friends and became active in the church. Berta now views her journey as a clear example of God's perfect providence.", "lesson": "When we surrender our plans to God and trust His guidance, He can lead us into unexpected blessings for our families and ministries.", "themes": "Divine guidance, Trusting God, Obedience, Family ministry, Providence", "bible": "Proverbs 3:5-6, Psalm 32:8, Isaiah 30:21", "good": "sermon, Bible study, youth", "kids": true}, {"t": "Begun in a Bar", "u": "https://ssnet.org/blog/26c-13-inside-story-begun-in-a-bar/", "gist": "Leenus was a former pastor of another denomination who converted to the Seventh-day Adventist faith after studying the Voice of Prophecy. Driven by a passion for the truth, he began a massive evangelistic effort, registering 360 people for Bible studies. Although he initially expected to lead the local congregation, his success led the church to appoint him as a Global Mission pioneer to reach unreached areas. In a new town, he faced a significant hurdle: the only available meeting place was a shop that had previously functioned as a bar. The local community mocked the idea of worshipping in such a 'wicked' location, causing Leenus to face potential discouragement. However, he chose to trust in God's sovereignty, viewing the humble beginning as a testimony of divine power. He persevered until God provided the resources and land to build a proper sanctuary. Today, the congregation thrives in a new building, serving as a visible sign of God's expanding work and faithfulness.", "lesson": "God can transform any situation or place into a testimony of His power when we trust His plan over our own preferences.", "themes": "missionary work, trusting God, perseverance, divine provision, evangelism", "bible": "Matthew 5:16, Philippians 4:19, Isaiah 43:19", "good": "sermon, Bible study, youth, children's story", "kids": false}, {"t": "Jake’s Prayer Journey", "u": "https://ssnet.org/blog/26c-10-inside-story-jakes-prayer-journey/", "gist": "Jake is a dedicated church planter living in a region where very few people know about Jesus. To stay spiritually grounded, he begins a personal project of writing down his monthly prayer requests to track how God answers them. While working with a small group to disciple new believers, Jake meets two very different men. The first is Omar, a cook who has secretly followed Christ for fifteen years out of fear for his safety. The second is Wassim, a former refugee who found peace in Christianity while living abroad and is now seeking deeper understanding. Both men express a desire to be baptized. Jake begins meeting with them regularly to study the Bible and discuss their faith. By the end of the first month, Jake reflects on his prayer journal with awe. He realizes that God has directly answered his request to teach the Word, and he feels energized and ready to continue this ministry with divine strength.", "lesson": "When we faithfully commit our desires to God in prayer, He provides the specific opportunities and strength needed to fulfill His calling.", "themes": "prayer, evangelism, discipleship, God's faithfulness, courage", "bible": "Philippians KJV, Matthew KJV, 1 Thessalonians KJV", "good": "sermon, Bible study, youth", "kids": false}, {"t": "Mission Begins Young", "u": "https://ssnet.org/blog/26c-09-inside-story-mission-begins-young/", "gist": "Myron Iseminger was a young man who grew up inspired by missionary stories but never imagined he would actually become one. In the late 1970s, after seeing his sister volunteer in Japan, he decided to spend a year in the Middle East to teach English and gain ministerial experience. This trip became a major turning point for him; by visiting his students' homes and hearing their personal struggles, he learned to replace judgment with empathy and love for people from different cultures. This experience sparked a lifelong calling to missions. To prepare, he pursued a second degree in business, recognizing that mission work requires practical management. He also sought a spouse who shared his vision, eventually marrying Candace, who traveled abroad with him. They eventually secured a position as a treasurer in Egypt. Despite the challenges of working with limited resources, Myron found deep fulfillment in serving on the front lines. His journey shows that when we surrender our plans to God, He can orchestrate a life of service far greater than we could have imagined.", "lesson": "When we surrender our personal plans to God's calling, He can lead us into a life of service that exceeds our own imagination.", "themes": "missionary calling, empathy, trusting God, service, cultural awareness", "bible": "Matthew 6:33, Isaiah 6:8, Proverbs 16:9", "good": "sermon, Bible study, youth", "kids": false}, {"t": "Spirit-led Encounters", "u": "https://ssnet.org/blog/26c-08-inside-story-spirit-led-encounters/", "gist": "A missionary couple serving in a restricted, unnamed country prayed for God to help them establish a home church. Although they expected only foreigners at first, God began opening doors to the local population. The turning point occurred when the missionary met a taxi driver named Salman. They bonded over faith, and the missionary discovered that Salman had no Christian community to join. The missionary invited Salman and his wife to their home worship, where they both grew in their devotion to Jesus. The ripple effect continued when Salman shared his faith with his brother, Faisal, who was also a secret believer. Despite being previously rejected by a formal church due to religious restrictions, Faisal joined the home group. After years of prayer, the brothers eventually shared their faith with their parents. While some family members rejected them, the missionary couple saw this as a clear sign of God's providence in providing a safe haven for believers in a difficult land.", "lesson": "God sovereignly orchestrates divine connections to provide spiritual fellowship and safety for those seeking Him in restricted places.", "themes": "missionary work, divine providence, spiritual fellowship, courage, evangelism", "bible": "Matthew 18:20, Acts 1:8, Romans 10:15", "good": "sermon, Bible study, youth", "kids": false}, {"t": "Meeting the General", "u": "https://ssnet.org/blog/26c-07-inside-story-meeting-the-general/", "gist": "The story follows a missionary couple facing a dire crisis in a restricted country. They were at risk of being deported because of a technicality on the wife's passport, making it nearly impossible to secure a temporary residence card. Feeling desperate, the husband turned to God for a miracle. When they arrived at the immigration office, the clerk was unable to help and directed them to a high-ranking official. To their shock, the 'general' turned out to be a kind young man who was simply studying English and aspiring to work for the United Nations. He processed their paperwork instantly without questioning the complications. The author felt the Holy Spirit prompting him to offer the young man help with his English. This simple act of kindness sparked a lasting friendship. What began as a desperate plea for legal safety ended with a divine connection, as God not only solved their immediate problem but also opened a door for a new relationship and shared ministry goals.", "lesson": "God often answers our most desperate prayers by opening doors that lead to His greater purposes for our lives.", "themes": "God's providence, answered prayer, divine intervention, missionary life, unexpected blessings", "bible": "Matthew 6:33, Philippians 4:6, Proverbs 3:5", "good": "sermon, Bible study, youth", "kids": true}, {"t": "High-end Fashion for Christ", "u": "https://ssnet.org/blog/26c-04-inside-story-high-end-fashion-for-christ/", "gist": "Isabelle is a successful fashion designer and organizer based in New York City. While she works in the high-pressure world of runway shows and celebrity fashion, she maintains a deep commitment to her Seventh-day Adventist faith. After being miraculously healed from a serious injury, Isabelle felt a profound calling to serve others. She now balances her professional career with volunteer work at an urban ministry center. However, her ministry isn't limited to her volunteer hours; she intentionally integrates her faith into her entire career. Before every show, she prays with the models and staff to provide them with peace in a competitive environment. She also uses her press releases and designs to prompt the public to examine their spiritual lives and seek God. By being a consistent example of Christ's love and peace, she has become a 'center of influence' herself. People she works with are often drawn to her faith, leading her to invite them into church programs and Bible studies.", "lesson": "Every believer can become a center of influence by intentionally reflecting Christ's character and love in their everyday professional lives.", "themes": "missionary heart, center of influence, faith and work, testimony, peace, healing", "bible": "Matthew 5:16, 1 Peter 3:15, Colossians 3:23", "good": "sermon, Bible study, children's story, youth", "kids": false}, {"t": "Two Dreams", "u": "https://ssnet.org/blog/26c-03-inside-story-two-dreams/", "gist": "This story follows Dante Herrmann, a young man born in Germany who was considered a medical miracle after his mother struggled for years to conceive. Due to health issues as an infant, his family moved to the Canary Islands. As a teenager, Dante struggled with school and eventually dropped out to work as a handyman. Seeking quick wealth, he turned to drug dealing and made a spiritual pact with the devil, symbolized by a tattoo. Although he had money, he felt a profound emptiness and guilt over the harm he was causing others. After fleeing to Germany and eventually returning to the islands, he quit drugs and became a tattoo artist. His life changed drastically when his father won a massive legal settlement, offering Dante a share of the wealth. However, after reading the Bible, Dante realized that material riches couldn't fill his inner void. He surrendered his life to Jesus, discovering that true wealth is found in a relationship with God. Today, he serves as a pastor in Germany.", "lesson": "True fulfillment and wealth are found not in material success or worldly pleasures, but in surrendering one's heart to Jesus.", "themes": "Redemption, True Wealth, Repentance, God's Grace, Overcoming Addiction", "bible": "Proverbs 10:22, John 10:10, Luke 12:15", "good": "sermon, Bible study, youth", "kids": false}, {"t": "A Touch That Transforms", "u": "https://ssnet.org/blog/26c-02-inside-story-a-touch-that-transforms/", "gist": "This story follows two women in Brazil, Fabiola and Luisa, who were both facing devastating personal crises. Fabiola was battling a breast cancer diagnosis during the height of the COVID-19 pandemic, while Luisa was dealing with a broken marriage, a serious health issue caused by her husband's infidelity, and her mother's Alzheimer's disease. Both women felt overwhelmed by despair and were searching for a reason to keep going. In a remarkable twist of fate, both women experienced a similar intervention: their dogs accidentally stepped on their television remotes, switching the channel to a Christian network. This divine coincidence allowed them to encounter the Gospel during their darkest hours. For Fabiola, the messages helped her reframe her illness as an opportunity for spiritual growth rather than a punishment. For Luisa, the content helped her identify her depression, leading her to seek treatment and find spiritual renewal. Both women were transformed from states of hopelessness to lives of purpose and faith, illustrating how God can use simple means to reach those in need.", "lesson": "God can use the most unexpected circumstances to bring His healing message to those in their deepest despair.", "themes": "God's providence, healing, hope, overcoming depression, divine intervention", "bible": "Mark 5, Psalm 34:18, Matthew 11:28", "good": "sermon, Bible study, children's story, youth", "kids": false}], "guide": [{"t": "Lock the Gates", "u": "https://www.guidemagazine.org/stories/lock-the-gates/", "gist": "This story describes a person who has finally finished a long, exhausting struggle or battle. Having reached their destination, they approach a castle representing their personal sanctuary. The turning point occurs when the individual decides to enter the gates and lock them firmly from the inside. They are seeking total isolation and a permanent end to the demands of others. As they retreat into the darkness of the castle, they deliberately turn off the lights to hide from the world. Outside, people are crying out and begging for entry, but the narrator describes these pleas as nothing more than the wind. The story concludes with the narrator feeling a sense of finality and accomplishment in their solitude. They have successfully shut out everyone else to live in a private, dark space where they no longer have to pretend or interact with society. It is a narrative of complete withdrawal and the desire for absolute privacy after a period of conflict.", "lesson": "The story illustrates the danger of isolating oneself from others and the spiritual danger of choosing a path of loneliness and darkness over community.", "themes": "isolation, withdrawal, loneliness, spiritual darkness, rejection", "bible": "Matthew 24:13, John 10:10, Psalm 23:4", "good": "sermon, Bible study, children's story, youth", "kids": false}, {"t": "Around the World with God", "u": "https://www.guidemagazine.org/stories/around-the-world-with-god/", "gist": "Nolan Vance is a scientist who successfully creates a high-tech robot named A.C.B. After praying for God's guidance to use his invention for good, Nolan decides to test the robot's teleportation abilities. They instantly travel from the USA to South Africa, though the landing is quite rough. While recovering, they meet a friendly local girl named Thandi, who introduces them to Pastor Daniel. Pastor Daniel is a missionary from the United Kingdom who is currently working on building a church in the Kimberley region. The robot identifies that they need more rocks for the construction project, and the trio works together to gather materials. After a successful night of labor, Pastor Daniel thanks them for their help before Nolan and his robot teleport away to their next destination, Italy. The story highlights how technology and human effort can be combined to serve God's kingdom.", "lesson": "When we dedicate our talents and technology to God, He can use them to accomplish His work in unexpected places.", "themes": "serving God, technology and faith, missionary work, cooperation, God's providence", "bible": "Matthew 25:21, 1 Peter 4:10, Colossians 3:23", "good": "sermon, Bible study, children's story, youth", "kids": true}, {"t": "Understand the Word of God", "u": "https://www.guidemagazine.org/stories/understand-the-word-of-god/", "gist": "This story focuses on a powerful prophetic warning found in the book of Zephaniah. It describes a scene where God declares His intention to completely clear the earth of all living things, including humans, animals, birds, and fish. The narrative explains that this isn't just a random act of destruction, but a divine 'wake-up call' for humanity. The turning point occurs when the text identifies the specific targets of this judgment: the wicked and their idols. The author clarifies that these idols are not just physical objects, but represent the false things people worship that lead them into spiritual confusion and stumbling. The story concludes by explaining the ultimate purpose of this judgment: God intends to gather His true believers into heaven while removing the corruption and falsehoods of the world. It serves as a sobering reminder of the finality of God's judgment and the necessity of turning away from false worship toward the true Creator.", "lesson": "God's judgment serves as a final warning to turn away from false idols and find true security in Him.", "themes": "Judgment, Idolatry, True Worship, Spiritual Awareness, God's Sovereignty", "bible": "Zephaniah 1, 1 John 5:21, Exodus 20:3", "good": "sermon, Bible study, youth", "kids": false}, {"t": "Soccer for God: Leap for It!", "u": "https://www.guidemagazine.org/stories/soccer-for-god-leap-for-it/", "gist": "The story describes a soccer match where a father stepped in to play as the goalkeeper for a team of children. During the game, the situation became intense when it came down to a one-on-one penalty kick. The father found himself facing off against a formidable opponent who played on a professional team. Because of the striker's skill, the father knew that a standard defensive move would likely fail. In a split second, the father made a risky, unconventional decision. He shifted his entire body weight onto his left foot, appearing to commit to one side of the goal. This move deceived the professional striker, who expected a predictable reaction. However, as the ball was launched into the air, the father used that initial momentum to spring across the goal and make a spectacular save. The story concludes with the realization that the father's unconventional strategy worked perfectly, proving that sometimes a surprising move can overcome a seemingly impossible obstacle.", "lesson": "God can use unexpected strategies and faith to overcome challenges that seem far too large for us to handle.", "themes": "overcoming obstacles, faith, unexpected victories, courage, trusting God", "bible": "Matthew 17:20, Philippians 4:13, Isaiah 41:10", "good": "sermon, Bible study, children's story, youth", "kids": true}, {"t": "Mending an Injured Heart", "u": "https://www.guidemagazine.org/stories/mending-an-injured-heart/", "gist": "A thirteen-year-old girl and her father spend a hot day practicing soccer on a makeshift field at a church. Despite the lack of proper equipment and the intense heat, they push themselves to their physical limits, practicing drills and taking turns scoring goals. The girl feels exhausted, but she enjoys the bonding time with her father. Later, the father reveals a heavy burden he has been carrying regarding his career. He explains that he had been facing significant workplace harassment and spiritual opposition, leaving him feeling defeated and stressed. He shares that their time playing soccer provided a vital emotional and spiritual refresh for him. He credits God for intervening in his job situation, leading to a new position and a raise. The story ends with the girl realizing that her simple act of spending time with her father provided him with the strength and peace he needed to overcome his trials.", "lesson": "Simple acts of devotion and spending quality time with loved ones can provide the spiritual refreshment needed to endure life's hardest trials.", "themes": "spiritual refreshment, perseverance, family bonds, God's provision, overcoming trials", "bible": "Matthew 11:28, Isaiah 40:31, Philippians 4:6-7", "good": "sermon, Bible study, youth, children's story", "kids": true}, {"t": "Soccer for God: It’s Not Over Yet", "u": "https://www.guidemagazine.org/stories/soccer-for-god-its-not-over-yet/", "gist": "A young boy and his father head to a local park to play a game of soccer as the sun begins to set. They decide to take turns playing as the goalie and the striker, practicing their skills on the field. During the game, the boy notices a pattern in how they react to the action. At one point, the father misses a shot and walks away without much effort, while the boy realizes he had the opportunity to relax after a save but chose to stay focused. The turning point occurs when the father tries to score but fails to notice the boy already sprinting toward the other goal. The boy scores easily because he was prepared and proactive, while his father was caught off guard. The story concludes with the boy reflecting on the difference between being prepared and being lazy. He realizes that both he and his father had the option to slack off, but the outcome of the game depended on who chose to remain attentive and ready for the next move.", "lesson": "Spiritual success depends on our willingness to remain prepared and attentive rather than becoming complacent in our faith.", "themes": "preparedness, spiritual alertness, discipline, faithfulness, perseverance", "bible": "Matthew 24:42, 1 Peter 5:8, Ephesians 6:10", "good": "sermon, Bible study, youth, children's story", "kids": false}, {"t": "Soccer for God: Taking My Vows", "u": "https://www.guidemagazine.org/stories/soccer-for-god-taking-my-vows/", "gist": "The story follows a young boy who spent a year building a reputation as the best goalie on his school's recess field. One day, a small kindergartner asked to try the position. Although the boy felt he should let the younger child have a turn, his teammates insisted he stay in the goal because they relied on his skills. Feeling flattered by their praise, the boy agreed to a strict promise never to leave the goal. Later, during a school soccer tournament in a gymnasium, his sister asked if she could take his place. Despite his love for her, the boy felt trapped by the promise he had made to his teammates. He struggled with the internal conflict of wanting to be a loyal brother while trying to keep his word to his friends. Ultimately, he had to say no, which caused a long-lasting rift between him and his sister. The narrator reflects on this experience, realizing he made a foolish commitment without considering the consequences, leading to a difficult situation where he couldn't please anyone.", "lesson": "We must be discerning and wise before making commitments, ensuring our promises do not cause unnecessary harm to our relationships with others.", "themes": "integrity, keeping promises, wisdom, relationships, consequences", "bible": "Matthew 5:37, Proverbs 12:22, James 1:5", "good": "sermon, Bible study, youth", "kids": true}, {"t": "A Solitary Position", "u": "https://www.guidemagazine.org/stories/a-solitary-position/", "gist": "The story follows a man whose original sports team was eliminated on the first day of a tournament. Despite his personal performance, he was forced to watch from the sidelines until the Croatian team reached out to him. Because they were desperate for a goalkeeper and he spoke their language, he agreed to join them. However, once the game began, he realized he was being set up for failure. While he worked tirelessly to block shots, his new teammates were nowhere to be found, leaving him to face three attackers alone. He bore the brunt of the coach's anger and the team's frustration, even being accused of sabotage. After the team lost and reviewed the game footage, the coach finally noticed that the Croatian defenders were failing to provide any support, leaving the father completely isolated. The story ends with the team acknowledging his efforts and learning that they should not blame others for failures caused by a lack of teamwork.", "lesson": "We should not be quick to judge others for failures that result from a lack of mutual support and cooperation.", "themes": "teamwork, accountability, perseverance, fairness, unity", "bible": "Ecclesiastes 4:12, Galatians 6:2, Proverbs 27:17", "good": "sermon, Bible study, youth", "kids": true}, {"t": "Soccer for God: Friend of the Weak", "u": "https://www.guidemagazine.org/stories/soccer-for-god-friend-of-the-weak/", "gist": "Kenni, a girl who used to be a talented soccer goalkeeper, finds herself at a Pathfinder camporee. While watching a group of boys play, she feels a deep sense of nostalgia and longing to join in. However, she is paralyzed by insecurity and a fear of rejection, worrying that she is no longer good enough to play. She watches from the sidelines, feeling dejected and sad about her lost skill. After receiving words of encouragement from her father via text, she finds the courage to face her fears. The next day, she approaches the boys and asks to join the game. To her amazement, the best player in the group immediately invites her onto his team. This unexpected kindness overcomes her anxiety, leading her to realize that God often works in small moments to provide encouragement to those who feel like underdogs.", "lesson": "God provides unexpected encouragement and opportunities for us to step out of our comfort zones, even when we feel inadequate.", "themes": "overcoming fear, encouragement, self-confidence, God's grace, perseverance", "bible": "2 Timothy 1:7, Philippians 4:13, Isaiah 41:10", "good": "sermon, Bible study, youth, children's story", "kids": true}, {"t": "Human & Divine", "u": "https://www.guidemagazine.org/stories/human-divine/", "gist": "The narrator describes a profound internal struggle with the heavy burden of human existence. They feel overwhelmed by the weight of worldly wickedness, greed, and the moral failures of humanity, which feel like a crushing mountain on their shoulders. The narrator expresses a deep sense of exhaustion, feeling as though they are falling into a bottomless abyss of despair. However, a significant turning point occurs when the narrator begins to question their own role in this struggle. They realize that trying to solve the world's problems or fix human nature is a task beyond human capability. Instead of trying to carry the weight alone, the narrator decides to surrender their burdens to God. They recognize that while humans are flawed and limited, God is divine, righteous, and compassionate. The story concludes with a beautiful act of surrender: the narrator chooses to be the instrument—the sword—while allowing God to be the one who wields the power and provides the strength to fix what is broken.", "lesson": "True strength is found not in trying to carry the world's burdens alone, but in surrendering our struggles to God's divine power.", "themes": "surrender, God's power, human limitation, trusting God, spiritual strength", "bible": "Matthew 11:28, Isaiah 40:31, 2 Corinthians 12:9", "good": "sermon, Bible study, youth", "kids": false}], "iiw": [{"t": "The Runner Who Celebrated Too Soon", "u": "https://www.itiswritten.com/wp-content/uploads/2021/03/Sermon-illustrations-book-PDF-edition-v1-20210301.pdf#page=5", "gist": "During a track meet in Switzerland, an Ethiopian runner was sprinting toward the finish line with a massive lead over his competitors. Overjoyed by his perceived victory, he broke into a celebratory gesture before reaching the tape. However, he had made a critical mistake: he hadn't realized there were still 400 meters remaining in the 5,000-meter race. Because he stopped his effort too early, he plummeted from a potential first-place finish down to tenth place. The story serves as a vivid metaphor for spiritual complacency.", "lesson": "We must remain vigilant and persistent in our faith until the very end, rather than assuming we have reached our goal before God's work is complete.", "themes": "perseverance, spiritual vigilance, endurance, faithfulness, the final goal", "bible": "Matthew 24:13, Hebrews 12:1, 2 Timothy 4:7", "good": "sermon, Bible study, youth", "kids": true}, {"t": "The Prime Minister's Cat", "u": "https://www.itiswritten.com/wp-content/uploads/2021/03/Sermon-illustrations-book-PDF-edition-v1-20210301.pdf#page=5", "gist": "A man in New Zealand accidentally struck and killed a neighbor's cat while backing out of his driveway. The tragedy was compounded by the fact that the cat belonged to the country's Prime Minister. In a desperate attempt to avoid legal consequences, the man's children wrote a note asking the leader not to imprison their father. However, the situation reached a turning point when the man finally faced the Prime Minister in person. Instead of hiding behind his children's words, he took personal responsibility and offered a sincere, face-to-face apology for his actions.", "lesson": "True repentance requires moving beyond excuses to take personal responsibility for our mistakes before God and others.", "themes": "repentance, accountability, honesty, forgiveness, humility", "bible": "Psalm 86, Proverbs 28:13, James 5:16", "good": "sermon, Bible study, youth", "kids": false}, {"t": "The Moana Birthday Cake Mix-Up", "u": "https://www.itiswritten.com/wp-content/uploads/2021/03/Sermon-illustrations-book-PDF-edition-v1-20210301.pdf#page=5", "gist": "A woman contacted a bakery to order a birthday cake for her daughter inspired by the movie Moana. However, due to a misunderstanding of the name, the bakery decorated the cake with marijuana leaves and drug-related symbols instead. When the family received the incorrect order, they realized the shop had misheard the request. Despite the bizarre mistake, the family chose to find the humor in the situation rather than getting angry, making it a memorable birthday moment.", "lesson": "Clear communication is essential to avoid misunderstandings, but a spirit of grace allows us to handle mistakes with humor and kindness.", "themes": "clear communication, grace, forgiveness, humor, patience", "bible": "Proverbs 15:1, Ephesians 4:32", "good": "sermon, children's story, youth", "kids": true}, {"t": "The Stuffed Dolphin on the Freeway", "u": "https://www.itiswritten.com/wp-content/uploads/2021/03/Sermon-illustrations-book-PDF-edition-v1-20210301.pdf#page=6", "gist": "A family was traveling on a crowded highway when their four-year-old daughter accidentally tossed her beloved stuffed dolphin out of the moving car. The child was devastated and couldn't be comforted by any other toy. To help her, the mother contacted the police, who organized a rescue mission to retrieve the toy from the dangerous roadside. The operation was successful, and the little girl was overjoyed to have her favorite companion back.", "lesson": "God is willing to go to great lengths to rescue what we value and provide comfort in our times of loss.", "themes": "God's care, rescue, comfort, protection, faithfulness", "bible": "1 Peter 5:7, Psalm 34:17, Matthew 18:14", "good": "sermon, children's story, youth", "kids": true}, {"t": "The Armored Truck Money in Syracuse", "u": "https://www.itiswritten.com/wp-content/uploads/2021/03/Sermon-illustrations-book-PDF-edition-v1-20210301.pdf#page=6", "gist": "In Syracuse, New York, an armored truck accidentally spilled over $300,000 onto a public street. Two honest men discovered the cash and immediately began collecting it to ensure it reached its rightful owners. As news of the windfall spread, a large crowd gathered. While many people joined in to help return the money, others were tempted by the sight of the wealth and wanted to keep it for themselves. The situation served as a public test of character, showing how easily people can be swayed by greed when faced with unearned riches.", "lesson": "True integrity is choosing to do what is right even when no one is watching and the temptation to take a shortcut is great.", "themes": "integrity, honesty, temptation, stewardship, character", "bible": "Proverbs 13:11, Luke 12:15, Matthew 6:21", "good": "sermon, Bible study, youth", "kids": true}, {"t": "My Daddy Knows How Much I Can Carry", "u": "https://www.itiswritten.com/wp-content/uploads/2021/03/Sermon-illustrations-book-PDF-edition-v1-20210301.pdf#page=6", "gist": "A father was placing items into his young son's arms one by one. A bystander noticed the pile growing and asked the boy if the load was becoming too heavy. The child smiled confidently and replied that it wasn't too much because his father knew exactly how much he was capable of carrying. The story serves as a metaphor for our relationship with God. Just as the father understands his son's strength, God knows our limits and will never burden us with more than we can handle.", "lesson": "God provides us with the strength and grace necessary to endure every trial we face.", "themes": "God's sovereignty, strength in trials, trusting God, divine protection, perseverance", "bible": "1 Corinthians 10, Isaiah 41:10, Psalm 34:18", "good": "sermon, Bible study, children's story, youth", "kids": true}, {"t": "Ireland's Celtic Tiger Boom and Bust", "u": "https://www.itiswritten.com/wp-content/uploads/2021/03/Sermon-illustrations-book-PDF-edition-v1-20210301.pdf#page=7", "gist": "The story describes Ireland's rapid economic boom in the late 1990s, known as the 'Celtic Tiger.' While the country experienced incredible growth, the economy eventually crashed, leading to a need for a bailout. The author uses this economic cycle as a metaphor for the spiritual lives of believers. Just as a nation can rise and fall, a person's faith can reach a peak and then suddenly lose momentum. The turning point is the realization that spiritual life can become stagnant or 'flat.' The story concludes by emphasizing that the goal for Christians is not just to experience a temporary spiritual high, but to remain constantly revived in their relationship with God.", "lesson": "True faith is not a temporary emotional peak but a continuous, sustained state of spiritual renewal.", "themes": "spiritual growth, perseverance, constant renewal, faithfulness, spiritual vitality", "bible": "1 John 1:7, Isaiah 40:31, Psalm 119:105", "good": "sermon, Bible study, youth", "kids": false}, {"t": "The Welsh Revival Changes a Nation", "u": "https://www.itiswritten.com/wp-content/uploads/2021/03/Sermon-illustrations-book-PDF-edition-v1-20210301.pdf#page=7", "gist": "During the early 1900s, Wales experienced a massive religious awakening known as the Welsh revival. Hundreds of thousands of people converted to Christianity, and the movement gained global attention through media and famous preachers. However, the story notes a tragic aftermath: because the movement relied heavily on the emotional experience of the event rather than a deep, permanent root in the Word of God, the faith in Wales has significantly declined today. The turning point is the realization that a temporary spiritual high cannot replace a lifelong commitment to abiding in Christ.", "lesson": "True spiritual transformation comes from a permanent connection to the Word of God rather than a temporary emotional experience.", "themes": "spiritual growth, abiding in Christ, the Word of God, true conversion, consistency", "bible": "John 15, Galatians 2, Philippians 1", "good": "sermon, Bible study, youth", "kids": false}, {"t": "The Boots Sold at the Thrift Store", "u": "https://www.itiswritten.com/wp-content/uploads/2021/03/Sermon-illustrations-book-PDF-edition-v1-20210301.pdf#page=7", "gist": "A woman entered a second-hand shop during a cold winter day and left her muddy boots by the entrance. While she was browsing, another customer purchased the boots for only two dollars. The cashier mistakenly assumed they were a clearance item because he didn't realize their true worth. The woman was devastated to find her expensive footwear gone. This story highlights how people often overlook the true value of things—or people—simply because they appear worn or dirty on the outside.", "lesson": "Human beings often fail to recognize the inherent value of others because they judge based on outward appearances rather than internal worth.", "themes": "inner value, judgment, perspective, worth, spiritual sight", "bible": "John 6, 1 Samuel 16:7, 1 Samuel 16:18", "good": "sermon, Bible study, youth", "kids": true}, {"t": "The Missile Launcher in the Luggage", "u": "https://www.itiswritten.com/wp-content/uploads/2021/03/Sermon-illustrations-book-PDF-edition-v1-20210301.pdf#page=8", "gist": "A man traveling from the Middle East to the United States was stopped by airport security in Baltimore. During a routine check, officers discovered a missile launcher hidden inside his luggage. The man explained that he had kept the weapon as a souvenir from his military service and had no intention of using it. The story highlights how something dangerous and unexpected can be hidden in plain sight, much like the hidden nature of sin.", "lesson": "Just as a hidden weapon can cause unexpected harm, sin remains a dangerous presence in our lives until we surrender it to God.", "themes": "sin, repentance, spiritual warfare, hidden dangers, salvation", "bible": "Romans 6, John 8:7, Psalm 51", "good": "sermon, Bible study, youth", "kids": false}], "moment": [{"t": "What Drives You?", "u": "https://www.youtube.com/watch?v=SCMQejBIvKQ&t=117s", "gist": "The story begins with a reflection on human motivation, using the examples of a friend who ran a marathon in a heavy weighted vest and the late mountaineer Sir George Mallory, who climbed Everest simply because it was there. The narrator uses these extreme physical feats to pose a deeper spiritual question: what motivates a Christian to endure the hardships of faith? The narrative shifts from physical endurance to spiritual endurance, acknowledging that the Bible warns of coming tribulations, persecution, and a time of great difficulty for believers. The turning point occurs when the narrator moves from the 'why' of human effort to the 'why' of Christian hope. The story concludes by pointing to the promise in 1 Thessalonians 4, explaining that the ultimate motivation for enduring life's struggles is the certain return of Jesus Christ. It emphasizes that believers are not meant to sorrow like those without hope because the dead in Christ will rise and the living will be caught up to meet the Lord in the air.", "lesson": "The ultimate motivation for enduring earthly trials is the certain hope of Christ's return and our eternal life with Him.", "themes": "Hope, The Second Coming, Perseverance, Eternal Life, Faith", "bible": "1 Thessalonians 4:13-18, Revelation 12:9, Matthew 24:36", "good": "sermon, Bible study, youth", "kids": false}, {"t": "How to Stop Letting Fear Control Your Life", "u": "https://www.youtube.com/watch?v=Ab7RsbkPT6I&t=2170s", "gist": "The story explores the concept of Christian courage by highlighting several biblical figures who faced intense persecution for their faith. It begins with Eric Liddell, an athlete who refused to compete on the Sabbath, choosing to honor God over national pride. The narrative then shifts to the apostles, contrasting Peter’s initial cowardice—where he denied knowing Jesus when questioned by a girl—with his later boldness before the Sanhedrin. It also highlights Stephen, a deacon who remained peaceful and fearless even as he was being condemned to death, looking toward heaven and praying for his executioners. Finally, it describes the apostle Paul, who endured whipping, stoning, and imprisonment, yet remained joyful and persistent in preaching the Gospel. The turning point in all these lives was their intimate relationship with Jesus, which replaced their natural fear with a supernatural peace. The story concludes by illustrating that true courage is not just enduring death, but maintaining faith and offering forgiveness to those who persecute you.", "lesson": "True courage is found not in our own strength, but in a deep relationship with Jesus that replaces fear with divine peace and forgiveness.", "themes": "courage, overcoming fear, perseverance, forgiveness, faithfulness, peace of God", "bible": "Deuteronomy 31:6, Acts 4:13, Acts 20:24", "good": "sermon, Bible study, youth", "kids": false}, {"t": "The Glory of Gratitude", "u": "https://www.youtube.com/watch?v=2DcCi2kAzBA&t=486s", "gist": "The speaker reflects on how modern technology has made life significantly more convenient than it was in the past, noting that despite these advancements, humans often find reasons to grumble. To illustrate the lack of gratitude, the speaker shares a humorous anecdote about a pastor in Nantucket who reported that nine members were 'lost at sea' because they never sent 'thank you' notes after being rescued. The story highlights a common human tendency to take blessings for granted, much like how children rarely write thank-you notes to Santa Claus. The narrative then shifts to a real-life example from World War II, where a soldier sent a letter of appreciation to General Patton. The General was moved because it was the first time in 35 years he had received such a gesture. The speaker concludes that while we should thank God simply because He commanded it, practicing gratitude is also practical, as it opens the door for continued blessings and strengthens our relationship with the Giver.", "lesson": "Gratitude is a spiritual command that transforms our perspective from complaining about what we lack to appreciating the constant provision of God.", "themes": "gratitude, thankfulness, obedience, perspective, God's provision", "bible": "1 Thessalonians 5:18, Psalm 107:1, Colossians 3:17", "good": "sermon, Bible study, youth", "kids": true}, {"t": "Noah and the Coming Storm", "u": "https://www.youtube.com/watch?v=lHX9JozK-1c&t=87s", "gist": "The story focuses on the biblical figure Noah, who is highlighted as a hero of faith in the book of Hebrews. The narrative sets the scene during a time when the world was living normally—people were eating, drinking, and marrying—completely unaware of the impending judgment. The turning point occurs when God warned Noah of a coming flood, prompting him to begin a long period of preparation. Unlike the rest of the population who ignored the warnings and continued with their daily lives, Noah spent years building an ark. The story concludes with the arrival of the catastrophic storm, which destroyed everyone who refused to prepare but spared those who followed God's instructions. The preacher uses this historical account to illustrate that just as a storm is inevitable, spiritual preparation must happen now rather than at the last minute.", "lesson": "True faith involves proactive obedience and long-term preparation for God's coming judgment rather than waiting until a crisis arrives.", "themes": "faith, preparation, obedience, judgment, perseverance", "bible": "Hebrews 11:7, Matthew 24:37, Matthew 7:24", "good": "sermon, Bible study, youth", "kids": true}, {"t": "Under Constant Surveillance", "u": "https://www.youtube.com/watch?v=fghD2OKIGmk&t=2562s", "gist": "The narrator recounts a personal conversation with a rabbi regarding how God can simultaneously hear every person's prayer. The rabbi's simple answer—that God is simply God—serves as the foundation for the narrator's reflection on God's omnipresence. The story explores the profound truth that God sees everything, including our secret deeds, our suffering, and the injustices we face. The narrator highlights biblical examples, such as David refusing to take personal revenge on Saul and Joseph forgiving his brothers, to show that God is a just judge who eventually sets things right. Furthermore, the narrator describes God's gaze as a 'refiner's fire' that cleanses and purifies the believer. The narrative concludes with a poignant scene of Peter's denial of Jesus, where Peter sees Jesus in the judgment hall being mocked and beaten, illustrating that God's gaze is not just about judgment, but is deeply rooted in a look of love and compassion.", "lesson": "God's omnipresence ensures that He sees our hidden struggles, rewards our secret acts of kindness, and provides a purifying love that ultimately brings justice to all.", "themes": "God's omniscience, Divine justice, God's love, Forgiveness, Purification", "bible": "Proverbs 15:3, Matthew 6:3, Luke 22:61", "good": "sermon, Bible study, youth", "kids": false}, {"t": "Seven Keys for Spiritual Growth", "u": "https://www.youtube.com/watch?v=y7FpkpF4HX4&t=1190s", "gist": "The narrator recounts a personal experience during a Christian convention held at a large center. During the lunch break, a massive crowd created a bottleneck as everyone rushed toward the upward-moving escalator to reach the food line. While most people were struggling to push forward in the crowd, the narrator noticed that the downward-moving escalator was completely empty. He and his companion, Karen, decided to run up the downward escalator instead. This required significant physical effort, as they had to hop and fight against the mechanical motion of the stairs. By taking this unconventional path, they were able to bypass the crowd and reach the front of the line quickly. The narrator uses this moment to illustrate the spiritual struggle against human selfishness. He explains that while our natural inclination is to be self-centered, the Christian life requires a deliberate, sometimes strenuous effort to choose selflessness and love, much like the effort required to move against the downward escalator.", "lesson": "Spiritual growth requires a deliberate, strenuous effort to overcome our natural inclination toward selfishness and choose the path of self-love.", "themes": "Selflessness, Spiritual growth, Overcoming sin, Perseverance, Love", "bible": "1 Corinthians 4:16, Galatians 5:22, John 13:34", "good": "sermon, Bible study, youth", "kids": false}, {"t": "Who Will Be Left Standing?", "u": "https://www.youtube.com/watch?v=Pdjhwlz0z_I&t=2079s", "gist": "The story focuses on a woman named Mary from Magdala who ran a cottage business in Jerusalem. While she was working, a group of religious leaders and locals set a trap for her by sending an accomplice to enter her home. They caught her in the act of adultery and dragged her through the city streets in a state of shock and shame. Instead of casting her out of the city gates as was common practice, the accusers took her to the temple where Jesus was present. They intended to use her as a pawn to trap Jesus into either violating the Mosaic Law or executing her, both of which would have severe consequences for him. As the crowd held stones ready to strike, they demanded that Jesus judge her. However, Jesus did not give them the simple yes-or-no answer they expected. Instead, he stooped down to write in the dirt and then famously told the crowd that anyone without sin should cast the first stone, leaving the accusers bewildered and silenced.", "lesson": "Jesus redirects our focus from the sins of others to our own need for divine mercy and personal repentance.", "themes": "mercy, judgment, forgiveness, hypocrisy, grace", "bible": "John 8:7, Matthew 5:16, Luke 7:47", "good": "sermon, Bible study, youth", "kids": false}, {"t": "The True Power of Words", "u": "https://www.youtube.com/watch?v=BIKzHHinubM&t=1634s", "gist": "The story takes place on a crowded commuter train in New York City on a Monday morning. A man is traveling with his three young children, who are behaving very poorly. They are running through the aisles, jumping on seats, and being extremely loud, which causes the other passengers to become visibly annoyed. One woman eventually loses her patience and confronts the man, harshly criticizing his lack of discipline and demanding that he control his children. The man, who has his head in his hands in distress, finally looks up and whispers a heartbreaking explanation. He reveals that his wife passed away from cancer just the night before and he hasn't had the chance to tell the children yet. He explains that he was so overwhelmed by grief that he was struggling to find the words to break the news to them. Upon hearing this tragic backstory, the woman's attitude shifts instantly as she realizes the depth of his in modern missions, focusing on the reach of the gospel in China, Iran, and Iraq. He describes how satellite technology and mobile downloads are allowing millions of people in China to access the Word of God. He then highlights the presence of the Adventist church in oppressed regions like Iran and the reopening of a church in Baghdad after years of war. The climax of the story focuses on the island of Mindanao in the Philippines, where a violent rebellion had persisted for twenty years. Despite the government's inability to stop the fighting, a pastor began broadcasting evangelistic sermons to the rebel forces via radio. The turning point occurred when the rebels began to hear the message of Christ, leading them to trade their weapons for baptism. Ultimately, 500 rebels surrendered to God, signed a peace treaty with the government, and were trained to preach to their former comrades. The story concludes with the Philippine government officially honoring the church for achieving what military force could not.", "lesson": "The power of the Gospel can achieve peace and transformation in hearts where human strength and government authority have failed.", "themes": "God's power, peace, evangelism, transformation, missions", "bible": "Matthew 11:35, Ephesians 6:12, Psalm 33:12", "good": "sermon, Bible study, youth", "kids": false}]};

function setCur(row,pick){if(!row)return;if(!pick&&row._lock>Date.now())return;const rb=row.getBoundingClientRect(),C=(rb.left+rb.right)/2;
  let best,bd=1e9;row.querySelectorAll(".item").forEach(it=>{const b=it.getBoundingClientRect(),d=Math.abs((b.left+b.right)/2-C);if(d<bd){bd=d;best=it}});if(pick)best=pick;
  if(!best||best.classList.contains("cur"))return;document.querySelectorAll(".item.cur").forEach(i=>i.classList.remove("cur"));best.classList.add("cur");
  const x=byId(best.dataset.open);peek.innerHTML=`<button data-open="${x.id}"><span class="pk-t">${esc(x.t)}<small>${V2?"":"≈"}${x.mins} min · ›</small></span><span class="pk-s">${esc(brief(x))}</span><span class="pk-p"><b>Point:</b> ${esc(x.lesson)}</span></button>`;
  peek.classList.add("on");clearTimeout(ft);if(bar==="fade")ft=setTimeout(()=>peek.classList.remove("on"),4000)}

function rowInView(){let best,bd=1e9;const mid=innerHeight*.42;document.querySelectorAll("main .row").forEach(r=>{const b=r.getBoundingClientRect(),d=Math.abs((b.top+b.bottom)/2-mid);if(d<bd){bd=d;best=r}});return best}
let raf=0;const later=f=>{cancelAnimationFrame(raf);raf=requestAnimationFrame(f)};
function setupPeek(h){const on=(h==="home"||h==="")&&view==="shelves"&&matchMedia("(max-width:899px)").matches;
  peek.hidden=!on;document.body.classList.toggle("peeking",on);document.body.classList.toggle("bar-fade",bar==="fade");document.body.classList.toggle("bar-small",bar==="small");peek.classList.remove("on");if(!on)return;
  peek.style.bottom=document.getElementById("rbRail").getBoundingClientRect().height+"px";
  document.querySelectorAll("main .row").forEach(r=>r.addEventListener("scroll",()=>later(()=>setCur(r)),{passive:true}));

function hotOf(r){const c=r.getBoundingClientRect(),mid=c.left+c.width/2;let best=null,bd=1e9;r.querySelectorAll(".item").forEach(it=>{const b=it.getBoundingClientRect(),d=Math.abs(b.left+b.width/2-mid);if(d<bd){bd=d;best=it}});return best}
function setHot(r){if(!pcCar())return;const h=hotOf(r);r.querySelectorAll(".item").forEach(it=>it.classList.toggle("hot",it===h));fillInfo(r,h);const w=r.parentNode,its=[...r.querySelectorAll(".item")],i=its.indexOf(h);w.querySelector(".prev").disabled=i<=0;w.querySelector(".next").disabled=i>=its.length-1}

function updArr(r){const w=r.parentNode;if(!w.classList.contains("rowwrap"))return;if(pcCar()){setHot(r);return}w.querySelector(".prev").disabled=r.scrollLeft<4;w.querySelector(".next").disabled=r.scrollLeft+r.clientWidth>=r.scrollWidth-4}

document.addEventListener("click",e=>{const b=e.target.closest(".rarr");if(!b)return;if(pcCar()){const r=b.parentNode.querySelector(".row"),its=[...r.querySelectorAll(".item")],i=its.indexOf(r.querySelector(".item.hot")||hotOf(r)),n=its[Math.max(0,Math.min(its.length-1,i+(b.classList.contains("next")?1:-1)))];its.forEach(it=>it.classList.toggle("hot",it===n));fillInfo(r,n);b.parentNode.querySelector(".prev").disabled=its.indexOf(n)<=0;b.parentNode.querySelector(".next").disabled=its.indexOf(n)>=its.length-1;centerOn(r,n);return}const r=b.parentNode.querySelector(".row"),max=r.scrollWidth-r.clientWidth,to=Math.max(0,Math.min(max,r.scrollLeft+(b.classList.contains("next")?1:-1)*r.clientWidth*.85));
  // set arrow states from the target position, not scroll events (those can be skipped)
  b.parentNode.querySelector(".prev").disabled=to<4;b.parentNode.querySelector(".next").disabled=to>=max-4;r.scrollTo({left:to,behavior:"smooth"})});
