ar, Nung was bitten by a snake in a hole, and while his mother gave him to God, he survived and grew up believing he had been saved for a reason. At evangelistic meetings he learned about the Sabbath and healthful living, and after he told God he would not serve if his family would not follow, his mother and brother agreed to be baptized with him. As a medical missionary in the mountains he passed out health tracts at a hospital and helped a man with kidney stones using lemon juice, olive oil and water after a sacrifice failed. He also counseled a diabetic woman to change her diet, and she slowly improved.", "lesson": "God spares us for a purpose, and simple healing helps combined with prayer open doors to hearts.", "themes": "healing, medical missionary, Myanmar, health, calling", "bible": "Exodus 15:26; Psalm 118:17", "good": "sermon, health, mission emphasis", "kids": false, "by": "Pastor Scott Griswold", "src": "YouTube, ASAP Ministries", "w": 1168, "m": 370}, {"t": "Mission Matters: Rerouted", "u": "https://www.youtube.com/watch?v=BQ3dnvBEJxE&t=62s", "gist": "Memnet Murid grew up in an Eritrean Adventist home and became a doctor, but keeping the Sabbath made the profession impossible after persecution drove the church underground. He escaped through closed borders; God supplied the exact sums for the smuggler and for his passport. In California he felt called not to medicine but to ministry for his people. He now translates Adventist books and runs online evangelism.", "lesson": "God can redirect a promising career into a greater calling.", "themes": "persecution, calling, escape, provision, refugees", "bible": "Genesis 12:1; Philippians 4:19", "good": "sermon, mission emphasis, calling and education", "kids": false, "by": "Pastor Sam", "src": "YouTube, ASAP Ministries", "w": 826, "m": 372}, {"t": "Sharing the Word With Boldness", "u": "https://www.youtube.com/watch?v=v1j3kb_RDio", "gist": "Tavone grows up in an animist mountain tribe in a communist country where his father offers sacrifices until the family is poor. A neighbor's joy leads his father to Jesus, and healing and peace follow. After his father dies, the village chief demands they renounce faith. Tavone later leads Bible studies, and when new believers are driven into the jungle, they pray and hold on until the chief apologizes and land is given.", "lesson": "Holy boldness under pressure plants churches where there were none.", "themes": "persecution, boldness, church planting, perseverance, family faith", "bible": "Acts 4:19-20; Daniel 3:17-18", "good": "sermon, mission emphasis, prayer meeting", "kids": false, "by": "ASAP Ministries", "src": "YouTube, ASAP Ministries", "w": 811, "m": 373}, {"t": "One in a Million", "u": "https://www.youtube.com/watch?v=FqFmU0TIKYc&t=66s", "gist": "Ha Ow Ba, a Vietnamese girl from a house-church family, decides to hand out her father's sermon DVDs with her brother. After a Bible study in a park, security guards handcuff them and take them to the police station. She prays, explains the DVDs, and refuses to sign a promise to stop witnessing. After hours, the shift changes and the police release them.", "lesson": "Young believers can stand firm and trust God for the right words under questioning.", "themes": "persecution, courage, youth witness, DVDs, trusting God", "bible": "Luke 12:11-12; Acts 5:41", "good": "sermon, youth, mission emphasis", "kids": false, "by": "Pastor Scott Griswold", "src": "YouTube, ASAP Ministries", "w": 1157, "m": 374}, {"t": "From Mourning to Joy", "u": "https://www.youtube.com/watch?v=cO9m-BPWVUQ", "gist": "A young mother tells how her first baby, Maya, died during delivery, and how the empty first months felt meaningless. Her parents sent a red envelope each Christmas with a check to bless someone else. Years later the couple sponsors a girl the same age Maya would have been, and their later children pray for her every Friday night. Sponsoring becomes a way to honor Maya and invest in eternity.", "lesson": "Grief can be turned into giving that carries hope forward.", "themes": "grief, hope, resurrection, sponsorship, generosity", "bible": "1 Thessalonians 4:13-14; Isaiah 61:3", "good": "special services, sermon, mission emphasis", "kids": false, "by": "ASAP Ministries", "src": "YouTube, ASAP Ministries", "w": 814, "m": 389}, {"t": "K'Paw Soe's Dilemma: Destined for Monkhood, Called to Ministry", "u": "https://www.youtube.com/watch?v=0MmQMoJ5zBs", "gist": "K'Paw Soe grew up fatherless in a Buddhist Karen village in Burma, where malaria killed two of his siblings and his mother's spirit offerings changed nothing. A visiting woman's simple medicine healed him, and the family later fled to a Thai refugee camp, where school lessons and reading Genesis for himself made him want to follow Jesus even though his mother wanted him to be a monk. After resettling in the United States he was baptized, felt called to ministry at fifteen, and with the prayers and help of church members won his mother's permission to attend an Adventist academy and then college. He studies to become a minister who heals people in body and spirit as he was healed.", "lesson": "A small act of kindness and a mother's slowly softened heart can open the way for a whole life of service.", "themes": "conversion, Buddhist background, refugees, calling, family opposition", "bible": "Matthew 10:37; Psalm 27:10", "good": "sermon, youth, mission emphasis", "kids": false, "by": "K'Paw Soe", "src": "YouTube, ASAP Ministries", "w": 1288, "m": 390}, {"t": "Mission Matters Kids: Pinky Promise", "u": "https://www.youtube.com/watch?v=urpSDHY9zn8", "gist": "Thomas grows up in a Christian home but drifts into a gang. His parents pray, and an ASAP worker called Sister Bao keeps visiting him with her friends and getting a pinky promise to come to church. Three times he breaks it. At a drinking party he injures the same pinky finger. Looking at the bandage, he decides to attend church and today leads two house churches.", "lesson": "Patient, repeated visits and prayer can turn a wandering young person home.", "themes": "prodigal son, perseverance, youth ministry, parents' prayer, redemption", "bible": "Luke 15:20; Galatians 6:9", "good": "children's story, sermon, youth", "kids": true, "by": "ASAP Ministries", "src": "YouTube, ASAP Ministries", "w": 974, "m": 392}, {"t": "Cambodia Education:  The Teacher Who Skipped School", "u": "https://www.youtube.com/watch?v=omuPr5BHcOI", "gist": "Lang, a boy in a Cambodian feed-and-read school, turns from skipping class to wanting to be a pastor because of loving teachers. One of them, Sochia, tells how as a university student he refused to attend a class on Friday night to keep the Sabbath. The president threatened to expel him, and he prayed all day. The president finally excused those absences, and he later became a teacher.", "lesson": "Standing firm on a conviction, while respectful and prayerful, can open a door no one expected.", "themes": "Sabbath, faithfulness, education, courage, prayer", "bible": "Daniel 6:10; Acts 5:29", "good": "sermon, youth, special services", "kids": false, "by": "Pastor Scott Griswold", "src": "YouTube, ASAP Ministries", "w": 1251, "m": 396}, {"t": "A New Day for Deih", "u": "https://www.youtube.com/watch?v=_LfSZL33qzQ", "gist": "Born into a Sabbath-keeping family in Myanmar, Deih watched soldiers beat his father and drag his brothers away, so the family fled to Bangladesh, India, and finally the United States. There he blamed God and drifted away. While canvassing, he asked God for a specific sign, and an elderly woman invited him in and told him Jesus was real. He was baptized, felt called to ministry, and is now studying theology.", "lesson": "When we honestly ask God for proof, He answers and calls us to serve.", "themes": "refugees, persecution, doubt, calling, canvassing", "bible": "Jeremiah 29:13; Psalm 34:8", "good": "sermon, youth, calling and education", "kids": false, "by": "Deih", "src": "YouTube, ASAP Ministries", "w": 1066, "m": 396}, {"t": "Cambodia:  Christmas with a Boy Named Cow", "u": "https://www.youtube.com/watch?v=Mm8X-1hwg90", "gist": "Scott tells a Christmas story to Cambodian students about Jesus being born poor in a stable, comparing it to the clean hospital where his own daughter was born. After the party a student named Cow quietly tells how he was born in a cow corral during the Khmer Rouge years. He says the story means Jesus understands him, and his hated name no longer matters.", "lesson": "Jesus chose the hardest parts of life so everyone can know he understands.", "themes": "Christmas, incarnation, poverty, identity, understanding", "bible": "Hebrews 2:17-18; Luke 2:7", "good": "sermon, mission emphasis, Bible study and Sabbath School", "kids": false, "by": "Pastor Scott Griswold", "src": "YouTube, ASAP Ministries", "w": 1172, "m": 402}, {"t": "A Higher Calling", "u": "https://www.youtube.com/watch?v=c9Ory7PXRoA", "gist": "Born in Burma and raised in a Thai refugee camp, Joe So came to the United States at about ten and struggled with school and language. Studying nursing for a good life left him feeling empty, so he trained as a missionary, then chose theology at a college where students work their way through. Each semester his tuition has been provided through church members, donors, and ASAP.", "lesson": "When money is not enough, God calls and provides for those who step out.", "themes": "refugees, calling, provision, education, missions", "bible": "Matthew 6:33; Proverbs 3:5-6", "good": "sermon, youth, mission emphasis", "kids": false, "by": "Joe So", "src": "YouTube, ASAP Ministries", "w": 1029, "m": 402}, {"t": "322 Christians Die for Their Faith", "u": "https://www.youtube.com/watch?v=pa9eoh2ovSE", "gist": "Pastor Griswold tells of a missionary he calls Thomas, who lives next to a closed country and befriends visitors who cross the border for a short time, sharing the gospel with great care. Those visitors study the Bible with desperate hunger because they cannot take a Bible home. One woman he taught told him goodbye with a Bible in her backpack. She was caught, was told she would be freed if she named who gave her the Bible, said nothing, and paid with her life.", "lesson": "Real discipleship may cost everything, and some believers quietly pay it.", "themes": "persecution, courage, faithfulness, closed country, Bible", "bible": "Revelation 6:9-10; Matthew 10:28", "good": "sermon, mission emphasis", "kids": false, "by": "Pastor Scott Griswold", "src": "YouTube, ASAP Ministries", "w": 1086, "m": 404}, {"t": "Bryan's Journey and Conversation with Muslims", "u": "https://www.youtube.com/watch?v=X6uw268d7bk&t=64s", "gist": "A speaker's overseas flight was cancelled in New York. Choosing to trust God, he found himself in line near a young Muslim man reading an English-only Quran in an American university sweatshirt. They talked for forty minutes and were put on the same flights, where the young man shared how reading the Quran had convicted him to read the Bible. They studied Isaiah together on the long journey, and he asked the speaker to pray he could share this with his family.", "lesson": "God can turn a canceled flight into an appointment with a seeker.", "themes": "Muslim outreach, divine appointment, friendship, Bible study", "bible": "Romans 8:28; Isaiah 53:5", "good": "sermon, evangelism and outreach, mission emphasis", "kids": false, "by": "ASAP Ministries", "src": "YouTube, ASAP Ministries", "w": 1295, "m": 407}, {"t": "One Time Associate Pope for Egypt", "u": "https://www.youtube.com/watch?v=0m-7s0z7ZE8", "gist": "A senior Coptic Orthodox clergyman in Egypt studied the difference between Jehovah's Witnesses and Adventists after the Pope claimed they were the same. When he reported that they differ, the Pope gave him three options and disowned him when he chose to keep studying the Bible. Hearing a voice and reading Revelation 18, he left, hid from threats, and was led by phone calls to an Adventist pastor who offered baptism. He now ministers among Arabic speakers and Muslims in New York.", "lesson": "Obeying God sometimes costs everything, yet God leads sincere seekers step by step to the truth.", "themes": "conversion, persecution, Sabbath, Coptic church, obedience", "bible": "Acts 5:29; Revelation 18:4", "good": "sermon, mission emphasis, prayer meeting", "kids": false, "by": "Nessie (former associate pope of the Coptic Orthodox Church)", "src": "YouTube, ASAP Ministries", "w": 890, "m": 408}, {"t": "Imagine You Were this Buddhist Lady", "u": "https://www.youtube.com/watch?v=iZPCmEBLzUg&t=50s", "gist": "The story follows Chi Sang, a Cambodian Buddhist woman who could not read and fiercely opposed her husband becoming a Christian. Over time her daughter's prayers and a church team's prayers for her sick son softened her. She was baptized, learned simple health care, and nursed a neighbor whose whole family then came to Christ. The Cambodian mission eventually asked her to become a medical missionary.", "lesson": "Someone who once resisted Jesus most fiercely can become one of his best messengers.", "themes": "conversion, family opposition, medical missionary, Cambodia, prayer", "bible": "Acts 9:15; Mark 5:19", "good": "sermon, family and women, mission emphasis", "kids": false, "by": "Pastor Scott Griswold", "src": "YouTube, ASAP Ministries", "w": 1227, "m": 410}, {"t": "You Won't Be Sorry", "u": "https://www.youtube.com/watch?v=uKECe1YQ2yU", "gist": "Osman, a thirteen-year-old Syrian refugee in Beirut, begs for a place in a small Adventist school that is already full. A teacher tells him to wait, but he keeps returning every few weeks, once with an employer offering to pay. When a seat opens he works so hard that he earns the most-improved award. After graduating he keeps returning to help, and his classmates begin to dream of futures.", "lesson": "Persistence and a small chance can change how a child sees the future.", "themes": "refugees, education, perseverance, hope, service", "bible": "Luke 18:1-8; Jeremiah 29:11", "good": "sermon, mission emphasis, children's story", "kids": true, "by": "ASAP Ministries", "src": "YouTube, ASAP Ministries", "w": 860, "m": 418}, {"t": "Timid Boonee Finds Great Courage", "u": "https://www.youtube.com/watch?v=w8San5X5MnY", "gist": "Boni, a shy girl in Vietnam, grew up with an alcoholic mother and a father in the communist government, and came to church after a friend invited her. Small answered prayers, such as recovering a bag left on a bus, built her faith, and she began paying tithe and keeping the Sabbath, once even receiving a scholarship from a classmate who beat her for it. When two girls from her youth group were held at a police station for giving out DVDs, her friends asked her to go in and argue for their release. Though terrified, she spoke with sudden courage, and the girls were released at midnight.", "lesson": "Ordinary, timid people become bold when they depend on God one small step at a time.", "themes": "courage, youth, answered prayer, Vietnam, witness", "bible": "2 Timothy 1:7; Joshua 1:9", "good": "sermon, youth, mission emphasis", "kids": false, "by": "Pastor Scott Griswold", "src": "YouTube, ASAP Ministries", "w": 1366, "m": 427}, {"t": "Slavery:  Free the Slaves", "u": "https://www.youtube.com/watch?v=Ij_D1siD3SQ", "gist": "William Wilberforce was a rich English politician who drifted into gambling and drinking until a long carriage trip led him to a deep conversion. He considered leaving politics, but John Newton urged him to serve God through it. For twenty-six years Wilberforce campaigned against the slave trade, and he lived to hear that slavery's abolition was guaranteed in 1833, three days before he died.", "lesson": "One person fully surrendered to God can help change a nation's conscience.", "themes": "abolition, perseverance, conversion, justice, Christian influence", "bible": "Proverbs 31:8-9; Micah 6:8", "good": "sermon, mission emphasis", "kids": false, "by": "Pastor Scott Griswold", "src": "YouTube, ASAP Ministries", "w": 1215, "m": 431}, {"t": "A Teacher's Sacrifice", "u": "https://www.youtube.com/watch?v=TeV5SpzLeEs", "gist": "Lana, a bright twelve-year-old at a Cambodian mission school, cannot return because her family lives in an abandoned house and cannot pay even small fees. Her teacher Vennie notices, gathers the other teachers, and they each give from their small stipends. She brings the parents rice and the news of sponsorship. Lana later wants to be a Christian and is baptized with 21 others.", "lesson": "Small sacrifices from caring teachers can keep a child's future open.", "themes": "sacrifice, education, compassion, generosity, sponsorship", "bible": "2 Corinthians 8:2-4; James 2:15-16", "good": "sermon, mission emphasis, calling and education", "kids": false, "by": "ASAP Ministries", "src": "YouTube, ASAP Ministries", "w": 691, "m": 433}, {"t": "Ali the Atheist International Student", "u": "https://www.youtube.com/watch?v=15WMdx43nsk&t=130s", "gist": "Raised in a Chinese Buddhist home, Ali hated religion and called herself a hard atheist. As an international student in Australia she was invited to a free Friday dinner at a Christian club, felt a peace she had never known, and kept coming. One night John 3:16 broke through her defenses. Her family reacted with anger to her baptism, but after two years of prayer and steady faithfulness they welcomed her home with respect.", "lesson": "Steady love, not argument, opens the hardest hearts, including family.", "themes": "atheism, international students, love, family opposition, conversion", "bible": "John 3:16; 1 Peter 3:15", "good": "sermon, evangelism and outreach, Bible study and Sabbath School", "kids": false, "by": "Ali (Ally)", "src": "YouTube, ASAP Ministries", "w": 1187, "m": 442}, {"t": "Top 7 Favorite Podcasts: Sopea's Not a Slave Anymore", "u": "https://www.youtube.com/watch?v=MLh39GGWMRs", "gist": "Sopea was a poor Cambodian farm girl determined to finish school. After a pastor's family helped her and her own family sold buffalo for her fees, she took a babysitting job in Phnom Penh that turned out to be forced labor: she was locked in, unpaid, and told she owed money to leave. She prayed, found a gate open, and escaped by bus, where a mission leader happened to meet her. She now teaches village children to read.", "lesson": "God opens doors for people trapped in slavery and can use rescued people to rescue others.", "themes": "human trafficking, prayer, Cambodia, education, deliverance", "bible": "Psalm 91:2; Acts 12:7", "good": "sermon, prayer meeting, mission emphasis", "kids": false, "by": "Pastor Scott Griswold", "src": "YouTube, ASAP Ministries", "w": 1398, "m": 450}, {"t": "God's Miracle Property", "u": "https://www.youtube.com/watch?v=hmRU_RrMEqk", "gist": "Pastor Scott and Julie Griswold searched Houston for a training center site, lost two properties, and left on a mission trip with nothing. A stranger phoned about a 26-acre former homeless ministry. The asking price was well above their offer, but at a camp meeting a couple shared that their unexpected tax refund matched exactly the amount needed. The owner accepted a small final gap, and they moved in the next day.", "lesson": "When God calls, He provides, often at the last moment and in exact amounts.", "themes": "faith, provision, answered prayer, mission training center", "bible": "Proverbs 3:5-6; Genesis 12:1", "good": "sermon, mission emphasis, prayer meeting", "kids": false, "by": "Pastor Scott Griswold", "src": "YouTube, ASAP Ministries", "w": 1461, "m": 458}, {"t": "End of the Road", "u": "https://www.youtube.com/watch?v=bvTYkzpqAbA", "gist": "As the Japanese army closed in on Burma in 1942, missionary Eric B. Hare and his co-workers fled toward India. Along the way two wealthy women said it was too late to give or to be baptized, and a poor deacon pressed his last pay and Sabbath offering on them. On the jungle road the refugees' true character showed at the water supply and the soup pot, and those who stood back later rode in comfortable buses while the pushy ones were crammed into old trucks.", "lesson": "When life is in danger, what has been built in us all along is what rises to the surface, so we should build it now.", "themes": "character, readiness, second coming, generosity, mission history", "bible": "Proverbs 15:24; Matthew 20:16", "good": "sermon, children's story", "kids": true, "by": "Pastor Scott Griswold", "src": "YouTube, ASAP Ministries", "w": 1496, "m": 460}, {"t": "Prayer Set the Captive Free", "u": "https://www.youtube.com/watch?v=1qxp1Kta3gw", "gist": "A Cambodian businesswoman was harassed by spirits that demanded endless sacrifices, and monks and doctors could not help. Her husband urged her to find a Christian, and she met an ASAP-sponsored teacher in the market who told her about Jesus. That night she dreamed of a man in white, resisted the spirit, and felt freedom. The next Sabbath the family went to church, destroyed the altars and idols, were baptized, and her witness brought more families to Christ.", "lesson": "Prayer in Jesus' name breaks the grip of fear and evil spirits.", "themes": "Spirit worship, prayer, deliverance, baptism, Cambodia", "bible": "John 14:12-14; Mark 5:15", "good": "sermon, prayer meeting, mission emphasis", "kids": false, "by": "ASAP Ministries", "src": "YouTube, ASAP Ministries", "w": 1433, "m": 464}, {"t": "Now a Soldier for the Courts Above", "u": "https://www.youtube.com/watch?v=Zuc_qeJYFGY&t=106s", "gist": "Bolu grew up fleeing war in Myanmar and first went to school in a Thai refugee camp. After rejecting Buddhism and drifting into drinking and drugs, he prayed that God would show him truth. At an Adventist jungle school he studied the Bible, was re-baptized, and endured mockery. Though he planned to join the army, a call came to teach and do Bible work in a new village, and he accepted.", "lesson": "God redirects searching young people from war and addiction to mission.", "themes": "refugees, searching, calling, jungle school, Karen people", "bible": "Joshua 24:15; Matthew 28:19", "good": "sermon, youth, mission emphasis", "kids": false, "by": "ASAP Ministries", "src": "YouTube, ASAP Ministries", "w": 962, "m": 464}, {"t": "Ciin Kiim's Triumph", "u": "https://www.youtube.com/watch?v=W_N6TRsxdZQ", "gist": "Ciin Kiim, a theology student, grew up in Burmese jungle villages under military attack, separated from his father for ten years. He and his mother survived a cyclone by praying constantly, then joined his father in America in 2010 though he had never been to school. Years later, when an $8,000 bill came due with almost no time, gifts arrived from people in several states at the last moment. He now feels called to serve his own people.", "lesson": "God uses hard seasons to build trust, and his help arrives right on time.", "themes": "refugees, Myanmar, perseverance, provision, calling", "bible": "Psalm 91:2; Philippians 4:19", "good": "sermon, youth, mission emphasis", "kids": false, "by": "Ciin Kiim", "src": "YouTube, ASAP Ministries", "w": 1189, "m": 480}, {"t": "There is Power in the Name of Jesus", "u": "https://www.youtube.com/watch?v=UfPVSf-HTGQ", "gist": "Nelly, a Bible worker, was tormented by spirits after seeking help from physicians and witch doctors who only drained her family's money. A church member introduced her to Jesus, and fellow believers prayed and sang at her house until she was free. Over months the family suffered more attacks, including her husband's blindness, until they destroyed all charms. His eyesight returned and the whole family followed Jesus.", "lesson": "There is real power in the name of Jesus when his people persist in prayer.", "themes": "spiritual warfare, deliverance, prayer, family conversion, faith", "bible": "Acts 4:12; Philippians 2:9-10", "good": "sermon, prayer meeting, mission emphasis", "kids": false, "by": "ASAP Ministries", "src": "YouTube, ASAP Ministries", "w": 1235, "m": 491}, {"t": "God Can Even Save a Cannibal", "u": "https://www.youtube.com/watch?v=YV8RB55Tvk4", "gist": "Savani, a Cambodian student, came to Jesus through an English class that used the Bible, was baptized in 1994, and began his own classes even when relatives and officials shut them down. After years of work and training he became a church planter in an unreached province. In the same region lived Ravi, a former Khmer Rouge soldier who had boasted of killing and even eating his victims and now lived haunted by guilt. Ravi watched a Jesus film at a neighbor's house, learned to read in Savani's literacy class, and was baptized in 2012 along with his wife and son.", "lesson": "No one is too far gone for the gospel, and God sends someone to every one of them.", "themes": "forgiveness, Cambodia, conversion, church planting, transformation", "bible": "1 Timothy 1:15; Acts 9:15", "good": "sermon, mission emphasis, special services", "kids": false, "by": "Pastor Scott Griswold", "src": "YouTube, ASAP Ministries", "w": 1503, "m": 493}, {"t": "From Buddhist Monk to Adventist Pastor", "u": "https://www.youtube.com/watch?v=6u41_2VD-0k", "gist": "Johan, a Cambodian boy, first heard about Jesus when a missionary from across the Thai border ran a children's Bible class in his village and gave him an English Bible. After the missionaries left he was taken to a large temple in Thailand and ended up ordained as a Buddhist monk. There he secretly kept reading the Bible, and a verse in Revelation where the angel refuses worship made him realize he could not sit on a platform and be worshiped. He asked three times to leave the temple, returned to the church, and later trained as a pastor and church planter.", "lesson": "God's Word in a seeker's hands can do what no argument could.", "themes": "Buddhist monk, Bible reading, conversion, Cambodia, worship", "bible": "Revelation 22:8-9; Isaiah 55:11", "good": "sermon, mission emphasis, Bible study and Sabbath School", "kids": false, "by": "Pastor Johan", "src": "YouTube, ASAP Ministries", "w": 1533, "m": 520}, {"t": "God's Jungle Soldier in America", "u": "https://www.youtube.com/watch?v=1chH7FqplB8", "gist": "Baby Jimmy nearly died in a Karen village in Myanmar until his father, the village chief, had the elders anoint him and promised to give the boy to God if he lived. Jimmy grew up wanting to be a soldier and for years ran from the call to ministry, taking a political job instead, until he finally began helping churches and planting new ones around the Thai border. He then resisted moving to America, much as Jonah resisted Nineveh, but went when scattered Karen refugee families needed a shepherd. In North Carolina he gathered a few families who met in homes, won the support of the conference, and today there are dozens of Karen-led congregations and a home church of more than 180.", "lesson": "God can turn a reluctant runner into a faithful shepherd for people nobody else is looking after.", "themes": "calling, reluctance, refugees, church planting, Jonah", "bible": "Jonah 1:1-3; John 10:11", "good": "sermon, mission emphasis, special services", "kids": false, "by": "Pastor Scott Griswold", "src": "YouTube, ASAP Ministries", "w": 1572, "m": 521}, {"t": "Our Plague of Snakes", "u": "https://www.youtube.com/watch?v=6eES1xS5SUM", "gist": "In 2005 Scott Griswold's family moved into a roomy teak house in central Thailand, and over the next months his wife and children had one frightening snake encounter after another, from a viper in a mango tree to a cobra that missed his wife on the very morning he was praying far away. Julie concluded that the spirit house on the property was involved and asked the landlord to remove it. He built a tall fence instead, and the snakes stopped. The landlady then told how she had once begged any god for help with her debts, and she later studied the Bible and was baptized.", "lesson": "God protects his people in a real spiritual battle, and he can use trouble to reveal himself to neighbors.", "themes": "spiritual warfare, protection, prayer, missions in Thailand, Spirit house", "bible": "Luke 10:19; Ephesians 6:12", "good": "sermon, prayer meeting, mission emphasis", "kids": false, "by": "Pastor Scott Griswold", "src": "YouTube, ASAP Ministries", "w": 1696, "m": 526}, {"t": "Te'a Finds His Faith", "u": "https://www.youtube.com/watch?v=CVIXuZz5VJ0", "gist": "Te'a grew up in Myanmar with an Adventist mother and Buddhist father and drifted from faith. After he and his family fled to Malaysia, a church sign and the Bible moved him to keep the Sabbath; he lost his job for it, then prayed and found one that gave him Sabbaths off. Years later he reached the United States, was admitted to Andrews University without school papers, and now hopes to serve refugees as a pastor.", "lesson": "God keeps his promise to people who choose obedience, and he prepares our past for later service.", "themes": "testimony, refugees, Sabbath, faithfulness, education", "bible": "John 14:15; Matthew 6:33", "good": "sermon, Bible study and Sabbath School, mission emphasis", "kids": false, "by": "Lauren Oma (Te'a)", "src": "YouTube, ASAP Ministries", "w": 1163, "m": 530}, {"t": "A Thai Buddhist Meets Jesus", "u": "https://www.youtube.com/watch?v=lOzG7DSH43I", "gist": "Scott Griswold tells how Thanh, a Thai Buddhist, came to Andrews University as an international student because his Adventist girlfriend hoped he would meet Jesus. Kind hosts, Bible studies, and a student group led him to baptism. A Thai friend, Joon, then prayed for a visa and also came to America. Both returned to Thailand, and a Chinese student soon joined the group too.", "lesson": "Friendly kindness toward international students can open the door to Jesus.", "themes": "international students, buddhists, friendship, Bible study, answered prayer", "bible": "Acts 1:8; Matthew 28:19", "good": "sermon, Bible study and Sabbath School, mission emphasis", "kids": false, "by": "Pastor Scott Griswold", "src": "YouTube, ASAP Ministries", "w": 1725, "m": 530}, {"t": "'Just Cut My Foot Off!'", "u": "https://www.youtube.com/watch?v=_HfV0mZtncg", "gist": "Visiting remote mountain villages in Southeast Asia, a mission team meets Wah, a woman whose leg has been infected for years. The village will not let her leave without her husband, and the team waits and prays. A day and a half later the couple appears. A hospital sees her, she is admitted for treatment, and the pain is gone within days. She weeps tears of joy that a foreigner finally stopped to care.", "lesson": "Real love stops for the one person nobody else has helped.", "themes": "compassion, healing, medical missionary, persistent prayer, cultural respect", "bible": "Matthew 25:35-40; Luke 10:33-34", "good": "sermon, mission emphasis, health", "kids": false, "by": "Julie Griswold", "src": "YouTube, ASAP Ministries", "w": 1663, "m": 558}, {"t": "Transformation:  The Day Scott Griswold Died", "u": "https://www.youtube.com/watch?v=kvhUDQOF2H4", "gist": "A good church kid with no passion, Scott heard the call to die like a seed in John 12:24 at sixteen. Through a new pastor and a Bible study he saw how much Jesus gave on the cross and how selfish his own heart was. Learning that Christ's word creates new life, and that we died with Him, he surrendered. Daily dying to self has become the center of his life and mission.", "lesson": "Real Christianity begins with dying to self and living by Christ's creative power.", "themes": "conversion, surrender, cross, teenage faith, self-denial", "bible": "John 12:24; Galatians 2:20", "good": "sermon, youth, prayer meeting", "kids": false, "by": "Pastor Scott Griswold", "src": "YouTube, ASAP Ministries", "w": 1589, "m": 560}, {"t": "A Canadian Hindu and Her Dying Child", "u": "https://www.youtube.com/watch?v=UFt3fncMZwc&t=66s", "gist": "A Canadian Hindu mother's premature daughter was given no hope by doctors. With none of her idols at hand, she saw her husband's quiet prayer answered when the tubes cleared and the baby began to recover. She invited an Adventist pastor to pray, accepted his invitation to an evangelistic series, and over the following years let go of her other gods. Her whole family and later her father were baptized, and her daughter is healthy at twelve.", "lesson": "One answered prayer can lead a whole family from idols to Jesus.", "themes": "Hindu conversion, healing, answered prayer, family, patience", "bible": "Psalm 103:2-3; Joshua 24:15", "good": "sermon, prayer meeting, mission emphasis", "kids": false, "by": "ASAP Ministries", "src": "YouTube, ASAP Ministries", "w": 1684, "m": 564}, {"t": "Fear in Cambodia:  Conquer Fear Through God's Word", "u": "https://www.youtube.com/watch?v=iOZuG2gM-3o", "gist": "Julie, newly pregnant and living in Cambodia as a missionary, is paralyzed by fear after shootings, landmines and a gun held to her head. She tells her husband she wants to go home. He asks her to fall on her knees at every fearful thought and replace it with a Bible verse for two weeks. By day 14 the fear is gone, and they stay five more years.", "lesson": "God's word replaces fear when we claim it one thought at a time.", "themes": "fear, faith, Scripture, prayer, courage", "bible": "1 John 4:18; 2 Timothy 1:7", "good": "sermon, prayer meeting, family and women", "kids": false, "by": "Julie Griswold", "src": "YouTube, ASAP Ministries", "w": 1608, "m": 625}, {"t": "Missions Calling:  Our Surprise Missionary Call", "u": "https://www.youtube.com/watch?v=Vj9v4O65mEI&t=65s", "gist": "Scott grows up thinking missions are nearly finished, until a mission conference shows him thousands of unreached people groups. A pair of friends leave for Mongolia, and a refugee-ministry leader tells him about Cambodia. On the night of his wife's graduation they are asked to go to Thailand right away. Within three months they move, staying many years and seeing a small church begin.", "lesson": "Willingness to start praying for a people group is how God begins a missionary call.", "themes": "calling, missions, unreached peoples, obedience, prayer", "bible": "Matthew 28:18-20; Isaiah 6:8", "good": "sermon, mission emphasis", "kids": false, "by": "Pastor Scott Griswold", "src": "YouTube, ASAP Ministries", "w": 1431, "m": 632}, {"t": "Khu Fa's New Name", "u": "https://www.youtube.com/watch?v=RdYYdI2v2hY", "gist": "Khu Fa was a Hmong refugee from Laos whose father was a shaman. After her husband died, she suffered three years of sickness and spirit attacks that no healer or doctor could fix. A neighbor connected her with Hmong Adventist pastor Chan Chai, who prayed with her through the nights until the pain left. After months of Bible study the church burned her spirit items and she took the new name Pachia, meaning blooming flower, and was baptized.", "lesson": "God's power is greater than every spirit that holds people in fear.", "themes": "Spirit worship, healing, Hmong refugees, new name, baptism", "bible": "Ephesians 6:12; John 10:10", "good": "sermon, mission emphasis, prayer meeting", "kids": false, "by": "Khu Fa (Pachia)", "src": "YouTube, ASAP Ministries", "w": 1541, "m": 712}, {"t": "From Boxing Buddhist to Theology Student", "u": "https://www.youtube.com/watch?v=p4Hs1n0DYac", "gist": "A young man raised Buddhist in a refugee camp in Thailand wants to be baptized but is told by his parents he would be sent away. He enters a kickboxing match with no training, is beaten, and prays that if he wins he will be baptized. His opponent is knocked down by his first charge. He keeps the promise, brings his brother and friends to Jesus, and is now a ministerial student.", "lesson": "A desperate promise to God, kept, can launch a life of ministry.", "themes": "conversion, vows, family opposition, testimony, calling", "bible": "Psalm 50:14-15; 1 Samuel 17:45", "good": "sermon, youth, testimony", "kids": false, "by": "ASAP Ministries", "src": "YouTube, ASAP Ministries", "w": 1455, "m": 824}], "asap": [{"t": "Are You Possessed?", "u": "https://www.asapministries.org/stories/are-you-possessed", "gist": "A Cambodian traffic policeman, Thy Thouen, is tormented at night by visions of ghosts and goes to a shaman, who admits he cannot help. The shaman sends him at midnight to church planter Sim Thearith, who prays over the water and rice the man fears and then prays with church members until morning. Thy sleeps in peace and wakes completely free. He tells everyone about the living God who overcame what the healer could not.", "lesson": "Jesus has power over evil spirits where human power fails.", "themes": "spiritual warfare, deliverance, Buddhist background, prayer, testimony", "bible": "Mark 5:15, Luke 10:19", "good": "sermon, mission emphasis, prayer meeting", "kids": false, "by": "Glesni Mason", "src": "ASAP Ministries", "w": 1222}, {"t": "Broken Pipes and New Missionaries", "u": "https://www.asapministries.org/stories/broken-pipes-and-new-missionaries", "gist": "During a deep freeze in Texas, new believers Phaly and Lynetta, recently baptized from Laotian and Cambodian backgrounds, have busted pipes and no water. Church friends help them, and then the two go out to help an elderly couple with no water, and the exact parts are provided within two days. The pastor sees these brand-new members becoming missionaries to their own neighbors.", "lesson": "New believers become missionaries the moment they start serving others.", "themes": "service, new believers, community, refugees, church planting", "bible": "Acts 2:46, Galatians 6:2", "good": "sermon, mission emphasis, Bible study and Sabbath School", "kids": false, "by": "Pastor Scott Griswold", "src": "ASAP Ministries", "w": 685}, {"t": "Closing the Circle of Marginalized to Missionary", "u": "https://www.asapministries.org/stories/closing-circle-marginalized-missionary", "gist": "A teacher in an ASAP school struggles with a disruptive boy, Eyu, whose parents do not care. One night he comes back from sneaking out under the influence of drugs, and the teacher and students kneel and pray with him in the dark. He changes, is baptized, is disowned by his parents, and clings to a promise from Psalm 27. Today he is a teacher at the school and hopes to reach friends in the lifestyle he left.", "lesson": "God turns the hurting and marginalized into missionaries to their own people.", "themes": "transformation, addiction, perseverance, forgiveness, mission schools", "bible": "Psalm 27:10, Luke 15:20", "good": "sermon, youth, mission emphasis", "kids": false, "by": "Mirna Ortiz, told from the viewpoint of Poe Moe Thay (pseudonym)", "src": "ASAP Ministries", "w": 925}, {"t": "Courageous Widow Shares Her Story of Hope", "u": "https://www.asapministries.org/stories/courageous-widow-shares-her-story-hope", "gist": "A Cambodian widow whose husband died of AIDS is rejected by relatives and tries to support her two teenage sons by selling fruit, though she is pushed aside and often unwell. One evening a kind woman buys all her fruit and invites her to church, where she learns that she can pray about her work. She begins praying daily, sells more, and finds a new church family that will care for her sons.", "lesson": "God hears the poor and sick, and a praying church family becomes a new home.", "themes": "poverty, widows, prayer, provision, church family", "bible": "Psalm 68:5, Philippians 4:19", "good": "sermon, prayer meeting, mission emphasis", "kids": false, "by": "Bun Hean", "src": "ASAP Ministries", "w": 869}, {"t": "Despite Obstacles", "u": "https://www.asapministries.org/stories/despite-obstacles", "gist": "A new Adventist lay leader in a restrictive country meets police checkpoints on the way to village worship groups. After four checkpoints, a soldier at the fifth turns him back, so he prays and finds a guide who knows back trails, a trip that takes far longer and costs more. He reaches the villagers, and four of his five groups become Adventist.", "lesson": "Persistent prayer finds a way when the main road is closed.", "themes": "perseverance, prayer, persecution, courage, village evangelism", "bible": "Acts 5:29, Psalm 34:4", "good": "sermon, mission emphasis, prayer meeting", "kids": false, "by": "ASAP Ministries", "src": "ASAP Ministries", "w": 290}, {"t": "Discovering the Power of Prayer", "u": "https://www.asapministries.org/stories/discovering-power-prayer", "gist": "A missionary meets Nong Sokkorn, a widow weaving rugs, ill with numbness, diabetes, and failing sight while raising three children alone. He offers to pray with her and returns to give Bible studies, and she begins coming to church. She finds less worry and a new peace, and tells others that a power from God is strengthening her.", "lesson": "Peace in Christ reaches us even when our circumstances stay hard.", "themes": "widows, illness, peace, Bible study, hope", "bible": "Matthew 11:28, Philippians 4:7", "good": "sermon, prayer meeting, Bible study and Sabbath School", "kids": false, "by": "Meghan Scully", "src": "ASAP Ministries", "w": 433}, {"t": "God Always Has a Plan", "u": "https://www.asapministries.org/stories/god-always-has-plan", "gist": "Eleven-year-old Saeng arrives in California from a Thai refugee camp and knows no English. A Hmong-Thai pastor and his wife welcome him through tutoring, and he is baptized and feels called to ministry. When he chooses ministry over his parents' wishes they disown him, but after he saves his mother's life and prays for them they take him back and years later are baptized too. He becomes a pastor and church planter among the Lao.", "lesson": "God can use a frightened refugee child and soften even hard family hearts.", "themes": "calling, refugees, family, forgiveness, church planting", "bible": "Psalm 27:10, Jeremiah 29:11", "good": "sermon, youth, mission emphasis", "kids": false, "by": "ASAP Ministries", "src": "ASAP Ministries", "w": 994}, {"t": "God Takes Care of Me", "u": "https://www.asapministries.org/stories/god-takes-care-me", "gist": "A disabled Cambodian man with AIDS and his wife are in a hospital with no home to return to. A visiting church member tells him God hears prayer, so he prays for shelter. Three days later he finds a small empty shop at a pagoda and discovers the lady leading the nearby church is the same woman from the hospital. Later he is invited to live at the church center.", "lesson": "God answers a desperate prayer by arranging a meeting we could never plan.", "themes": "answered prayer, illness, poverty, provision, new faith", "bible": "Philippians 4:19, Psalm 34:4", "good": "sermon, prayer meeting, testimony", "kids": false, "by": "Chheurn Oeun", "src": "ASAP Ministries", "w": 703}, {"t": "Grandma Somkeet's Priceless Gift", "u": "https://www.asapministries.org/stories/grandma-somkeets-priceless-gift", "gist": "An elderly Thai woman, Somkeet, who cannot read, is visited by a woman who reads her a tract and later gives her a Bible, which her husband burns while drunk. She asks for another Bible, and the author hands over her own pocket Bible. A missionary friend then happens to have a solar audio player loaded with the Bible in Thai, and Somkeet hears God's Word for the first time.", "lesson": "God makes sure that those who hunger for His Word can receive it.", "themes": "Bible, the Word of God, generosity, providence, children's story", "bible": "Psalm 119:105, Romans 10:17", "good": "children's story, sermon, mission emphasis", "kids": true, "by": "Julia O'Carey", "src": "ASAP Ministries", "w": 588}, {"t": "He Saved My Life", "u": "https://www.asapministries.org/stories/he-saved-my-life", "gist": "A resident of a leprosy colony falls into a dry well while gardening. Two missionaries, Brother Wu and Sister Fan, rescue him, stay with him all night in the hospital, and see him through four operations. He had never heard of Jesus before they came, and he says their daily loving service showed him who Jesus is and gave him a new life.", "lesson": "People see Jesus through those who love the unlovable.", "themes": "love, service, leprosy, conversion, compassion", "bible": "1 John 4:10-11, Matthew 25:40", "good": "sermon, mission emphasis, special services", "kids": false, "by": "Chen Ja Sai", "src": "ASAP Ministries", "w": 516}, {"t": "Heaven Planned It All Along", "u": "https://www.asapministries.org/stories/heaven-planned-it-all-along", "gist": "A Lao pastor visiting Michigan hears a knock and finds his aunt, who once cursed him and threw out his Bible when he became a Christian. She apologizes and says she has become a Christian too, and he links her with the local Adventist group, where she is baptized. Years later he returns to pastor the same Lao group, and she hosts his family.", "lesson": "God arranges meetings across the world to reach one soul and open doors for ministry.", "themes": "providence, forgiveness, family, persecution, divine appointment", "bible": "Romans 8:28, Acts 17:26", "good": "sermon, mission emphasis, prayer meeting", "kids": false, "by": "Julia O'Carey", "src": "ASAP Ministries", "w": 510}, {"t": "It Is Heart Missionaries That Are Needed", "u": "https://www.asapministries.org/stories/it-heart-missionaries-are-needed", "gist": "A dental assistant on a Thailand mission trip feels discouraged, fearing she is useless without doctors and a full medical team. At a border school the children welcome the team with joy and love, and a girl whispers that she has changed her life and calls her mom. She learns that showing up with love is what changes lives.", "lesson": "Mission is about loving people the way Christ would, not about credentials.", "themes": "mission trips, doubt, love, service, purpose", "bible": "1 John 4:19, Matthew 25:40", "good": "sermon, mission emphasis, youth", "kids": false, "by": "Emilie Carr", "src": "ASAP Ministries", "w": 969}, {"t": "Let the Children Preach!", "u": "https://www.asapministries.org/stories/let-children-preach", "gist": "On a mission trip to Cambodia, the team decides to train local schoolchildren to present a week of evangelistic meetings. The children struggle with scripts and nerves until coaches help them speak from the pictures in their own words. Villagers come and many accept Jesus, and the last sermon is preached by the nervous little girl.", "lesson": "God uses children, even the fearful ones, to share the gospel.", "themes": "children, evangelism, training, courage, Buddhist outreach", "bible": "Matthew 19:14, 1 Timothy 4:12", "good": "sermon, children's story, mission emphasis", "kids": true, "by": "Pastor Scott Griswold", "src": "ASAP Ministries", "w": 649}, {"t": "For the Love of Chai", "u": "https://www.asapministries.org/stories/love-chai", "gist": "A church planter in Laos cares for her older brother Chai, who has a mental disability, after their mother's death. One morning he returns bleeding with no explanation, and the family has no money for a hospital. While her relatives mock her, she prays, and the bleeding stops. Her relatives do not believe, but Chai now prays with her.", "lesson": "God hears a simple prayer, even when family doubts.", "themes": "healing, prayer, disability, faith, family", "bible": "Luke 18:27, Jeremiah 32:17", "good": "sermon, prayer meeting, testimony", "kids": false, "by": "Liana Kim, as told by Miriam Salualee (pseudonym)", "src": "ASAP Ministries", "w": 456}, {"t": "The Miracle Bible", "u": "https://www.asapministries.org/stories/miracle-bible", "gist": "A Karen man in America, Mr. Myaing, lives by God's Word, tithing faithfully and working two jobs to give his six children Christian education. His son's car burns, and the only thing left is his father's slightly burned Bible. Later the Bible is accidentally thrown away, and after he prays to show it to believers overseas, it turns up in a plastic bag on his bedside table.", "lesson": "God honors faithfulness to His Word, who preserves it in remarkable ways.", "themes": "Bible, faithfulness, stewardship, miracles, immigrants", "bible": "Isaiah 40:8, Psalm 119:11", "good": "children's story, sermon, Bible study and Sabbath School", "kids": true, "by": "Julia O'Carey", "src": "ASAP Ministries", "w": 437}, {"t": "Not Just Doors—God Opens Floodgates", "u": "https://www.asapministries.org/stories/not-just-doors—god-opens-floodgates", "gist": "A college student returning from student missions prays for a ministry-minded job and is hired at ASAP. She prays about her thesis topic and a summer overseas, and in a series of connected events she learns of Syrian refugees and plans to collect and publish their stories. She sees each step as an open door that she could not have arranged.", "lesson": "God opens doors one after another when we ask Him to lead.", "themes": "guidance, answered prayer, student missionary, refugees, providence", "bible": "Proverbs 3:5-6, Revelation 3:8", "good": "sermon, youth, prayer meeting", "kids": false, "by": "Hannah Choi", "src": "ASAP Ministries", "w": 565}, {"t": "Praying for Souls", "u": "https://www.asapministries.org/stories/praying-souls", "gist": "A Bible worker meets a poor young woman digging through a dump, who asks what she gets from believing in Jesus. He tells her about salvation and shares his own story of trusting God, and she accepts Jesus. Two months later her husband gets a job and becomes a believer, and the family prepares for baptism.", "lesson": "Jesus offers salvation first, and then provides for our needs.", "themes": "witness, poverty, testimony, provision, prayer", "bible": "Matthew 6:33, John 14:6", "good": "sermon, mission emphasis, testimony", "kids": false, "by": "Chin Saroun", "src": "ASAP Ministries", "w": 480}, {"t": "Ready to Serve the Master", "u": "https://www.asapministries.org/stories/ready-serve-master", "gist": "Soe Soe survives a fall into a well as a boy in Myanmar and decides to serve God. His family flees to a refugee camp, then settles in New York, and with scholarships he attends a small Bible college. He returns on a mission trip to his old camp and plans to serve his people as a pastor.", "lesson": "God preserves our lives for a purpose and prepares refugee youth to serve.", "themes": "calling, refugees, education, perseverance, ministry training", "bible": "Jeremiah 29:11, Isaiah 6:8", "good": "sermon, youth, mission emphasis", "kids": false, "by": "Carol Reynolds", "src": "ASAP Ministries", "w": 817}, {"t": "Restoring Dreams", "u": "https://www.asapministries.org/stories/restoring-dreams", "gist": "Saw See, a young man in Myanmar coughing blood from tuberculosis and addicted to alcohol, is found by medical missionary Nin Si. She arranges for hospital care and rallies church members to give for his food and medicine. After he recovers he is baptized, stops drinking, and begins visiting villagers with her.", "lesson": "One person's compassion can restore a life and start a chain of ministry.", "themes": "compassion, healing, addiction, discipleship, medical missionary", "bible": "James 5:15, Matthew 9:36", "good": "sermon, mission emphasis, health", "kids": false, "by": "Brenda Kis", "src": "ASAP Ministries", "w": 451}, {"t": "RWND Muslim Ministry Update", "u": "https://www.asapministries.org/stories/rwnd-muslim-ministry-update", "gist": "A Houston outreach team to Afghan Muslims prays for someone who speaks Dari and thinks it would take a miracle. Unknown to them, an Afghan family had become Adventist in secret, escaped, and crossed several countries to the U.S. A friend's text reveals they are living in the same apartment complex the team is reaching.", "lesson": "God prepares the answer to our prayers long before we ask.", "themes": "providence, Muslim outreach, refugees, prayer, God's timing", "bible": "Isaiah 65:24, Acts 17:26", "good": "sermon, mission emphasis, prayer meeting", "kids": false, "by": "Pastor Scott Griswold", "src": "ASAP Ministries", "w": 604}, {"t": "The Seven Day Answer", "u": "https://www.asapministries.org/stories/seven-day-answer", "gist": "A Cambodian church planter notices a faithful family missing and finds them in a shack by the roadside after being ordered off public land. He asks his church small groups to pray every morning and evening at seven. On the seventh day, the father arrives smiling because a church member has given a plot of land with fruit trees.", "lesson": "Prayer and the generosity of fellow believers meet urgent needs.", "themes": "answered prayer, generosity, united prayer, church family, provision", "bible": "Matthew 18:19, Acts 4:34", "good": "sermon, prayer meeting, mission emphasis", "kids": false, "by": "ASAP Ministries", "src": "ASAP Ministries", "w": 282}, {"t": "Soe Finds His Calling", "u": "https://www.asapministries.org/stories/soe-finds-his-calling", "gist": "Soe was raised in a refugee camp, then in Dallas, where he was bullied at school and planned to become a nurse for the money. Through a refugee training program he feels called to pastoral work, and he prays about each year's tuition and sees it provided. He graduates with a theology degree to serve Karen people around the world.", "lesson": "God redirects ambition toward calling and provides year by year.", "themes": "calling, refugees, provision, ministry training, perseverance", "bible": "Proverbs 16:9, Philippians 4:19", "good": "sermon, youth, mission emphasis", "kids": false, "by": "Carol Reynolds", "src": "ASAP Ministries", "w": 565}, {"t": "Standing Tall for Jesus", "u": "https://www.asapministries.org/stories/standing-tall-jesus", "gist": "A church planter offers a DVD to Grandma Bao, a stooped older woman at a market, and visits her home. She slowly opens to Jesus and, taking the words that nothing is too hard for Him literally, prays for her bent back. Two months later she runs to meet them with a straight back, and her sister and nephew also commit to Christ and burn their ancestor altars.", "lesson": "Nothing is too hard for the Lord, and healing opens the door to faith.", "themes": "healing, miracles, friendship evangelism, ancestor worship, faith", "bible": "Luke 13:11-13, Jeremiah 32:27", "good": "sermon, mission emphasis, testimony", "kids": false, "by": "Julia O'Carey, from an interview with a church planter couple", "src": "ASAP Ministries", "w": 792}, {"t": "Struggling With Clinical Depression", "u": "https://www.asapministries.org/stories/struggling-clinical-depression", "gist": "A woman with clinical depression, so low that she wished not to wake up, suddenly wakes one morning with clear thoughts and a way forward. She tells her friends that someone must be praying for her. Then ASAP's email arrives saying that they had been praying, and she is overjoyed to be able to prove it, though she still faces great challenges.", "lesson": "Intercessory prayer reaches people we cannot see, in their darkest moments.", "themes": "intercession, depression, prayer, encouragement, hope", "bible": "James 5:16, Romans 8:26", "good": "sermon, prayer meeting, special services", "kids": false, "by": "Beverley Manners", "src": "ASAP Ministries", "w": 310}, {"t": "Syrian Refugees Find Hope at ALC", "u": "https://www.asapministries.org/stories/syrian-refugees-find-hope-alc", "gist": "Renas, a Syrian refugee in Lebanon, is sick, hungry, and unable to work, and cries out to God. He sees angels and hears a promise that he will not be alone, then finds help at an Adventist school for refugee children, where he is healed of a terminal lung disease. He becomes a Kurdish pioneer, teaches online Bible studies, and his wife is a Bible worker.", "lesson": "God reaches the desperate and turns refugees into witnesses.", "themes": "refugees, healing, angels, conversion, Muslim background", "bible": "Isaiah 41:10, Psalm 34:4", "good": "sermon, mission emphasis, prayer meeting", "kids": false, "by": "Laura Hokanson", "src": "ASAP Ministries", "w": 485}, {"t": "Victory of the Gospel", "u": "https://www.asapministries.org/stories/victory-gospel", "gist": "A Wisconsin church planting coordinator visits believers in a communist country and meets a pastor who was imprisoned three times, once for four and a half years. After prison he added the words 'Victory of the Gospel' to his name, and people mocked him. Those who laughed have since died or become Christians, and he is one of the country's top soul-winners.", "lesson": "Faithfulness under persecution eventually wins even the mockers.", "themes": "persecution, perseverance, witness, courage, victory", "bible": "Romans 8:37, 2 Timothy 4:7", "good": "sermon, mission emphasis, prayer meeting", "kids": false, "by": "Lisa Isensee", "src": "ASAP Ministries", "w": 516}, {"t": "The YouTube Miracle", "u": "https://www.asapministries.org/stories/youtube-miracle", "gist": "A new believer in a closed country is called at night because his aunt is raving about someone walking around the house. With no experience in prayer, he searches YouTube for how Christians pray, gathers relatives, and prays in Jesus' name. His aunt is freed within minutes, and he commits his life to Jesus.", "lesson": "Even a mustard-seed prayer of a new believer brings God's power.", "themes": "spiritual warfare, deliverance, new believers, prayer, faith", "bible": "Matthew 17:20, Luke 10:19", "good": "sermon, prayer meeting, mission emphasis", "kids": false, "by": "Nelson (pseudonym), as told to Julia O'Carey", "src": "ASAP Ministries", "w": 480}, {"t": "Charcoal and a Prayer", "u": "https://www.asapministries.org/stories/charcoal-and-prayer", "gist": "Deborah, a medical missionary, is called when a neighbor named Simeon drinks poison. She prays, then gives him charcoal powder mixed with water in repeated doses until he vomits and recovers within hours. The family argues about a five-hour trip to the hospital, but he goes anyway for observation. The doctor finds no treatment is needed.", "lesson": "God works through simple means and faithful prayer.", "themes": "prayer, healing, medical missionary, faith, simple remedies", "bible": "Psalm 103:3, Jeremiah 8:22", "good": "sermon, prayer meeting, health", "kids": false, "by": "Clarissa Fiedler", "src": "ASAP Ministries", "w": 465}, {"t": "Clothed with Compassion", "u": "https://www.asapministries.org/stories/clothed-compassion", "gist": "Sok Chea and his seven siblings are cast off by their father and struggle in Phnom Penh, so he cannot attend school until an ASAP-supported Adventist school takes him in at age nine. During the pandemic his sister's market sales collapse and he nearly drops out. He prays alone day and night, customers return to his sister's stall, and he is able to finish school. He now asks prayer to continue his Christian education.", "lesson": "God hears the prayers of a child and uses Christian teachers to draw young people to Him.", "themes": "orphans, Christian education, poverty, prayer, Cambodia", "bible": "Matthew 10:29-31, Colossians 3:12", "good": "sermon, children's story, mission emphasis", "kids": true, "by": "Julia O'Carey and John Press", "src": "ASAP Ministries", "w": 826}, {"t": "Did an Angel Make them Sick?", "u": "https://www.asapministries.org/stories/did-angel-make-them-sick", "gist": "Two sisters tell their teacher in Cambodia they must quit school because their parents are taking them to Thailand to wash dishes. The teacher and girls pray, and he keeps praying all year. The day before school starts, the sisters appear at the market and say they were so sick in Thailand that they could not work, so their parents sent them back. They have been healthy ever since.", "lesson": "Persistent prayer for children is answered in surprising ways.", "themes": "answered prayer, children, education, perseverance, Cambodia", "bible": "Luke 18:1, Psalm 127:3", "good": "sermon, children's story, prayer meeting", "kids": true, "by": "Julie Griswold", "src": "ASAP Ministries", "w": 354}, {"t": "A Divine Reunion", "u": "https://www.asapministries.org/stories/divine-reunion", "gist": "A former Bible worker reconnects online with Binh, a woman she studied with in Australia ten years earlier. Binh had drifted from faith under family pressure and been through divorce and loneliness. They resume Bible studies by video, and Binh is connected with a home church in her closed country and plans to be baptized. Both marvel that God joined them again at Binh's lowest point.", "lesson": "God brings people back together at the moment they most need hope.", "themes": "friendship, Bible study, closed country, restoration, perseverance", "bible": "Isaiah 55:11, Psalm 34:18", "good": "sermon, evangelism and outreach, mission emphasis", "kids": false, "by": "Lindsey Mills", "src": "ASAP Ministries", "w": 453}, {"t": "The French Fry Beetles", "u": "https://www.asapministries.org/stories/french-fry-beetles", "gist": "Visitors to an ASAP school in Cambodia meet the Rueb family in a tiny bamboo shack, where the father wades through rivers at dawn to catch beetles that the mother fries and sells. Their daughter Sor, a fourth grader, once suffered from diabetes and the church prayed for her. She was healed and now avoids unhealthy foods. The parents sacrifice daily so their children can have a Christian education.", "lesson": "Humble families sacrifice greatly so their children may know Jesus.", "themes": "sacrifice, healing, Christian education, poverty, Cambodia", "bible": "James 5:14-15, Proverbs 22:6", "good": "sermon, children's story, mission emphasis", "kids": true, "by": "Ruth Bradburn", "src": "ASAP Ministries", "w": 599}, {"t": "God Had Answered Her Prayer", "u": "https://www.asapministries.org/stories/god-had-answered-her-prayer", "gist": "A sick, homeless Cambodian mother selling water greens meets a Christian woman who prays that God will provide food for her and her son. Soon after, she finds a plentiful harvest of greens no one else had picked. She goes back to the woman, accepts Jesus, and later finds shelter at the Sda Center. She thanks God for food, a home, and a new life.", "lesson": "God answers even a first, simple prayer and draws the hurting to Himself.", "themes": "answered prayer, conversion, poverty, provision, testimony", "bible": "Philippians 4:19, Psalm 34:4", "good": "sermon, testimony, prayer meeting", "kids": false, "by": "Chhoem Sarom", "src": "ASAP Ministries", "w": 505}, {"t": "God's Amazing Timing", "u": "https://www.asapministries.org/stories/gods-amazing-timing", "gist": "A man sells an old duck stamp print on eBay in January and receives $2,500, far more than he paid. That same week the ASAP gift catalog arrives, and one gift, a road in Nakhai for farmers, costs exactly $2,500. He sees the match as no coincidence and gives the money.", "lesson": "God's timing and provision invite us to be His instruments.", "themes": "generosity, God's timing, stewardship, providence", "bible": "Proverbs 3:9, 2 Corinthians 9:7", "good": "sermon, stewardship, mission emphasis", "kids": false, "by": "Harlin Carey", "src": "ASAP Ministries", "w": 253}, {"t": "The Holy Spirit Prepares the Way", "u": "https://www.asapministries.org/stories/holy-spirit-prepares-way", "gist": "A Karen pastor from the U.S. returns after 22 years to a remote village where he had planted seeds of truth as a student. The villagers welcome him, ask about the Sabbath, and about thirty adults decide to become Adventists. One villager had already kept the Sabbath for years after listening to Adventist World Radio. The young people on the trip are inspired to be missionaries.", "lesson": "The Holy Spirit prepares hearts long before the messenger arrives.", "themes": "seed sowing, Sabbath, Karen people, short-term mission, Holy Spirit", "bible": "Ecclesiastes 11:1, 1 Corinthians 3:6", "good": "sermon, mission emphasis, youth", "kids": false, "by": "Carol Reynolds", "src": "ASAP Ministries", "w": 565}, {"t": "I'll Never Look Back", "u": "https://www.asapministries.org/stories/ill-never-look-back", "gist": "After losing 25 family members in the war, Hang Dara flees to a Thai refugee camp, studies nursing, finds Jesus, and plants churches. Later he takes a United Nations job, and Judy Aitken and a friend travel a dangerous road after praying to find him. She asks whether his contract with humans matters more than his promise to God. He returns to ministry and later helps start a school for children from the garbage-dump slums.", "lesson": "Keep your promise to God, and He will use you to bless many others.", "themes": "calling, refugees, faithfulness, church planting, mentoring", "bible": "Luke 9:62, Isaiah 6:8", "good": "sermon, calling and education, mission emphasis", "kids": false, "by": "Hang Dara, as told to Julia O'Carey", "src": "ASAP Ministries", "w": 956}, {"t": "A Life-Changing Invitation", "u": "https://www.asapministries.org/stories/life-changing-invitation", "gist": "As newlyweds longing to be missionaries, the Griswolds meet Judy Aitken, who tells them about Cambodian refugees. Two months later she asks them to go to the Thai refugee camps, and within three months they are there, later moving to Phnom Penh to plant churches. Judy keeps encouraging them for decades, and later her faith also opens the way for their Houston ministry. They call it a ripple effect of one transformed life touching another.", "lesson": "One invitation from a faithful servant can change the course of many lives.", "themes": "calling, mentoring, missions, legacy, faith", "bible": "Isaiah 6:8, 2 Timothy 2:2", "good": "sermon, mission emphasis, calling and education", "kids": false, "by": "Scott and Julie Griswold", "src": "ASAP Ministries", "w": 713}, {"t": "From Marginalized to Missionary", "u": "https://www.asapministries.org/stories/marginalized-missionary", "gist": "James, a boy orphaned in Myanmar's Golden Triangle, falls into stealing and is rejected by everyone. A medical missionary named Ko Ko and his wife adopt him despite their own struggles and keep praying and correcting him. James is trained in medical missionary work, treats a hopeless patient, and befriends a Buddhist monk, sharing the gospel with him. He now leads a Bible study and trains as a medical missionary.", "lesson": "God turns the rejected into His messengers when someone refuses to give up on them.", "themes": "redemption, adoption, medical missionary, second chance, Myanmar", "bible": "1 Corinthians 1:27, Luke 15:20", "good": "sermon, mission emphasis, youth", "kids": false, "by": "Julia O'Carey with John Press", "src": "ASAP Ministries", "w": 1171}, {"t": "Missions of Mercy", "u": "https://www.asapministries.org/stories/missions-mercy", "gist": "A missionary meets Chan Thorn, a nineteen-year-old in great pain who cannot afford a $500 surgery. The missionary prays with her and offers natural remedies. Within a week she is healed, starts Bible studies, and is later baptized.", "lesson": "Prayer and simple care open hearts to the Great Healer.", "themes": "healing, prayer, door-to-door ministry, baptism, mercy", "bible": "James 5:15, Psalm 147:3", "good": "prayer meeting, sermon, health", "kids": false, "by": "ASAP Ministries", "src": "ASAP Ministries", "w": 159}, {"t": "The Mushroom Pastor", "u": "https://www.asapministries.org/stories/mushroom-pastor", "gist": "On a first ASAP trip to Thailand, a doctor visits a market and hears of the Mushroom Pastor, Pastor Ruangwit, who grows and sells mushrooms to befriend local Buddhists. Visiting his church plant on Sabbath, he sees a market vendor attending for the third time and learns four people were recently baptized. The writer is moved by the pastor's passion for lost people.", "lesson": "Creative, everyday friendship can become a bridge to the gospel.", "themes": "creative evangelism, friendship, buddhists, church planting, Thailand", "bible": "1 Corinthians 9:22, Matthew 4:19", "good": "sermon, mission emphasis, evangelism and outreach", "kids": false, "by": "Dr. Tom Evans", "src": "ASAP Ministries", "w": 763}, {"t": "A New Husband for Leah", "u": "https://www.asapministries.org/stories/new-husband-leah", "gist": "Leah, an ASAP teacher in Myanmar, is about to divorce her violent, drug-addicted husband when she is moved at a training to forgive him. He rips up her notes, but she keeps praying, and after a village chief rebukes him he gradually abandons betel nut, smoking, and alcohol. He starts leading worship and helping others. Leah says her old husband was like Saul, and now he is like Paul.", "lesson": "Persevering prayer and forgiveness can transform even the hardest hearts.", "themes": "forgiveness, marriage, addiction, persistent prayer, transformation", "bible": "Acts 9:15, Colossians 3:13", "good": "sermon, family and women, prayer meeting", "kids": false, "by": "Brenda Kis", "src": "ASAP Ministries", "w": 616}, {"t": "Overcoming Evil With Good", "u": "https://www.asapministries.org/stories/overcoming-evil-good", "gist": "Thomas Xay's church is demolished and he is jailed with other leaders in a closed Southeast Asian country, but he keeps praying. After missionary training he invites the village chief to worship and lunch and teaches massage and Bible reading to the villagers. He later prays for a speechless sick woman in a hospital, and she recovers within two hours.", "lesson": "Kindness and faithful prayer can overcome persecution.", "themes": "persecution, kindness, healing, perseverance, witness", "bible": "Romans 12:21, Acts 16:25", "good": "sermon, mission emphasis, prayer meeting", "kids": false, "by": "Brenda Kis", "src": "ASAP Ministries", "w": 472}, {"t": "The Power of Healing Prayer", "u": "https://www.asapministries.org/stories/power-healing-prayer", "gist": "Church planter Mathias Srimoon shares Jesus with his family, though his father later loses his mind and injures Mathias' daughter. Mathias stays steady and befriends neighbors; a sick girl is healed after he prays, a song leader's pain ceases, and a long-childless relative has a baby. The astonished villagers come to believe, and seven were recently baptized.", "lesson": "Friendship and prayer show villagers a God of power.", "themes": "healing, prayer, church planting, trusting God, perseverance", "bible": "James 5:16, Mark 16:18", "good": "sermon, prayer meeting, mission emphasis", "kids": false, "by": "Brenda Kis", "src": "ASAP Ministries", "w": 455}, {"t": "Prayer Did It", "u": "https://www.asapministries.org/stories/prayer-did-it", "gist": "Chai Worra in Laos prays for a chance to share Jesus with a non-Christian friend who asks for help hauling firewood. On the way back the truck dies and cannot be fixed. When the friend dares him to see if his God can help, Chai prays, turns the key, and the engine starts. His friend is amazed and wants to learn more about God.", "lesson": "A simple prayer for opportunity can become a doorway to a friend's heart.", "themes": "prayer, evangelism, friendship, miracles, Laos", "bible": "Colossians 4:3, Jeremiah 33:3", "good": "sermon, children's story, evangelism and outreach", "kids": true, "by": "Brenda Kis", "src": "ASAP Ministries", "w": 431}, {"t": "Quarters for Secret DVDs", "u": "https://www.asapministries.org/stories/quarters-secret-dvds", "gist": "At a Wisconsin camp meeting, a pastor tells children a mission story and says one quarter prints a secret sermon DVD for a closed country. A girl named Maddy immediately gives two quarters, and other children follow, earning more coins during the week. By Sabbath about two dozen children come forward, and the total reaches $50.50, enough for 202 DVDs.", "lesson": "Even a child's small gift can start a movement of generosity.", "themes": "children, generosity, missions, camp meeting", "bible": "Mark 12:43-44, 2 Corinthians 9:7", "good": "children's story, mission emphasis, stewardship", "kids": true, "by": "Lisa Isensee", "src": "ASAP Ministries", "w": 442}, {"t": "A Real God Answers", "u": "https://www.asapministries.org/stories/real-god-answers", "gist": "On Pchum Ben, the Khmer Festival of the Dead, a Christian mother has only 25 cents and no rice for her four hungry children. Once an ancestor-worshipper, she prays to the real God for mercy. Right after, three young men from the church arrive, each giving her money to buy rice.", "lesson": "The true God answers the cry of the helpless.", "themes": "answered prayer, provision, conversion, poverty, Cambodia", "bible": "Philippians 4:19, Psalm 34:6", "good": "sermon, testimony, prayer meeting", "kids": false, "by": "Thenly", "src": "ASAP Ministries", "w": 354}, {"t": "Tia's Tears and Transformation", "u": "https://www.asapministries.org/stories/tias-tears-and-transformation", "gist": "A church planter in a closed country finishes the prodigal son story, and 62-year-old Tia says she is that prodigal. Ashamed of her alcohol addiction, she gives her life back to Jesus as the group prays. After studying the Bible by phone she is freed from addiction, finds a job with Sabbaths off, and shares her faith in the house church.", "lesson": "The Father always welcomes back prodigal sons and daughters.", "themes": "addiction, prodigal son, restoration, Bible study, new life", "bible": "Luke 15:20, 2 Corinthians 5:17", "good": "sermon, health, mission emphasis", "kids": false, "by": "Julia O'Carey (from an interview with Tony*)", "src": "ASAP Ministries", "w": 540}, {"t": "A Very Big Church Family", "u": "https://www.asapministries.org/stories/very-big-church-family", "gist": "Lynetta, a Cambodian genocide survivor and single mother in Rosharon, Texas, joins the Adventist church after volunteers study the Bible with her. She offers her workshop for the little church group but there is no bathroom. A church in Conroe holds a weekend fundraiser, contractors and pastors from Michigan volunteer, and a bathroom is built. Lynetta realizes she has a very big church family.", "lesson": "The church is a worldwide family that cares for its members.", "themes": "church family, hospitality, refugees, generosity, community", "bible": "Ephesians 2:19, Galatians 6:10", "good": "sermon, mission emphasis", "kids": false, "by": "Pastor Scott Griswold", "src": "ASAP Ministries", "w": 975}, {"t": "When No Said \"Yes\"", "u": "https://www.asapministries.org/stories/when-no-said-yes", "gist": "No is the only person in his village to accept the Adventist message, and his family, police, and neighbors persecute him, beat him, and drive him out. He and his church family keep praying, and gradually his wife, parents, brothers, and others believe. A group of twenty-five Adventists now witnesses in the once hostile village.", "lesson": "Faithful prayer under persecution can turn a village toward God.", "themes": "persecution, prayer, family, perseverance, closed country", "bible": "Acts 5:41, Matthew 5:44", "good": "sermon, mission emphasis, prayer meeting", "kids": false, "by": "Brenda Kis", "src": "ASAP Ministries", "w": 358}, {"t": "The Biggest God", "u": "https://www.asapministries.org/stories/biggest-god", "gist": "After Hurricane Harvey, a mission-training team helps Cambodian and Laotian families muck out flooded homes in a village near Houston. Students befriend a Laotian couple living in a tent and begin Bible studies with them. When the husband asks why he still suffers, the group points to Jesus' words about the man born blind. When the wife learns that God created the angels she had also prayed to, she realizes how big He is.", "lesson": "Serving a neighbor's practical needs opens hearts to learn how great God is.", "themes": "service, refugees, hurricane relief, discovering God, friendship", "bible": "John 9:1-3, Psalm 95:3", "good": "sermon, mission emphasis, Bible study and Sabbath School", "kids": false, "by": "Pastor Scott Griswold", "src": "ASAP Ministries", "w": 998}, {"t": "Chomnath's Testimony", "u": "https://www.asapministries.org/stories/chomnaths-testimony", "gist": "A Cambodian woman survives the Pol Pot years, losing her father and brothers while quietly helping others stay alive. She reaches America with a great sense of emptiness, working three jobs and sending money home. A dream of the Lord and a film about Jesus lead her to study the Bible and join an Adventist church. She is baptized and later helps plant a church in Cambodia.", "lesson": "God reveals Himself to the suffering and turns lives of loss into witness.", "themes": "survival, conversion, refugees, dreams, persistent prayer", "bible": "Luke 10:22, Psalm 34:18", "good": "sermon, testimony, mission emphasis", "kids": false, "by": "Chomnath Long", "src": "ASAP Ministries", "w": 1874}, {"t": "Conquering Dragons", "u": "https://www.asapministries.org/stories/conquering-dragons", "gist": "A mother in Cambodia wakes to find her little boy burning with fever. She remembers the Bible story of the woman healed by Jesus and prays simply, and by morning he is well. Later she asks God for just enough recyclables to buy rice that day. Near the end of her search she finds a bag of wedding cards with the exact amount inside.", "lesson": "God hears small, daily prayers of the poor.", "themes": "answered prayer, healing, provision, poverty, faith", "bible": "Philippians 4:19, Mark 5:34", "good": "sermon, prayer meeting, children's story", "kids": true, "by": "ASAP Ministries", "src": "ASAP Ministries", "w": 288}, {"t": "A Double Answer, A Sign from God", "u": "https://www.asapministries.org/stories/double-answer-sign-god", "gist": "A young couple in a closed country begin to wonder whether the seventh day is the true Sabbath. At the same time the wife is paralyzed after childbirth and cannot nurse. Her church fasts and prays for them, asking God for guidance about the Sabbath as well. On the third day she walks again and her milk returns, and the whole church takes it as a sign and accepts the Sabbath.", "lesson": "God answers sincere seekers and confirms His truth in ways they can understand.", "themes": "Sabbath, seeking truth, healing, persecuted church, fasting", "bible": "Psalm 119:105, Isaiah 58:13", "good": "special services, prayer meeting, mission emphasis", "kids": false, "by": "Julia O'Carey", "src": "ASAP Ministries", "w": 467}, {"t": "Esther's Discipleship Paradigm", "u": "https://www.asapministries.org/stories/esthers-discipleship-paradigm", "gist": "As her dying father urges her to keep faith, Esther in a closed country decides to commit to the Lord. An ASAP Bible worker, Sister Lydia, patiently trains her to study, memorize and share the gospel safely. Esther later befriends a teenage girl who keeps listening to Bible stories despite abuse at home. That girl is now safe, married and leading her own Bible study under Esther's guidance.", "lesson": "Discipleship passes faith from one believer to the next.", "themes": "discipleship, mentoring, persecution, family, evangelism", "bible": "2 Timothy 2:2, Matthew 28:19-20", "good": "sermon, Bible study and Sabbath School, mission emphasis", "kids": false, "by": "Laura Hokanson", "src": "ASAP Ministries", "w": 509}, {"t": "An F-150 and a Thunderstorm", "u": "https://www.asapministries.org/stories/f-150-and-thunderstorm", "gist": "On a seven-state awareness tour, an ASAP team's van breaks down in Kansas heat and a Catholic couple, Leon and Mary, rescue them. The couple lend the team their pickup for the whole trip. When asked how the team could pray for them, Leon asks for rain for local farmers. The team prays, and the weather changes the next day; at supper the couple gives a gift to the mission.", "lesson": "God uses kindness between strangers and answers prayer for others.", "themes": "kindness, answered prayer, hospitality, trusting God, strangers", "bible": "Hebrews 13:2, James 5:17-18", "good": "sermon, prayer meeting, children's story", "kids": true, "by": "Lisa Isensee", "src": "ASAP Ministries", "w": 504}, {"t": "God Healed Mrs. Sok Ran!", "u": "https://www.asapministries.org/stories/god-healed-mrs-sok-ran", "gist": "A Cambodian medical missionary, discouraged by mockery, treats Mrs. Sok Ran, who has numb, swollen le
