<style>
/* Layout: Sabbath School–app style. Quiet page, shelves of tall covers that slide sideways, a story page colored from its cover. Phone = bottom bar; PC = top bar, wider shelves, two-column story page. */
:root{
  --peek:#e8ebf7;
  --bg:#f6f6fa; --surface:#ffffff; --ink:#1d1f26; --muted:#62677a; --line:#e3e4ec; --link:#3b5aa8;
  --shadow:0 6px 16px rgba(30,32,60,.16),0 1px 3px rgba(30,32,60,.12);
  --f-body:"Lato",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-cover:"Oswald","Arial Narrow",Impact,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--peek:#2c3040;--bg:#15161c;--surface:#1e2028;--ink:#eceef5;--muted:#9da2b4;--line:#2c2f3a;--link:#8fa8ec;--shadow:0 6px 18px rgba(0,0,0,.5),0 1px 3px rgba(0,0,0,.4);color-scheme:dark}}
:root[data-theme="dark"]{--peek:#2c3040;--bg:#15161c;--surface:#1e2028;--ink:#eceef5;--muted:#9da2b4;--line:#2c2f3a;--link:#8fa8ec;--shadow:0 6px 18px rgba(0,0,0,.5),0 1px 3px rgba(0,0,0,.4);color-scheme:dark}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
a{color:inherit}
:focus-visible{outline:2px solid var(--link);outline-offset:2px;border-radius:4px}
.wrap{max-width:1240px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
.top .wrap{display:flex;align-items:center;gap:14px;min-height:64px}
.back{width:40px;height:40px;display:grid;place-items:center;border-radius:50%;margin-left:-8px}
.back svg{width:24px;height:24px}
.top h1{font-size:26px;font-weight:700;margin:0;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pcnav{display:none;gap:4px}
.pcnav button{padding:8px 14px;border-radius:999px;font-weight:700;color:var(--muted)}
.pcnav button[aria-current="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.find{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:0 14px;height:40px;width:min(320px,100%)}
.find svg{width:18px;height:18px;color:var(--muted);flex:none}
.find input{border:0;background:none;outline:none;font:inherit;color:var(--ink);width:100%;min-width:0}
.tophead{display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding-bottom:6px}
.tophead .find{width:100%}

/* shelves */
main{padding-bottom:110px}
.shelf{margin-top:26px}
.shelf-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.shelf-h h2{margin:0;font-size:15px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.seeall{color:var(--link);font-size:17px;display:flex;align-items:center;gap:4px;padding:6px 0}
.seeall svg{width:16px;height:16px}
.row{display:flex;gap:18px;overflow-x:auto;scroll-snap-type:x mandatory;padding:14px 16px 18px;margin:0 -16px;scrollbar-width:none}
.row::-webkit-scrollbar{display:none}
.item{flex:none;width:clamp(132px,36vw,168px);scroll-snap-align:start;text-align:left;display:flex;flex-direction:column;gap:12px}
.item .nm{font-size:17px;font-weight:700;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.item .meta{font-size:13px;color:var(--muted);margin-top:-6px}
.shelf-note{font-size:14px;color:var(--muted);margin:2px 0 0}

/* covers: our own design, one look per source */
.cover{position:relative;aspect-ratio:2/3;width:100%;max-width:100%;border-radius:8px;overflow:hidden;box-shadow:var(--shadow);color:#fff;
  background:linear-gradient(160deg,var(--c1),var(--c2));transition:transform .25s ease}
.cover::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(115deg,rgba(255,255,255,.05) 0 2px,transparent 2px 7px)}
.cover .src{position:absolute;top:10px;left:10px;right:10px;display:flex;align-items:center;gap:6px;font:700 9px/1.2 var(--f-body);letter-spacing:.08em;text-transform:uppercase;opacity:.92}
.cover .src i{width:16px;height:16px;border-radius:4px;background:rgba(255,255,255,.22);display:grid;place-items:center;font-style:normal;font-size:10px}
.cover .ttl{position:absolute;left:10px;right:10px;top:34%;font-family:var(--f-cover);font-weight:700;text-transform:uppercase;line-height:1.02;letter-spacing:.01em;font-size:clamp(17px,5.2cqw,22px);text-wrap:balance;color:var(--hi);text-shadow:0 2px 0 rgba(0,0,0,.18)}
.cover .ttl b{display:block;color:#fff;font-weight:700}
.cover .foot{position:absolute;left:10px;right:10px;bottom:10px;display:flex;justify-content:space-between;align-items:center;font:700 10px/1 var(--f-body);opacity:.9}
.cover .dot{width:8px;height:8px;border-radius:50%;background:var(--hi);display:inline-block;margin-right:5px}
.cover{container-type:inline-size}
.cover .mark{position:absolute;right:-18%;bottom:12%;width:70%;aspect-ratio:1;border-radius:50%;border:2px solid rgba(255,255,255,.14)}
.cover .mark::after{content:"";position:absolute;inset:16%;border-radius:50%;border:2px solid rgba(255,255,255,.10)}
@media (hover:hover){.item:hover .cover{transform:translateY(-3px)}}

.k-mission{--c1:#1f5f6e;--c2:#123c48;--hi:#f2c46b}
.k-guide{--c1:#c45a3c;--c2:#8e3424;--hi:#ffe1a6}
.k-iiw{--c1:#2b3f7a;--c2:#18244d;--hi:#e9c46a}
.k-moment{--c1:#6b2f6e;--c2:#401a45;--hi:#f5b8d0}
.k-mission.v1{--c1:#2a6b55;--c2:#163f33}.k-mission.v2{--c1:#2b5878;--c2:#16344c}
.k-guide.v1{--c1:#cf7a2e;--c2:#93501a}.k-guide.v2{--c1:#b8455a;--c2:#7d2637}
.k-iiw.v1{--c1:#3a4f8a;--c2:#1f2c58}.k-iiw.v2{--c1:#24526e;--c2:#122f43}
.k-moment.v1{--c1:#5a3a7d;--c2:#33204d}.k-moment.v2{--c1:#7a3157;--c2:#4a1b35}

/* see-all list (like the Keys Series screen) */
.list{display:flex;flex-direction:column;gap:22px;margin-top:10px}
.lrow{display:flex;align-items:flex-start;gap:18px;text-align:left;width:100%}
.lrow .tx{padding-top:2px}
.lrow .point{border-left:3px solid var(--line);padding-left:10px;margin-top:2px}
/* phone: summary bar above the bottom tabs for the book you're on */
.peek{position:fixed;left:0;right:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);box-shadow:0 -6px 16px rgba(20,22,40,.10);
  padding:12px max(16px,env(safe-area-inset-right,0px)) 12px max(16px,env(safe-area-inset-left,0px))}
.peek button{display:flex;flex-direction:column;gap:4px;text-align:left;width:100%}
.peek .pk-t{font-weight:900;font-size:16px;display:flex;justify-content:space-between;gap:10px}
.peek .pk-t small{font-weight:700;color:var(--muted);font-size:13px;white-space:nowrap}
.peek .pk-s,.peek .pk-p{font-size:14px;line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.peek .pk-p{color:var(--muted)}.peek .pk-p b{color:var(--ink)}
/* bar follows the site theme: a soft lighter tint in light mode, a lifted gray in dark mode */
.peek{background:var(--peek);border-top:1px solid var(--line)}
.peek .pk-p b{color:var(--link)}
/* phone: the middle book is the raised one, so shelves snap books to the center */
@media (max-width:899px){.item{scroll-snap-align:center}}
body.peeking main{padding-bottom:260px}
/* two bar choices to compare: "fades away" shows while you move, then hides after 2.5 s; "small" stays but is title + one line */
.peek{transition:opacity .45s ease,transform .45s ease}
body.bar-fade .peek:not(.on){opacity:0;transform:translateY(14px);pointer-events:none}
body.bar-small .peek{padding-block:9px}
body.bar-small .peek .pk-p{display:none}
body.bar-small .peek .pk-s{-webkit-line-clamp:1;color:var(--muted)}
body.peeking.bar-small main{padding-bottom:170px}
.vlab{align-self:center;padding:0 6px 0 10px;font-size:14px;color:var(--muted);font-weight:700}
.vsw.phoneonly{margin-left:6px}
@media (min-width:900px){.phoneonly{display:none!important}}
.item .cover{transition:transform .25s ease,box-shadow .25s ease}
.item.cur .cover{transform:translateY(-10px);box-shadow:0 16px 28px rgba(30,32,60,.28),0 2px 4px rgba(30,32,60,.14)}
.item.cur .nm{color:var(--link)}
@media (min-width:900px){.peek{display:none!important}body.peeking main{padding-bottom:60px}.item.cur .cover{transform:none}.item.cur .nm{color:inherit}}
.lrow .cover{width:112px;flex:none}
.lrow .tx{min-width:0;display:flex;flex-direction:column;gap:6px}
.lrow .nm{font-size:22px;font-weight:700;line-height:1.2}
.lrow .meta{font-size:14px;color:var(--muted)}
.lrow .sum{font-size:15px;color:var(--ink);line-height:1.45}
.lrow .point{font-size:14px;color:var(--muted);line-height:1.4}
.lrow .point b{color:var(--ink);font-weight:700}
.lrow .cover{width:76px;border-radius:6px}
/* list thumbnails: same cover, lettering scaled down so long words fit inside the small book */
.lrow .cover .ttl{font-size:11px;left:7px;right:7px;top:30%;line-height:1.05;letter-spacing:0}
.lrow .cover .src{top:7px;left:7px;font-size:0}
.lrow .cover .src i{width:13px;height:13px;font-size:8px}
.lrow .cover .foot{display:none}
.cover .ttl{overflow-wrap:break-word}
.lrow .nm{font-size:20px}
.catbar{position:sticky;top:calc(64px + env(safe-area-inset-top,0px));z-index:4;display:flex;align-items:center;gap:4px;margin:14px -16px 6px;padding:8px 8px;background:var(--bg);border-bottom:1px solid var(--line)}
.cats{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;flex:1;min-width:0;scroll-behavior:smooth}
.cats::-webkit-scrollbar{display:none}
.cats button{flex:none;padding:8px 14px;border-radius:999px;font-weight:700;font-size:15px;color:var(--muted);border:1px solid var(--line);background:var(--surface)}
.cats button[aria-selected="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.cstep{flex:none;width:36px;height:36px;border-radius:50%;font-size:26px;line-height:1;color:var(--ink);display:grid;place-items:center}
@media (min-width:900px){.catbar{margin-inline:0;top:64px}}
.vsw{display:inline-flex;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px;margin-top:8px}
.vsw button{padding:6px 18px;border-radius:999px;font-size:15px;font-weight:700;color:var(--muted)}
.vsw button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.listgrid{display:contents}

/* story page */
.hero{background:linear-gradient(180deg,var(--c1),var(--c2));color:#fff;position:relative}
.hero .wrap{display:flex;flex-direction:column;align-items:center;text-align:center;padding-block:14px 26px;gap:14px}
.hero .bar{width:100%;display:flex;justify-content:space-between}
.hero .circ{width:46px;height:46px;border-radius:50%;background:rgba(0,0,0,.18);display:grid;place-items:center;color:#fff}
.hero .circ svg{width:24px;height:24px}
.hero .circ[aria-pressed="true"]{background:#fff;color:var(--c2)}
.hero .cover{width:min(190px,48vw);box-shadow:0 14px 30px rgba(0,0,0,.35)}
.hero h1{font-size:clamp(28px,7vw,40px);line-height:1.1;margin:6px 0 0;font-weight:900;text-wrap:balance}
.hero .sub{opacity:.85;font-size:17px}
.readbtn{display:inline-flex;align-items:center;justify-content:center;min-width:200px;min-height:52px;padding:0 28px;border-radius:999px;background:rgba(0,0,0,.22);color:#fff;font-weight:900;font-size:18px;letter-spacing:.06em;text-decoration:none;text-transform:uppercase}
.readbtn:hover{background:rgba(0,0,0,.32)}
.hero .gist{max-width:62ch;text-align:left;font-size:17px;line-height:1.5;margin:0}
.hero .gist button{color:#fff;text-decoration:underline;font-style:italic;opacity:.9}
.facts{background:var(--bg)}
.fact{display:flex;gap:18px;padding:18px 0;border-bottom:1px solid var(--line);align-items:flex-start}
.fact .lab{width:96px;flex:none;color:var(--muted);font-size:14px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;padding-top:3px}
.fact .val{font-size:18px;line-height:1.45;min-width:0}
.tags{display:flex;flex-wrap:wrap;gap:8px}
.tags span{background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:4px 12px;font-size:15px}
.full{border-bottom:1px solid var(--line)}
.full summary{list-style:none;cursor:pointer;display:flex;justify-content:space-between;align-items:center;padding:20px 0;font-size:19px;font-weight:900;color:var(--link)}
.full summary::-webkit-details-marker{display:none}
.full summary::after{content:"";width:10px;height:10px;border-right:2.5px solid currentColor;border-bottom:2.5px solid currentColor;transform:rotate(45deg);transition:transform .2s;margin-right:6px}
.full[open] summary::after{transform:rotate(-135deg)}
.full p{font-size:18px;line-height:1.55;margin:0 0 20px}
.note{font-size:13px;color:var(--muted);padding:18px 0}

/* bottom bar (phone) */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--bg);border-top:1px solid var(--line);
  padding:8px max(16px,env(safe-area-inset-right,0px)) calc(8px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;justify-content:space-around}
.tabbar button{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;color:var(--muted);padding:4px 14px;border-radius:999px;min-width:64px}
.tabbar svg{width:26px;height:26px}
.tabbar button[aria-current="true"]{color:var(--ink)}
.tabbar button[aria-current="true"] .ic{background:color-mix(in srgb,var(--link) 18%,transparent)}
.tabbar .ic{padding:4px 18px;border-radius:999px;display:grid;place-items:center}
.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;font-size:15px;z-index:9;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.on{opacity:1}
.empty{color:var(--muted);padding:30px 0}

/* PC */
@media (min-width:900px){
  .pcnav{display:flex}
  .tabbar{display:none}
  main{padding-bottom:60px}
  .top h1{flex:0 0 auto}
  .top .wrap{gap:22px}
  .top .find{margin-left:auto}
  .tophead .find{display:none}
  .item{width:172px}
  .row{gap:26px;padding:14px 0 18px;margin:0;scroll-snap-type:none;overflow-x:auto}
  .list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:28px 40px}
  .hero .wrap{display:grid;grid-template-columns:auto minmax(0,1fr);grid-template-areas:"bar bar" "cov txt";text-align:left;align-items:center;column-gap:44px;padding-block:18px 40px}
  .hero .bar{grid-area:bar}
  .hero .cover{grid-area:cov;width:230px}
  .hero .txt{grid-area:txt;display:flex;flex-direction:column;gap:16px;align-items:flex-start}
  .facts .wrap{max-width:900px}
}
.hero .txt{display:contents}
@media (min-width:900px){.hero .txt{display:flex}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
.view{animation:vin .22s ease both}
/* ===== "See changes" version (ChatGPT + Gemini review, 14 Nov) ===== */
.v2btn{position:fixed;top:calc(6px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);z-index:9;background:#e9c46a;color:#1d1f26;font:900 12px/1 var(--f-body);padding:7px 12px;border-radius:999px;border:0;box-shadow:0 2px 8px rgba(0,0,0,.2);cursor:pointer}
@media (prefers-color-scheme:light){html.v2:not([data-theme="dark"]){--bg:#f7f8fa;--peek:#edf0f5}}
html.v2[data-theme="light"]{--bg:#f7f8fa;--peek:#edf0f5}
html.v2 .cstep{display:none}
html.v2 .cats{-webkit-mask-image:linear-gradient(90deg,#000 82%,transparent);mask-image:linear-gradient(90deg,#000 82%,transparent);padding-right:24px}
/* length band: green short, blue medium, red long */
.lenb{position:absolute;left:0;right:0;bottom:0;height:4%;min-height:3px;border-top:1px solid rgba(255,255,255,.55)}
.lenb.short{background:#2f9e55}.lenb.medium{background:#2f74d0}.lenb.long{background:#d23c32}
.lenkey{display:flex;flex-wrap:wrap;align-items:center;gap:4px 8px;font:600 12px/1.3 var(--f-body);color:var(--muted);margin:2px 0 10px}
.lenkey .lenb{position:static;display:inline-block;width:16px;height:6px;min-height:0;border:0;border-radius:3px;margin-right:-3px}
/* PC: arrows to flip through a shelf */
.rowwrap{position:relative}.rarr{display:none}
@media (min-width:900px){
  .rarr{display:grid;place-items:center;position:absolute;top:calc(14px + 7%);z-index:3;width:44px;height:44px;border-radius:50%;border:1px solid var(--line,#dde);background:var(--card,#fff);color:var(--ink,#1d1f26);font:400 30px/1 var(--f-body);padding-bottom:4px;cursor:pointer;box-shadow:0 3px 12px rgba(0,0,0,.18);transition:opacity .2s}
  .rarr.prev{left:-22px}.rarr.next{right:-22px}
  .rarr:hover{background:var(--ink,#1d1f26);color:#fff}
  .rarr[disabled]{opacity:0;pointer-events:none}
}
/* time goes under the name, not on the cover */
html.v2 .c2 .foot{display:none}
.item .mins{display:block;font-size:14px;font-weight:600;color:var(--muted);margin-top:3px}
/* review round 2 */
.lenf{display:flex;gap:6px;margin:4px 0 6px;overflow-x:auto;scrollbar-width:none}
.lenf button{flex:none;white-space:nowrap;font:700 13px/1 var(--f-body);padding:8px 11px;border-radius:999px;border:1px solid var(--line);background:var(--card,#fff);color:var(--ink)}
.lenf button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
html.v2 .hero .wrap{padding-block:10px 18px;gap:10px}
html.v2 .hero .cover{width:min(140px,36vw)}
@media (min-width:900px){html.v2 .hero .cover{width:170px}}
html.v2 .lrow .sum,html.v2 .lrow .point{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
html.v2 .c2.s-mission{box-shadow:inset 0 0 0 1px rgba(0,0,0,.07),0 2px 5px rgba(0,0,0,.12),0 10px 22px rgba(0,0,0,.12)}
/* PC: point at a book to see its summary */
.hov{position:fixed;z-index:20;width:300px;padding:14px 16px;border-radius:12px;background:var(--card,#fff);color:var(--ink);border:1px solid var(--line);box-shadow:0 12px 32px rgba(20,22,40,.22);font:400 14px/1.45 var(--f-body);opacity:0;transform:translateY(4px);transition:opacity .15s,transform .15s;pointer-events:none}
.hov.on{opacity:1;transform:none}

.hov .m{display:block;color:var(--muted);font-weight:600;font-size:13px;margin:3px 0 8px}
.hov .p{display:block;margin-top:8px;padding-left:10px;border-left:3px solid var(--line);color:var(--muted)}.hov .p b{color:var(--ink)}
/* PC shelves = the Resources page carousel: serif heading, "See all" pill, centered book lifts with a gold edge, faded edges, arrows step one book */
@media (min-width:900px){
  html.v2 .shelf{margin-top:34px}
  html.v2 .shelf-h{justify-content:flex-start;align-items:flex-end}
  html.v2 .shelf-h h2{font:600 clamp(24px,3.4vw,36px)/1.1 "Fraunces",Georgia,serif;letter-spacing:0;text-transform:none;color:var(--ink)}

<script>
const DATA={"mission": [{"t": "From Despair to Destiny", "u": "https://ssnet.org/blog/26d-05-inside-story-from-despair-to-destiny/", "gist": "In early 1906, a young Slovenian man named Albin Močnik was standing on a bridge in Germany, ready to take his own life due to deep despair. However, a stranger stopped him and led him to two Adventist shoemaking families. The quiet, consistent faith of these families touched Albin so deeply that he decided to turn toward God and was baptized just a few months later. This moment served as a major turning point, shifting his path from death to a life of dedicated service. Albin became a pioneer for the Adventist faith in the Balkans, facing immense obstacles including language barriers, imprisonment, and the horrors of World War I. Despite these hardships, he translated religious materials, composed hymns, and preached tirelessly. His persistence eventually led to him becoming the first president of the Yugoslav Union Conference. By the time he died, he had secured legal recognition for the church and established a lasting foundation for the faith in his homeland, proving how one life changed by grace can impact an entire nation.", "lesson": "God can transform a person's deepest despair into a powerful mission of hope and service.", "themes": "transformation, perseverance, missionary zeal, courage, God's grace", "bible": "John 10:10, 2 Timothy 1:7, Matthew 5:16", "good": "sermon, Bible study and Sabbath School, youth, children's story", "kids": true, "by": "Adventist Mission", "src": "Inside Story (Adventist Mission), 2026", "w": 445}, {"t": "A School for Berta", "u": "https://ssnet.org/blog/26d-04-inside-story-a-school-for-berta/", "gist": "Berta, a qualified teacher in Krakow, Poland, was looking for a new job. She discovered an opening at a brand-new Seventh-day Adventist school located near Warsaw. Although she was initially hesitant because the location was so far from her home, she began to notice several friends mentioning the school to her. Sensing a possible divine nudge, Berta prayed for guidance and decided to apply for two positions simultaneously, promising to accept whichever school responded first. To her surprise, the Adventist school was the first to contact her. However, she felt conflicted about moving her sixteen-year-old son, Jacob, away from his friends. After praying and offering him the choice to stay behind, Jacob chose to move with her, expressing a desire to be near his mother. Berta accepted the position and eventually became the school's principal. The move proved to be a blessing, as Jacob found a new community of friends and became active in the church. Berta now views her journey as a clear example of God's perfect providence.", "lesson": "When we surrender our plans to God and trust His guidance, He can lead us into unexpected blessings for our families and ministries.", "themes": "divine guidance, trusting God, obedience, family ministry, providence", "bible": "Proverbs 3:5-6, Psalm 32:8, Isaiah 30:21", "good": "sermon, Bible study and Sabbath School, youth", "kids": true, "by": "Adventist Mission", "src": "Inside Story (Adventist Mission), 2026", "w": 449}, {"t": "Begun in a Bar", "u": "https://ssnet.org/blog/26c-13-inside-story-begun-in-a-bar/", "gist": "Leenus was a former pastor of another denomination who converted to the Seventh-day Adventist faith after studying the Voice of Prophecy. Driven by a passion for the truth, he began a massive evangelistic effort, registering 360 people for Bible studies. Although he initially expected to lead the local congregation, his success led the church to appoint him as a Global Mission pioneer to reach unreached areas. In a new town, he faced a significant hurdle: the only available meeting place was a shop that had previously functioned as a bar. The local community mocked the idea of worshipping in such a 'wicked' location, causing Leenus to face potential discouragement. However, he chose to trust in God's sovereignty, viewing the humble beginning as a testimony of divine power. He persevered until God provided the resources and land to build a proper sanctuary. Today, the congregation thrives in a new building, serving as a visible sign of God's expanding work and faithfulness.", "lesson": "God can transform any situation or place into a testimony of His power when we trust His plan over our own preferences.", "themes": "missionary work, trusting God, perseverance, provision, evangelism", "bible": "Matthew 5:16, Philippians 4:19, Isaiah 43:19", "good": "sermon, Bible study and Sabbath School, youth, children's story", "kids": true, "by": "Rick Kajiura", "src": "Inside Story (Adventist Mission), 2026", "w": 464}, {"t": "Jake’s Prayer Journey", "u": "https://ssnet.org/blog/26c-10-inside-story-jakes-prayer-journey/", "gist": "Jake is a dedicated church planter living in a region where very few people know about Jesus. To stay spiritually grounded, he begins a personal project of writing down his monthly prayer requests to track how God answers them. While working with a small group to disciple new believers, Jake meets two very different men. The first is Omar, a cook who has secretly followed Christ for fifteen years out of fear for his safety. The second is Wassim, a former refugee who found peace in Christianity while living abroad and is now seeking deeper understanding. Both men express a desire to be baptized. Jake begins meeting with them regularly to study the Bible and discuss their faith. By the end of the first month, Jake reflects on his prayer journal with awe. He realizes that God has directly answered his request to teach the Word, and he feels energized and ready to continue this ministry with divine strength.", "lesson": "When we faithfully commit our desires to God in prayer, He provides the specific opportunities and strength needed to fulfill His calling.", "themes": "prayer, evangelism, discipleship, God's faithfulness, courage", "bible": "Philippians KJV, Matthew KJV, 1 Thessalonians KJV", "good": "sermon, Bible study and Sabbath School, youth", "kids": false, "by": "Adventist Mission", "src": "Inside Story (Adventist Mission), 2026", "w": 425}, {"t": "Mission Begins Young", "u": "https://ssnet.org/blog/26c-09-inside-story-mission-begins-young/", "gist": "Myron Iseminger was a young man who grew up inspired by missionary stories but never imagined he would actually become one. In the late 1970s, after seeing his sister volunteer in Japan, he decided to spend a year in the Middle East to teach English and gain ministerial experience. This trip became a major turning point for him; by visiting his students' homes and hearing their personal struggles, he learned to replace judgment with empathy and love for people from different cultures. This experience sparked a lifelong calling to missions. To prepare, he pursued a second degree in business, recognizing that mission work requires practical management. He also sought a spouse who shared his vision, eventually marrying Candace, who traveled abroad with him. They eventually secured a position as a treasurer in Egypt. Despite the challenges of working with limited resources, Myron found deep fulfillment in serving on the front lines. His journey shows that when we surrender our plans to God, He can orchestrate a life of service far greater than we could have imagined.", "lesson": "When we surrender our personal plans to God's calling, He can lead us into a life of service that exceeds our own imagination.", "themes": "calling, empathy, trusting God, service, cultural awareness", "bible": "Matthew 6:33, Isaiah 6:8, Proverbs 16:9", "good": "sermon, Bible study and Sabbath School, youth", "kids": false, "by": "Kathie Lichtenwalter", "src": "Inside Story (Adventist Mission), 2026", "w": 463}, {"t": "Spirit-led Encounters", "u": "https://ssnet.org/blog/26c-08-inside-story-spirit-led-encounters/", "gist": "A missionary couple serving in a restricted, unnamed country prayed for God to help them establish a home church. Although they expected only foreigners at first, God began opening doors to the local population. The turning point occurred when the missionary met a taxi driver named Salman. They bonded over faith, and the missionary discovered that Salman had no Christian community to join. The missionary invited Salman and his wife to their home worship, where they both grew in their devotion to Jesus. The ripple effect continued when Salman shared his faith with his brother, Faisal, who was also a secret believer. Despite being previously rejected by a formal church due to religious restrictions, Faisal joined the home group. After years of prayer, the brothers eventually shared their faith with their parents. While some family members rejected them, the missionary couple saw this as a clear sign of God's providence in providing a safe haven for believers in a difficult land.", "lesson": "God sovereignly orchestrates divine connections to provide spiritual fellowship and safety for those seeking Him in restricted places.", "themes": "missionary work, providence, spiritual fellowship, courage, evangelism", "bible": "Matthew 18:20, Acts 1:8, Romans 10:15", "good": "sermon, Bible study and Sabbath School, youth", "kids": false, "by": "Adventist Mission", "src": "Inside Story (Adventist Mission), 2026", "w": 415}, {"t": "Meeting the General", "u": "https://ssnet.org/blog/26c-07-inside-story-meeting-the-general/", "gist": "The story follows a missionary couple facing a dire crisis in a restricted country. They were at risk of being deported because of a technicality on the wife's passport, making it nearly impossible to secure a temporary residence card. Feeling desperate, the husband turned to God for a miracle. When they arrived at the immigration office, the clerk was unable to help and directed them to a high-ranking official. To their shock, the 'general' turned out to be a kind young man who was simply studying English and aspiring to work for the United Nations. He processed their paperwork instantly without questioning the complications. The author felt the Holy Spirit prompting him to offer the young man help with his English. This simple act of kindness sparked a lasting friendship. What began as a desperate plea for legal safety ended with a divine connection, as God not only solved their immediate problem but also opened a door for a new relationship and shared ministry goals.", "lesson": "God often answers our most desperate prayers by opening doors that lead to His greater purposes for our lives.", "themes": "providence, answered prayer, divine intervention, missionary life, unexpected blessings", "bible": "Matthew 6:33, Philippians 4:6, Proverbs 3:5", "good": "sermon, Bible study and Sabbath School, youth", "kids": true, "by": "Adventist Mission", "src": "Inside Story (Adventist Mission), 2026", "w": 491}, {"t": "High-end Fashion for Christ", "u": "https://ssnet.org/blog/26c-04-inside-story-high-end-fashion-for-christ/", "gist": "Isabelle is a successful fashion designer and organizer based in New York City. While she works in the high-pressure world of runway shows and celebrity fashion, she maintains a deep commitment to her Seventh-day Adventist faith. After being miraculously healed from a serious injury, Isabelle felt a profound calling to serve others. She now balances her professional career with volunteer work at an urban ministry center. However, her ministry isn't limited to her volunteer hours; she intentionally integrates her faith into her entire career. Before every show, she prays with the models and staff to provide them with peace in a competitive environment. She also uses her press releases and designs to prompt the public to examine their spiritual lives and seek God. By being a consistent example of Christ's love and peace, she has become a 'center of influence' herself. People she works with are often drawn to her faith, leading her to invite them into church programs and Bible studies.", "lesson": "Every believer can become a center of influence by intentionally reflecting Christ's character and love in their everyday professional lives.", "themes": "missionary heart, center of influence, faith and work, testimony, peace, healing", "bible": "Matthew 5:16, 1 Peter 3:15, Colossians 3:23", "good": "sermon, Bible study and Sabbath School, children's story, youth", "kids": true, "by": "Sandra Dombrowski", "src": "Inside Story (Adventist Mission), 2026", "w": 496}, {"t": "Two Dreams", "u": "https://ssnet.org/blog/26c-03-inside-story-two-dreams/", "gist": "This story follows Dante Herrmann, a young man born in Germany who was considered a medical miracle after his mother struggled for years to conceive. Due to health issues as an infant, his family moved to the Canary Islands. As a teenager, Dante struggled with school and eventually dropped out to work as a handyman. Seeking quick wealth, he turned to drug dealing and made a spiritual pact with the devil, symbolized by a tattoo. Although he had money, he felt a profound emptiness and guilt over the harm he was causing others. After fleeing to Germany and eventually returning to the islands, he quit drugs and became a tattoo artist. His life changed drastically when his father won a massive legal settlement, offering Dante a share of the wealth. However, after reading the Bible, Dante realized that material riches couldn't fill his inner void. He surrendered his life to Jesus, discovering that true wealth is found in a relationship with God. Today, he serves as a pastor in Germany.", "lesson": "True fulfillment and wealth are found not in material success or worldly pleasures, but in surrendering one's heart to Jesus.", "themes": "redemption, true wealth, repentance, God's grace, addiction", "bible": "Proverbs 10:22, John 10:10, Luke 12:15", "good": "sermon, Bible study and Sabbath School, youth", "kids": false, "by": "Adventist Mission", "src": "Inside Story (Adventist Mission), 2026", "w": 603}, {"t": "A Touch That Transforms", "u": "https://ssnet.org/blog/26c-02-inside-story-a-touch-that-transforms/", "gist": "This story follows two women in Brazil, Fabiola and Luisa, who were both facing devastating personal crises. Fabiola was battling a breast cancer diagnosis during the height of the COVID-19 pandemic, while Luisa was dealing with a broken marriage, a serious health issue caused by her husband's infidelity, and her mother's Alzheimer's disease. Both women felt overwhelmed by despair and were searching for a reason to keep going. In a remarkable twist of fate, both women experienced a similar intervention: their dogs accidentally stepped on their television remotes, switching the channel to a Christian network. This divine coincidence allowed them to encounter the Gospel during their darkest hours. For Fabiola, the messages helped her reframe her illness as an opportunity for spiritual growth rather than a punishment. For Luisa, the content helped her identify her depression, leading her to seek treatment and find spiritual renewal. Both women were transformed from states of hopelessness to lives of purpose and faith, illustrating how God can use simple means to reach those in need.", "lesson": "God can use the most unexpected circumstances to bring His healing message to those in their deepest despair.", "themes": "providence, healing, hope, depression, divine intervention", "bible": "Mark 5, Psalm 34:18, Matthew 11:28", "good": "sermon, Bible study and Sabbath School, children's story, youth", "kids": true, "by": "Vyacheslav Demyan", "src": "Inside Story (Adventist Mission), 2026", "w": 444}], "iiw": [{"t": "1. Presumption; Faith", "u": "https://www.itiswritten.com/wp-content/uploads/2021/03/Sermon-illustrations-book-PDF-edition-v1-20210301.pdf#page=5", "gist": "During a track meet in Switzerland, an Ethiopian runner was sprinting toward the finish line with a massive lead over his competitors. Overjoyed by his perceived victory, he broke into a celebratory gesture before reaching the tape. However, he had made a critical mistake: he hadn't realized there were still 400 meters remaining in the 5,000-meter race. Because he stopped his effort too early, he plummeted from a potential first-place finish down to tenth place. The story serves as a vivid metaphor for spiritual complacency.", "lesson": "We must remain vigilant and persistent in our faith until the very end, rather than assuming we have reached our goal before God's work is complete.", "themes": "perseverance, spiritual vigilance, endurance, faithfulness, the final goal", "bible": "Matthew 24:13, Hebrews 12:1, 2 Timothy 4:7", "good": "sermon, Bible study and Sabbath School, youth", "kids": true, "by": "John Bradshaw", "src": "It Is Written, 104 Useful Sermon Illustrations, Vol. 1, page 5", "w": 74}, {"t": "2. Forgiveness", "u": "https://www.itiswritten.com/wp-content/uploads/2021/03/Sermon-illustrations-book-PDF-edition-v1-20210301.pdf#page=5", "gist": "A man in New Zealand accidentally struck and killed a neighbor's cat while backing out of his driveway. The tragedy was compounded by the fact that the cat belonged to the country's Prime Minister. In a desperate attempt to avoid legal consequences, the man's children wrote a note asking the leader not to imprison their father. However, the situation reached a turning point when the man finally faced the Prime Minister in person. Instead of hiding behind his children's words, he took personal responsibility and offered a sincere, face-to-face apology for his actions.", "lesson": "True repentance requires moving beyond excuses to take personal responsibility for our mistakes before God and others.", "themes": "repentance, accountability, honesty, forgiveness, humility", "bible": "Psalm 86, Proverbs 28:13, James 5:16", "good": "sermon, Bible study and Sabbath School, youth", "kids": false, "by": "John Bradshaw", "src": "It Is Written, 104 Useful Sermon Illustrations, Vol. 1, page 5", "w": 80}, {"t": "3. Words; Conversion", "u": "https://www.itiswritten.com/wp-content/uploads/2021/03/Sermon-illustrations-book-PDF-edition-v1-20210301.pdf#page=5", "gist": "A woman contacted a bakery to order a birthday cake for her daughter inspired by the movie Moana. However, due to a misunderstanding of the name, the bakery decorated the cake with marijuana leaves and drug-related symbols instead. When the family received the incorrect order, they realized the shop had misheard the request. Despite the bizarre mistake, the family chose to find the humor in the situation rather than getting angry, making it a memorable birthday moment.", "lesson": "Clear communication is essential to avoid misunderstandings, but a spirit of grace allows us to handle mistakes with humor and kindness.", "themes": "clear communication, God's grace, forgiveness, humor, patience", "bible": "Proverbs 15:1, Ephesians 4:32", "good": "sermon, children's story, youth", "kids": true, "by": "John Bradshaw", "src": "It Is Written, 104 Useful Sermon Illustrations, Vol. 1, page 5", "w": 74}, {"t": "4. Small Things; God’s Care", "u": "https://www.itiswritten.com/wp-content/uploads/2021/03/Sermon-illustrations-book-PDF-edition-v1-20210301.pdf#page=6", "gist": "A family was traveling on a crowded highway when their four-year-old daughter accidentally tossed her beloved stuffed dolphin out of the moving car. The child was devastated and couldn't be comforted by any other toy. To help her, the mother contacted the police, who organized a rescue mission to retrieve the toy from the dangerous roadside. The operation was successful, and the little girl was overjoyed to have her favorite companion back.", "lesson": "God is willing to go to great lengths to rescue what we value and provide comfort in our times of loss.", "themes": "God's care, rescue, comfort, protection, faithfulness", "bible": "1 Peter 5:7, Psalm 34:17, Matthew 18:14", "good": "sermon, children's story, youth", "kids": true, "by": "John Bradshaw", "src": "It Is Written, 104 Useful Sermon Illustrations, Vol. 1, page 6", "w": 72}, {"t": "5. Honesty; Integrity", "u": "https://www.itiswritten.com/wp-content/uploads/2021/03/Sermon-illustrations-book-PDF-edition-v1-20210301.pdf#page=6", "gist": "In Syracuse, New York, an armored truck accidentally spilled over $300,000 onto a public street. Two honest men discovered the cash and immediately began collecting it to ensure it reached its rightful owners. As news of the windfall spread, a large crowd gathered. While many people joined in to help return the money, others were tempted by the sight of the wealth and wanted to keep it for themselves. The situation served as a public test of character, showing how easily people can be swayed by greed when faced with unearned riches.", "lesson": "True integrity is choosing to do what is right even when no one is watching and the temptation to take a shortcut is great.", "themes": "integrity, honesty, temptation, stewardship, character", "bible": "Proverbs 13:11, Luke 12:15, Matthew 6:21", "good": "sermon, Bible study and Sabbath School, youth", "kids": true, "by": "John Bradshaw", "src": "It Is Written, 104 Useful Sermon Illustrations, Vol. 1, page 6", "w": 71}, {"t": "6. Trials; God’s Care", "u": "https://www.itiswritten.com/wp-content/uploads/2021/03/Sermon-illustrations-book-PDF-edition-v1-20210301.pdf#page=6", "gist": "A father was placing items into his young son's arms one by one. A bystander noticed the pile growing and asked the boy if the load was becoming too heavy. The child smiled confidently and replied that it wasn't too much because his father knew exactly how much he was capable of carrying. The story serves as a metaphor for our relationship with God. Just as the father understands his son's strength, God knows our limits and will never burden us with more than we can handle.", "lesson": "God provides us with the strength and grace necessary to endure every trial we face.", "themes": "God's sovereignty, strength in trials, trusting God, protection, perseverance", "bible": "1 Corinthians 10, Isaiah 41:10, Psalm 34:18", "good": "sermon, Bible study and Sabbath School, children's story, youth", "kids": true, "by": "John Bradshaw", "src": "It Is Written, 104 Useful Sermon Illustrations, Vol. 1, page 6", "w": 86}, {"t": "7. Connection with God", "u": "https://www.itiswritten.com/wp-content/uploads/2021/03/Sermon-illustrations-book-PDF-edition-v1-20210301.pdf#page=7", "gist": "The story describes Ireland's rapid economic boom in the late 1990s, known as the 'Celtic Tiger.' While the country experienced incredible growth, the economy eventually crashed, leading to a need for a bailout. The author uses this economic cycle as a metaphor for the spiritual lives of believers. Just as a nation can rise and fall, a person's faith can reach a peak and then suddenly lose momentum. The turning point is the realization that spiritual life can become stagnant or 'flat.' The story concludes by emphasizing that the goal for Christians is not just to experience a temporary spiritual high, but to remain constantly revived in their relationship with God.", "lesson": "True faith is not a temporary emotional peak but a continuous, sustained state of spiritual renewal.", "themes": "spiritual growth, perseverance, constant renewal, faithfulness, spiritual vitality", "bible": "1 John 1:7, Isaiah 40:31, Psalm 119:105", "good": "sermon, Bible study and Sabbath School, youth", "kids": false, "by": "John Bradshaw", "src": "It Is Written, 104 Useful Sermon Illustrations, Vol. 1, page 7", "w": 82}, {"t": "8. Revival", "u": "https://www.itiswritten.com/wp-content/uploads/2021/03/Sermon-illustrations-book-PDF-edition-v1-20210301.pdf#page=7", "gist": "During the early 1900s, Wales experienced a massive religious awakening known as the Welsh revival. Hundreds of thousands of people converted to Christianity, and the movement gained global attention through media and famous preachers. However, the story notes a tragic aftermath: because the movement relied heavily on the emotional experience of the event rather than a deep, permanent root in the Word of God, the faith in Wales has significantly declined today. The turning point is the realization that a temporary spiritual high cannot replace a lifelong commitment to abiding in Christ.", "lesson": "True spiritual transformation comes from a permanent connection to the Word of God rather than a temporary emotional experience.", "themes": "spiritual growth, abiding in Christ, the Word of God, true conversion, consistency", "bible": "John 15, Galatians 2, Philippians 1", "good": "sermon, Bible study and Sabbath School, youth", "kids": false, "by": "John Bradshaw", "src": "It Is Written, 104 Useful Sermon Illustrations, Vol. 1, page 7", "w": 70}, {"t": "9. Small Things; Value; Priorities", "u": "https://www.itiswritten.com/wp-content/uploads/2021/03/Sermon-illustrations-book-PDF-edition-v1-20210301.pdf#page=7", "gist": "A woman entered a second-hand shop during a cold winter day and left her muddy boots by the entrance. While she was browsing, another customer purchased the boots for only two dollars. The cashier mistakenly assumed they were a clearance item because he didn't realize their true worth. The woman was devastated to find her expensive footwear gone. This story highlights how people often overlook the true value of things—or people—simply because they appear worn or dirty on the outside.", "lesson": "Human beings often fail to recognize the inherent value of others because they judge based on outward appearances rather than internal worth.", "themes": "inner value, judgment, perspective, worth, spiritual sight", "bible": "John 6, 1 Samuel 16:7, 1 Samuel 16:18", "good": "sermon, Bible study and Sabbath School, youth", "kids": true, "by": "John Bradshaw", "src": "It Is Written, 104 Useful Sermon Illustrations, Vol. 1, page 7", "w": 82}, {"t": "10. Choices; Decisions", "u": "https://www.itiswritten.com/wp-content/uploads/2021/03/Sermon-illustrations-book-PDF-edition-v1-20210301.pdf#page=8", "gist": "A man traveling from the Middle East to the United States was stopped by airport security in Baltimore. During a routine check, officers discovered a missile launcher hidden inside his luggage. The man explained that he had kept the weapon as a souvenir from his military service and had no intention of using it. The story highlights how something dangerous and unexpected can be hidden in plain sight, much like the hidden nature of sin.", "lesson": "Just as a hidden weapon can cause unexpected harm, sin remains a dangerous presence in our lives until we surrender it to God.", "themes": "sin, repentance, spiritual warfare, hidden dangers, salvation", "bible": "Romans 6, John 8:7, Psalm 51", "good": "sermon, Bible study and Sabbath School, youth", "kids": false, "by": "John Bradshaw", "src": "It Is Written, 104 Useful Sermon Illustrations, Vol. 1, page 8", "w": 77}], "moment": [{"t": "AWR360 Nepal - Bikram's Story", "u": "https://www.youtube.com/watch?v=hG5sfBcBFNo", "m": 311, "w": 698, "by": "Adventist World Radio", "src": "YouTube, Adventist World Radio", "gist": "Bikram's family were among the first Christians in their Nepali village and were beaten and driven out. In a new town they still felt empty until his mother found the Adventist World Radio program; the whole family began listening and then going to church. His mother prayed him into a youth training school, and he ended up as the driver for the very radio pastor whose voice had reached them.", "lesson": "God uses a radio voice and a mother's prayers to fill an empty heart.", "themes": "persecution, media ministry, a mother's prayers, providence", "bible": "Romans 10:17, James 5:16", "good": "sermon, mission emphasis, family and women", "kids": false}, {"t": "This Mother's Prayer Changed Her Life Forever", "u": "https://www.youtube.com/watch?v=krJGZGgI4LU", "m": 367, "w": 870, "by": "Emily", "src": "YouTube, Adventist Frontier Missions", "gist": "Emily grew up Catholic but drifted away and had never read the Bible. After her son's birth brought fear and sleepless nights over his health, she prayed for real for the first time and the next day felt a deep calm. Missionaries Gabe and Eileen Cardona befriended her, studied with her and connected with her children. Prayer and Bible reading are now part of her home.", "lesson": "One honest prayer, followed by faithful friends, can change a life.", "themes": "prayer, peace, friendship evangelism, family", "bible": "Philippians 4:6-7, Matthew 11:28", "good": "sermon, prayer meeting, family and women", "kids": false}, {"t": "Sia's Story of Freedom", "u": "https://www.youtube.com/watch?v=h7dwJcmroW4", "m": 400, "w": 643, "by": "Sia", "src": "YouTube, Adventist Frontier Missions", "gist": "Sia, a young woman who lost both parents, tells of being tormented by evil spirits. Church members prayed with her again and again, even when she spoke in a strange voice and pushed away her own baby. Through persistent prayer in Jesus' name she was set free, and the film ends with her baptism.", "lesson": "The devil comes to steal and destroy, but Jesus sets captives free.", "themes": "deliverance, prayer, the power of Jesus' name, baptism", "bible": "John 10:10, Luke 4:18", "good": "sermon, prayer meeting, testimony", "kids": false}, {"t": "The Miracle Baby", "u": "https://www.youtube.com/watch?v=qzvG-y9DW-Q", "m": 543, "w": 1781, "by": "Adventist Frontier Missions", "src": "YouTube, Adventist Frontier Missions", "gist": "A missionary in Mindoro tells how Manuel, a young indigenous believer, hiked to an unreached village and was asked to pray for a baby who had died. He wrestled with God for two hours, surrendered, and the baby came back to life. But after he left, a shaman frightened the mother into letting the baby die again. Manuel learned new believers must not be left alone, so he moved in and stayed until a church and its leaders stood strong.", "lesson": "Miracles matter, but discipleship must follow.", "themes": "miracles, discipleship, perseverance, missions", "bible": "Matthew 28:19-20, Colossians 2:6-7", "good": "sermon, Bible study and Sabbath School, mission emphasis", "kids": false}, {"t": "Miracle Manna Story From Angola", "u": "https://www.youtube.com/watch?v=Ntadn2DHRGQ&t=193s", "m": 663, "w": 1617, "by": "Noel Sibanda", "src": "YouTube, SID Media", "gist": "Noel Sibanda visits the Namba Adventist Mission Station in southern Angola, where members say manna has fallen since a famine in the 1940s. Witnesses tell how hungry women prayed and fasted three days, and a girl met two men who told her to take and eat the white bread-like food. They say it fell every day except the Sabbath, stopped when the station was destroyed in the war, and came back when it was rebuilt.", "lesson": "God still cares for and watches over His people.", "themes": "provision, prayer and fasting, Sabbath, faithfulness", "bible": "Exodus 16, Matthew 6:31-33", "good": "sermon, Bible study and Sabbath School, mission emphasis", "kids": false}, {"t": "My Deliverance Testimony", "u": "https://www.youtube.com/watch?v=4JkiUqLfMNs", "m": 889, "w": 2584, "by": "Leah Hodge", "src": "YouTube, 3ABN Australia Radio", "gist": "Leah Hodge left her faith as a teen and lived a hard life of drugs and depression. Seeking healing, she went alone to a fasting retreat in Costa Rica and became deadly ill. Her mother prayed, a call came through on a phone that had never worked, and a stranger helped them in hospital and gave blood. In the hospital Leah was delivered from a demon through prayer and hymns.", "lesson": "Prayer in Jesus' name still brings miracles today.", "themes": "deliverance, a mother's prayers, coming home, miracles", "bible": "Luke 15:20, Mark 9:29", "good": "sermon, prayer meeting, youth", "kids": false}, {"t": "Testimony (Sonica Singh, Oakwood SDA Church, 23 Nov 2024)", "u": "https://www.youtube.com/watch?v=jluQ6UyElX4", "m": 1230, "w": 2297, "by": "Sonica Singh", "src": "YouTube, Oakwood SDA Church", "gist": "Sonica Singh, a new physical therapy doctor, was found jaundiced the day she was leaving for a new job and was diagnosed with a rare, aggressive lymphoma. She tells of hard chemotherapy, near-death emergencies, and a dark presence during sepsis that left when she called on Jesus. Her sister turned out to be a full bone marrow match, and the transplant day became her new birthday.", "lesson": "God is in control and works through family and prayer.", "themes": "suffering, healing, trusting God, family", "bible": "Psalm 46:10, Psalm 27:1", "good": "sermon, health, prayer meeting", "kids": false}, {"t": "AIDS and Hope:  A Home for Little Ruth", "u": "https://www.youtube.com/watch?v=akkgnsNxyqo&t=375s", "gist": "In a Phnom Penh slum, Julie befriends Minette, a young mother who is afraid to be tested for HIV. When the clinic confirms it, Minette asks if Julie must hate her. Julie says she loves her all the more and Minette's crochet group cares for her little girl Ruth. As Minette fails in the hospital, an Australian missionary named Ruth arrives to adopt the child. Minette dies at peace.", "lesson": "Love for the despised shows Jesus to those others avoid.", "themes": "compassion, AIDS, adoption, love, outcasts", "bible": "Matthew 25:40; Romans 5:8", "good": "sermon, mission emphasis, evangelism and outreach", "kids": false, "by": "Pastor Scott Griswold", "src": "YouTube, ASAP Ministries", "w": 988, "m": 307}, {"t": "Pray Through to the Miracle", "u": "https://www.youtube.com/watch?v=2sT2B9jTkyg", "gist": "A Vietnamese house church prayed for an unreached village 150 miles away. A relative, Yen, came to the city dying of cancer, heard about Jesus, and gave her heart to Him before returning home. The church kept praying for a miracle and told her sister-in-law by phone to read Psalm 30 over her. After Yen stopped breathing, the sister-in-law did so; Yen sat up well, and more than fifty villagers accepted Jesus.", "lesson": "Keep praying through to the answer; God honors persistent prayer.", "themes": "persistent prayer, healing, Vietnam, house church", "bible": "Psalm 30:2-3; Luke 11:9", "good": "sermon, prayer meeting, Bible study and Sabbath School", "kids": false, "by": "Pastor Scott Griswold", "src": "YouTube, ASAP Ministries", "w": 935, "m": 307}, {"t": "Love Multiplies in Laos", "u": "https://www.youtube.com/watch?v=m0pfscEpL30", "gist": "Vong, a Hmong boy from a village in Laos, was led by a pastor he met on a trip to the capital and by a friend's text message to follow Jesus despite his parents' objections. He worked long hours as a security guard, read the Bible, and was helped to study theology in the Philippines. Back in Laos he found as a wife a childhood playmate who wanted to serve God, and her village chief father came to trust him. In that village Vong taught English, prayed for troubled people, built a congregation and a church, and led the first youth camp in the country.", "lesson": "God provides step by step for the one who seeks his kingdom first.", "themes": "Hmong, Laos, calling, provision, church planting", "bible": "Matthew 6:33; Romans 10:14-15", "good": "sermon, mission emphasis, youth", "kids": false, "by": "Pastor Scott Griswold", "src": "YouTube, ASAP Ministries", "w": 1021, "m": 307}, {"t": "Hope Restored", "u": "https://www.youtube.com/watch?v=Wg85NYCb5wQ", "gist": "A Cambodian refugee who lost brothers in the war and her mother and father was left with no family in America. Years later, as a single mother working long hours, she lost her home and greenhouse in a hurricane and fell ill and depressed. An Adventist volunteer taught her healthy eating, her health improved, and her house was finally rebuilt. She opened her home for Sabbath worship and was baptized.", "lesson": "God uses simple health ministry to bring hurting people to the Great Physician.", "themes": "refugees, health ministry, hurricane, baptism, resilience", "bible": "Psalm 147:3; 3 John 2", "good": "sermon, health, mission emphasis", "kids": false, "by": "Lynetta Ram", "src": "YouTube, ASAP Ministries", "w": 792, "m": 308}, {"t": "An Addict's Desperate Prayer and God's Miraculous Answer", "u": "https://www.youtube.com/watch?v=qaSQFizzpa0", "gist": "Dale, a young man in a Myanmar village whose kidneys were failing and who was ruined by betel nut and smoking, promised God he would quit his habits if he were healed. Within three months his doctor gave him a clean bill of health, and when an Adventist pastor visited he became the first Adventist in his village. He accepted the call to be a church planter, started a group that grew to over twenty members, and visited neighboring villages. When he shared half of his last rice with a neighbor, an unexpected gift of money for ten kilos of rice arrived the next day.", "lesson": "God answers the desperate prayer of an honest sinner and then honors generosity from the poor.", "themes": "healing, addiction, answered prayer, church planting, provision", "bible": "Psalm 50:15; Philippians 4:19", "good": "sermon, prayer meeting, stewardship", "kids": false, "by": "ASAP Ministries", "src": "YouTube, ASAP Ministries", "w": 675, "m": 310}, {"t": "Faith or family: What if you had to choose?", "u": "https://www.youtube.com/watch?v=7cBXobfIlPk&t=128s", "gist": "On the Thai-Myanmar border, a Karen girl named Patu heard Bible stories from friends at a mission school and begged her Buddhist parents to let her attend. They agreed only if she would not become a Christian, but she was baptized anyway. Her mother sent word that she was no longer welcome at home, and later offered money and land to make her worship the spirits. She refused and returned to school, where she now dreams of becoming a missionary.", "lesson": "Faith in Jesus can cost a young person her family, yet he gives a new family of believers.", "themes": "Karen people, family opposition, courage, baptism, mission schools", "bible": "Daniel 3:17-18; Matthew 10:37", "good": "sermon, youth, mission emphasis", "kids": false, "by": "Patu", "src": "YouTube, ASAP Ministries", "w": 713, "m": 312}, {"t": "From the Van to the Pulpit", "u": "https://www.youtube.com/watch?v=5psmCDyG-jQ", "gist": "Pastor Tseng, a commercial van driver in a closed Southeast Asian country, is talked into carrying 23 singing Christians when his permit allows 12. At each of six police checkpoints the officers look away. He is drawn into their meeting, hears about Jesus for the first time and raises his hand, then learns his wife had secretly prayed for him for months. He leaves driving to become a pastor.", "lesson": "God can open a hardened heart through the quiet prayers of a spouse.", "themes": "conversion, protection, persecution, prayer, church planting", "bible": "Acts 12:5-10; Proverbs 21:1", "good": "sermon, mission emphasis, prayer meeting", "kids": false, "by": "Pastor Tseng", "src": "YouTube, ASAP Ministries", "w": 698, "m": 313}, {"t": "From Fear to Faith in Cambodia", "u": "https://www.youtube.com/watch?v=uMSobQ1W-5A", "gist": "In a Tampuan village in northeastern Cambodia, Mak Rina's husband, a respected shaman, died, and her home filled with frightening noises and shadows that rituals could not stop. Her son Kanang had secretly accepted Jesus through an ASAP church planter and persuaded her to give God a chance. Church members came to the house and prayed and sang for three days, and when she finally surrendered to Jesus the disturbance ended and peace settled over the house. She studied the Bible, was baptized two months later, and Kanang now studies to be a teacher with a scholarship.", "lesson": "A young believer's quiet faith can bring peace to a whole frightened family.", "themes": "Spirit worship, deliverance, family, conversion, Cambodia", "bible": "Colossians 2:15; James 4:7", "good": "sermon, mission emphasis, youth", "kids": false, "by": "ASAP Ministries", "src": "YouTube, ASAP Ministries", "w": 710, "m": 313}, {"t": "New Light for the Long-Necked People", "u": "https://www.youtube.com/watch?v=-euDWxrjmVY&t=96s", "gist": "Yang Su, a young woman of the long-necked Kayan tribe, grows up Buddhist and wants only an education. She attends a Christian school determined to stay Buddhist, but in grade twelve she feels God urging her and is baptized as one of the first three Adventists among her people. She becomes a kindergarten teacher in her village, teaches Bible stories, and sees families and a witch doctor turn to Jesus.", "lesson": "One convert in an unreached tribe can be the doorway for her whole people.", "themes": "unreached peoples, education, baptism, teaching, tribal witness", "bible": "Isaiah 9:2; Romans 10:14-15", "good": "sermon, mission emphasis, youth", "kids": false, "by": "Yang Su", "src": "YouTube, ASAP Ministries", "w": 817, "m": 315}, {"t": "Mission Matters: Links in the Chain - Part 1", "u": "https://www.youtube.com/watch?v=8fAs8e7faqs", "gist": "In the early 1980s a Lao family left their homeland after a communist takeover that cost them their possessions and took an uncle's life, crossing the Mekong at night while the mother was newly pregnant. In a Thai refugee camp they met ASAP's founder Judy Aiken, who gave out blankets, clothing, food and Bibles in the refugees' own language. Hearing at a Christmas gathering that Jesus the Creator died for her, the mother cried, studied the Bible, and the whole family was baptized as Adventists. The video presents the blanket as the first link in a chain that continued for decades.", "lesson": "One simple gift of kindness can become the first link in a chain that reaches a whole family and beyond.", "themes": "refugees, kindness, conversion, Laos, generosity", "bible": "Matthew 25:35-36; Galatians 6:9", "good": "sermon, mission emphasis, stewardship", "kids": false, "by": "ASAP Ministries", "src": "YouTube, ASAP Ministries", "w": 736, "m": 322}, {"t": "Family to Family Touch the World", "u": "https://www.youtube.com/watch?v=-96mcTqzBDw&t=52s", "gist": "A Cambodian Buddhist couple, Cup and Sopia, borrowed money for papers to work in Thailand but kept running out of cash. A pastor suggested they sell Christian books, and in their desperation they prayed and made their first sales. Their children joined the free feed-and-read school, and after seven months of Bible study the parents were baptized. They repaid their debt in four months, and Sopia's sister is now studying too.", "lesson": "God can turn a family's desperate need into a channel of blessing for the next family.", "themes": "family, Cambodia, literature evangelism, conversion, answered prayer", "bible": "Genesis 12:3; Philippians 4:4", "good": "sermon, children's story, mission emphasis", "kids": true, "by": "Pastor Scott Griswold", "src": "YouTube, ASAP Ministries", "w": 1024, "m": 328}, {"t": "Sold into Slavery, Set Free by Jesus: Hajima's Story", "u": "https://www.youtube.com/watch?v=hHufdygWuvc", "gist": "Hajima, orphaned in Myanmar, is tricked by her aunt and sold as a household slave in Mae Sot, Thailand. After two years a neighbor helps her escape to an ASAP-supported mission school. She is Muslim at first, but studies the Bible and decides to follow Jesus. When she is tormented at night, teachers and students pray and sing through the night and she is freed and later baptized.", "lesson": "Jesus sets captives free, and a school can be the place it happens.", "themes": "human trafficking, freedom, conversion, spiritual warfare, mission schools", "bible": "Luke 4:18; Psalm 107:13-14", "good": "sermon, mission emphasis, prayer meeting", "kids": false, "by": "ASAP Ministries", "src": "YouTube, ASAP Ministries", "w": 662, "m": 329}, {"t": "Share the Gospel:  Squeeze My Hand", "u": "https://www.youtube.com/watch?v=hmVkmGg61YY&t=407s", "gist": "When Griswold's family lived in Cambodia, a fifteen-year-old English student named Mullane came to their house until he stopped showing up because his kidneys were failing. Griswold visited him and found him swollen, with monks chanting over him, and later in a hospital where he could no longer speak. Using a small picture book of colors, he explained heaven, sin, the cross and forgiveness, and asked Mullane to squeeze his hand if he wanted Jesus to forgive him. The boy squeezed with surprising strength and died soon after, and at the funeral Griswold ached to tell the grieving family that death has been defeated.", "lesson": "Be ready to tell the good news simply and now, because someone's last chance may be today.", "themes": "death, hope, evangelism, Cambodia, resurrection", "bible": "Job 19:25-27; 1 Thessalonians 4:16-18", "good": "sermon, special services, mission emphasis", "kids": false, "by": "Pastor Scott Griswold", "src": "YouTube, ASAP Ministries", "w": 1006, "m": 334}, {"t": "Does God Hate the Poor?", "u": "https://www.youtube.com/watch?v=_Xv9gRvmHwY", "gist": "Before a first baptism in a Phnom Penh slum, Pastor Griswold found a young mother named Sokha selling sticky rice on the Sabbath and gently reminded her that baptism meant keeping the day holy. She answered that then God must hate the poor, since the poor cannot afford a day without income. Shaken, he studied the Bible again and discovered that the Sabbath command in Deuteronomy was given to former slaves, so that even the poorest could rest and trust their Creator to provide. He came to see the Sabbath as a sign of trust rather than a Buddhist-style attempt to earn merit.", "lesson": "God gave the Sabbath as a gift of rest for the poor and the weary, not a burden on them.", "themes": "Sabbath, poverty, trusting God, Cambodia, God's grace", "bible": "Deuteronomy 5:12-15; Mark 2:27", "good": "sermon, Bible study and Sabbath School, mission emphasis", "kids": false, "by": "Pastor Scott Griswold", "src": "YouTube, ASAP Ministries", "w": 1052, "m": 335}, {"t": "From Soccer Player to Soul Winner", "u": "https://www.youtube.com/watch?v=XbU2tOIidro", "gist": "Born in Burma and raised in a Thai refugee camp, Soumong grew up in poverty with an alcoholic father. In the United States a Karen pastor studied the Bible with his parents, and they were baptized. Bored in church, Soumong prayed that if God helped his high school soccer team win a tournament he would work for Him. They barely won and his life changed. Now in college studying theology, he canvasses and shares Jesus online.", "lesson": "God hears bold, honest prayers and turns a struggling life into service.", "themes": "refugee youth, conversion, answered prayer, calling, canvassing", "bible": "Jeremiah 33:3; Psalm 34:8", "good": "youth, sermon, calling and education", "kids": false, "by": "Soumong", "src": "YouTube, ASAP Ministries", "w": 919, "m": 336}, {"t": "Myanmar:  Life and Death Among the Pretty Poppies", "u": "https://www.youtube.com/watch?v=rttSeXziWhE", "gist": "In Myanmar's opium-producing Golden Triangle, Winsane and his wife Nanu live in a tiny village where nearly everyone is addicted to poppies. He cares for the sick, including a man who injured himself while high, and runs a small school for children who might otherwise be sold as child brides. Progress is slow and some girls are lost, yet he stays, convinced God put him there.", "lesson": "Faithful presence in a hard place matters, even when results are slow.", "themes": "addiction, perseverance, missions, children, Myanmar", "bible": "Psalm 23:5; 1 John 4:4", "good": "sermon, mission emphasis, prayer meeting", "kids": false, "by": "Pastor Scott Griswold", "src": "YouTube, ASAP Ministries", "w": 987, "m": 337}, {"t": "From Marginalized to Missionary: One Teacher's Journey", "u": "https://www.youtube.com/watch?v=h5z990fqcFY&t=132s", "gist": "Boon Tim grew up in a poor Cambodian rice-farming family, hungry and soaked by a leaking roof. When his sister died, he became a monk for a short time as custom required, but stayed in the temple for years because it offered school and an easier life, while his family cut contact. A kind young woman who volunteered as a village missionary became his wife, and through her he became an Adventist, though for years he was troubled by dreams of chanting until he and his wife prayed and the dreams were replaced by visions of a beautiful river. He later became a church planter and then a teacher at a school for poor border children, using his own past to understand and help them.", "lesson": "God can use even a hard and wandering past to equip us to reach the people others cannot.", "themes": "Buddhist monk, poverty, conversion, teaching, Cambodia", "bible": "Romans 8:28; Genesis 50:20", "good": "sermon, calling and education, testimony", "kids": false, "by": "Boon Tim", "src": "YouTube, ASAP Ministries", "w": 926, "m": 337}, {"t": "From Buddhist to Atheist to Houston Missionary", "u": "https://www.youtube.com/watch?v=viR-_xZ39Vg", "gist": "Dylan grew up in a Laotian Buddhist family full of unanswered questions and, as a child, cried to an unknown God not to go to hell. In school and the Marines he drifted into mocking Christians and heavy drinking until he met a woman whose Adventist background led to long talks about faith. He chose Christ, then faced a hard test when his uncle died and family expected him to shave his head and become a monk, but he came in his suit and refused. Later a pastor who speaks Lao connected him to a Bible study, where he now translates the gospel for people who have never heard it.", "lesson": "Standing quietly for Christ in front of the family costs something, and God uses that stand.", "themes": "Buddhist background, conversion, family pressure, translation, courage", "bible": "Matthew 10:37; Galatians 2:20", "good": "sermon, testimony, youth", "kids": false, "by": "Dylan", "src": "YouTube, ASAP Ministries", "w": 926, "m": 339}, {"t": "Multiplying Hmong Disciples of Christ", "u": "https://www.youtube.com/watch?v=ka0yP0pHCUQ", "gist": "Pastor Chanchai, born to a Hmong shaman's family in Laos, meets Jesus through a relative and escapes with his family through the jungle, praying and singing each evening before swimming the Mekong to Thailand. He serves as a pastor for decades. Invited back to the United States, he begins visiting elderly Hmong people in Milwaukee and later holds Bible studies online during the pandemic, and more than twenty are baptized.", "lesson": "A refugee's faith becomes a ministry to his own people in a new land.", "themes": "Hmong, refugees, escape, church planting, perseverance", "bible": "Psalm 91:1-2; Acts 8:4", "good": "sermon, mission emphasis, evangelism and outreach", "kids": false, "by": "Pastor Chanchai", "src": "YouTube, ASAP Ministries", "w": 789, "m": 341}, {"t": "While You Were Sleeping", "u": "https://www.youtube.com/watch?v=z-Nktq-Sjsg", "gist": "Longwin, a police captain and third-generation Communist Party member, confiscated Bibles and arrested Christians. Moved by their courage and kindness, he read a confiscated Bible with his wife and, once healed of illness, left his career to follow Jesus. Today, as a district supervisor over 60 house churches, he rescues workers from jail, distributes sermon DVDs, and gives cows to poor churches.", "lesson": "One transformed life can multiply as a leader for the gospel under persecution.", "themes": "persecution, conversion, house church, leadership, healing", "bible": "Acts 9:1-6; Galatians 1:23", "good": "sermon, mission emphasis, prayer meeting", "kids": false, "by": "Pastor Scott Griswold", "src": "YouTube, ASAP Ministries", "w": 1053, "m": 341}, {"t": "Praying for Rain: A Modern-day Miracle Story From Myanmar", "u": "https://www.youtube.com/watch?v=2oVgq-SI8R4", "gist": "Si Moo is a rebellious teenage student at an ASAP mission school on the Thai-Myanmar border who slowly comes to believe in Jesus. His friends Albert and Day Day mock him and dare him to pray for rain in the dry season within one week. He prays morning and night, and on the sixth morning the sky opens. Both skeptics are baptized with him.", "lesson": "A simple, persistent prayer can break through a friend's doubt.", "themes": "prayer, answered prayer, miracles, student witness, friendship", "bible": "1 Kings 18:44; James 5:17-18", "good": "sermon, prayer meeting, youth", "kids": false, "by": "ASAP Ministries", "src": "YouTube, ASAP Ministries", "w": 752, "m": 344}, {"t": "One Bible Verse Changed His Life. Now He's a Missionary", "u": "https://www.youtube.com/watch?v=7XpGMYahWYI", "gist": "Nath, a poor Cambodian boy, enters an Adventist school where tuition is waived and slowly decides to follow Jesus even though his family does not believe. Over three years his parents begin Bible studies and accept Christ. After drifting for a season, he accepts a call to a district with no school, starts a free English class, and visits homes one by one until families open up to the gospel.", "lesson": "One child who is welcomed and taught can become the one who welcomes the next.", "themes": "education, calling, family conversion, church planting, perseverance", "bible": "Matthew 19:14; 2 Timothy 2:2", "good": "sermon, mission emphasis, children's story", "kids": true, "by": "ASAP Ministries", "src": "YouTube, ASAP Ministries", "w": 422, "m": 345}, {"t": "Woman of God in Thailand.", "u": "https://www.youtube.com/watch?v=KOLyI3eNIxM", "gist": "Kon Wasana, from a Muslim family in Thailand, married into a Christian family and was won over by her in-laws' love, especially when her mother-in-law told her the story of Ruth. She became a trained lay leader who now oversees four small groups. She befriended a poor woman who collected garbage and was dying of cancer; at the Buddhist funeral her church's singing astonished the family. Afterward the woman's in-laws and two of her children were baptized.", "lesson": "Steady, practical love opens hearts to Jesus even in grief.", "themes": "love, lay ministry, Thailand, conversion, funeral witness", "bible": "Ruth 1:16; John 13:35", "good": "sermon, family and women, mission emphasis", "kids": false, "by": "Kon Wasana (translated by Pastor Scott Griswold)", "src": "YouTube, ASAP Ministries", "w": 1248, "m": 361}, {"t": "A Miraculous Answer to Prayer", "u": "https://www.youtube.com/watch?v=OncLTw2AOVI&t=62s", "gist": "A children's mission story, told as a parallel to Acts 5. Ai Hung, an ASAP worker in a closed country, told Bible stories to a crowd until police beat her, tied her up, and drove her away in a truck. They threw her into the jungle at midnight, and she prayed. She felt lifted and found herself back in town. The next day she preached again, and many believed because God had saved her.", "lesson": "God protects those who share His good news, even when they are rejected.", "themes": "protection, persecution, courage, prayer, closed country", "bible": "Acts 5:19-20; Psalm 34:7", "good": "children's story, sermon, mission emphasis", "kids": true, "by": "ASAP Ministries", "src": "YouTube, ASAP Ministries", "w": 827, "m": 362}, {"t": "Top 7 Favorite Podcasts: Kurdish Refugees Dream of Jesus", "u": "https://www.youtube.com/watch?v=IZOAt_idOjk", "gist": "Two Adventist women in Iowa met a Kurdish refugee family who had fled ISIS, after first becoming acquainted through a vacation Bible school held in a rough neighborhood park. Church members helped with food and bedding and even found tuition help so the nine children could attend the church school. At their first Bible study the father told of a dream of a small stone growing into a mountain, which matched Daniel 2 exactly. Weeks later the mother described a dream in which a man in white robes protected her from soldiers and showed her scarred hands, which led them to Revelation 1 and to Jesus.", "lesson": "God reaches refugees through dreams and through ordinary neighbors who show up with practical love.", "themes": "refugees, dreams, Kurdish, friendship, Daniel", "bible": "Daniel 2:34-35; Revelation 1:13-16", "good": "sermon, mission emphasis, evangelism and outreach", "kids": false, "by": "Pastor Scott Griswold", "src": "YouTube, ASAP Ministries", "w": 1130, "m": 364}, {"t": "A Cambodian Village Transformed", "u": "https://www.youtube.com/watch?v=gaC2TCNQ9W4", "gist": "A widow in northern Cambodia prayed with church planter Suchet for people open to the Bible. Suchet, a former refugee-camp medical assistant, held health seminars at her house for her former church friends, who all came. Within a year seven were baptized. When the dry season left them without water, they prayed for months, and donors funded a well that served the whole village and drew in more neighbors.", "lesson": "Practical care opens hearts, and persistent prayer is answered in surprising ways.", "themes": "health ministry, answered prayer, Cambodia, church planting, water", "bible": "Matthew 25:35; James 5:16", "good": "sermon, mission emphasis, prayer meeting", "kids": false, "by": "ASAP Ministries", "src": "YouTube, ASAP Ministries", "w": 794, "m": 365}, {"t": "Mr. Win's Garbage Can Rescue", "u": "https://www.youtube.com/watch?v=P5o6KQqcZuU", "gist": "A Vietnamese salesman, Mr. Win, was given three religious DVDs that the owner was about to throw away. He watched them for three nights, contacted an ASAP missionary, and was baptized. His business slumped and he faced attacks at night, but after he prayed and put God first, a big contract came and old debts were repaid. He planted three house churches and shared the DVDs with pastors.", "lesson": "Truth headed for the trash can can change a province when someone receives it.", "themes": "media ministry, conversion, Vietnam, house church, Sabbath", "bible": "Matthew 6:33; Revelation 14:12", "good": "sermon, mission emphasis, stewardship", "kids": false, "by": "Pastor Scott Griswold", "src": "YouTube, ASAP Ministries", "w": 1139, "m": 367}, {"t": "Unreached, But Not Unreachable", "u": "https://www.youtube.com/watch?v=CV07H-F2OyA&t=64s", "gist": "A Thai ASAP supervisor and his wife began giving Bible studies in prisons, where officials were suspicious, and slowly gathered fifty or sixty inmates. One of them, a former gangster named Meng serving a long sentence for murder, grew hopeless after a fellow prisoner hung himself. Transferred to another prison, he overheard a Bible class reading about sins washed white as snow and asked whether a murderer could be forgiven. He accepted Jesus, was released early, and now writes encouraging letters to the believers still inside, a group that has grown and been given its own place to worship.", "lesson": "No sin is too big for God's forgiveness, and even a prison can become a place where a life begins again.", "themes": "prison ministry, forgiveness, conversion, Thailand, hope", "bible": "Isaiah 1:18; Matthew 25:36", "good": "sermon, evangelism and outreach, special services", "kids": false, "by": "ASAP Ministries", "src": "YouTube, ASAP Ministries", "w": 944, "m": 368}, {"t": "Bombing Raids and Baptisms: Life on the Front Lines of Missions", "u": "https://www.youtube.com/watch?v=VJ9kmMfI9QE", "gist": "Jasmine grew up in a refugee camp, moved to the United States, and then went back as a student missionary to a boarding school for displaced Karen students on the Thai-Myanmar border. She taught English and Bible, and a Buddhist student was baptized. When a fighter jet attacked the area during final exams, she chose to join her students in the cave where they were hiding. She says the experience showed her how much God wants to be with us.", "lesson": "Love for those we serve is a picture of God's willingness to come close to us.", "themes": "student missionary, refugees, bravery, Karen people, calling", "bible": "John 1:14; John 15:13", "good": "sermon, youth, mission emphasis", "kids": false, "by": "Jasmine", "src": "YouTube, ASAP Ministries", "w": 616, "m": 370}, {"t": "Myanmar:  From Snake Bite to Kidney Stones", "u": "https://www.youtube.com/watch?v=ZeLbhEeYvik", "gist": "As a six-year-old boy in Myanm
