gs. He gives simple baths and charcoal and invites his pastor and others to pray for her daily for a week. She is fully healed, and she, her husband and neighbors praise Jesus. The missionary is encouraged to keep working.", "lesson": "God's healing power wins hearts and encourages His workers.", "themes": "healing, medical missionary, Cambodia, persecution, prayer", "bible": "James 5:14-15, Psalm 103:2-3", "good": "sermon, prayer meeting, mission emphasis", "kids": false, "by": "Beng Korn", "src": "ASAP Ministries", "w": 384}, {"t": "Grandma \"Jonah\"", "u": "https://www.asapministries.org/stories/grandma-jonah", "gist": "Grandma Kongsri, a Thai church planter, hears God tell her to visit Noy Noy Village, a place she considers hopeless. She resists until a stuck lock reminds her of Jonah and she surrenders. In the village she meets a childhood friend and shares her testimony with four listening girls, starting a new ministry. Her little granddaughter later prays for her painful wrist and it is healed.", "lesson": "Obeying God's call even to places we avoid opens new doors.", "themes": "obedience, Jonah, church planting, children's prayer, healing", "bible": "Jonah 1:1-3, Isaiah 6:8", "good": "sermon, mission emphasis, children's story", "kids": true, "by": "Pastor Scott Griswold", "src": "ASAP Ministries", "w": 693}, {"t": "A Handful of Gifts and a Heart Full of Prayer", "u": "https://www.asapministries.org/stories/handful-gifts-and-heart-full-prayer", "gist": "After speaking at a Karen church in Minnesota, the author is surprised when members come forward holding envelopes with both hands. Thirty-two people give for refugees, totaling $769, though many are newly arrived and have little. She is moved to tears at their sacrificial giving.", "lesson": "Those who know need firsthand give generously out of little.", "themes": "generosity, sacrifice, refugees, stewardship, Karen church", "bible": "2 Corinthians 8:2-3, Mark 12:43-44", "good": "sermon, stewardship", "kids": false, "by": "Lisa Isensee", "src": "ASAP Ministries", "w": 463}, {"t": "Heaping Coals", "u": "https://www.asapministries.org/stories/heaping-coals", "gist": "Sim Thim, a young Cambodian believer, is mocked by his family and kept from classes and church by long daily water trips. His pastor decides the village needs a well and places it near the family's home. The act of kindness softens the parents and relatives, and the persecution stops.", "lesson": "Kindness toward persecutors can overcome evil with good.", "themes": "persecution, kindness, enemies, Cambodia, answered prayer", "bible": "Romans 12:20-21, Matthew 5:44", "good": "sermon, mission emphasis, children's story", "kids": true, "by": "Julia O'Carey", "src": "ASAP Ministries", "w": 266}, {"t": "Literacy Student Chhom Boran Finds a Way", "u": "https://www.asapministries.org/stories/literacy-student-chhom-boran-finds-way", "gist": "During heavy flooding in her Cambodian village, a literacy student prays for a way to reach school and church because she cannot swim and has no boat. She floats in a big cooking pan, paddling to the church-school. When her pastor asks if she was afraid, she says God is with her and the flood will not stop her.", "lesson": "Faith finds a way when circumstances seem impossible.", "themes": "faith, determination, childlike trust, answered prayer, education", "bible": "Psalm 56:3, Isaiah 43:2", "good": "children's story, sermon, mission emphasis", "kids": true, "by": "Chhom Boran", "src": "ASAP Ministries", "w": 293}, {"t": "Losing All, Gaining Christ", "u": "https://www.asapministries.org/stories/losing-all-gaining-christ", "gist": "A village chief in a closed country follows Christ and loses his position and freedom, spending time in jail. After his release he becomes a missionary, and a sick grandmother in the village is healed when he prays. Many others in the village come for prayer and healing. Within three years more than 100 meet weekly for worship and 97 are baptized.", "   const x=byId(best.dataset.open);peek.innerHTML=`<button data-open="${x.id}"><span class="pk-t">${esc(x.t)}<small>${V2?"":"≈"}${x.mins} min · ›</small></span><span class="pk-s">${esc(brief(x))}</span><span class="pk-p"><b>Point:</b> ${esc(x.lesson)}</span></button>`;
